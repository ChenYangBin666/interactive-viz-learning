<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN 游乐场 — CNN Playground</title>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
    <style>
        /* ========== Playground 3-Panel Layout ========== */
        .playground-container {
            display: grid;
            grid-template-columns: 250px 1fr 330px;
            gap: 1rem;
            min-height: calc(100vh - var(--header-height) - 6rem);
            margin-top: 1rem;
        }
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .panel-title svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ========== Header ========== */
        .playground-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .playground-header h1 { font-size: 1.5rem; margin-bottom: 0; }
        .playground-header h1 span { color: var(--accent-green); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ========== Preset Buttons ========== */
        .preset-btn {
            padding: 0.35rem 0.7rem;
            font-size: 0.78rem;
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid rgba(79, 195, 247, 0.3);
            color: var(--accent-blue);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .preset-btn:hover {
            background: rgba(79, 195, 247, 0.2);
            border-color: var(--accent-blue);
        }
        .preset-btn.active {
            background: rgba(79, 195, 247, 0.25);
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(79, 195, 247, 0.2);
        }

        /* ========== Left Panel — Input Config ========== */
        .config-group { margin-bottom: 0.75rem; }
        .config-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }
        .config-group select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .config-group select:focus { border-color: var(--accent-green); }

        .input-preview-container { margin-top:0.75rem; display:flex; flex-direction:column; align-items:center; }
        .input-grid { display:grid; gap:1px; background:var(--border-color); border:1px solid var(--border-color); border-radius:4px; overflow:hidden; }
        .input-grid .cell { width:100%; aspect-ratio:1; transition:background 0.15s; }
        .input-size-label { text-align:center; font-family:var(--font-mono); font-size:0.75rem; color:var(--text-muted); margin-top:0.5rem; }
        .input-legend { display:flex; align-items:center; gap:0.25rem; margin-top:0.5rem; font-size:0.7rem; color:var(--text-muted); }
        .legend-gradient { width:80px; height:8px; border-radius:4px; background:linear-gradient(to right,#1a1a2e,#4fc3f7,#16c79a,#ffd740,#ff5252); }
        .size-selector { display:flex; gap:0.3rem; }
        .size-selector button { flex:1; padding:0.3rem; font-size:0.78rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:var(--text-primary); cursor:pointer; font-family:var(--font-mono); transition:all 0.2s; }
        .size-selector button.active { background:rgba(22,199,154,0.15); border-color:var(--accent-green); color:var(--accent-green); }
        .size-selector button:hover { border-color:var(--accent-green); }

        /* ========== Center Panel — Network Builder ========== */
        .center-panel { overflow-y: auto; overflow-x: hidden; }
        .add-layer-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }
        .add-layer-btn {
            padding: 0.3rem 0.55rem;
            font-size: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .add-layer-btn:hover {
            border-color: var(--accent-green);
            background: rgba(22, 199, 154, 0.08);
        }
        .add-layer-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ========== Layer Config Popover ========== */
        .layer-config-popover { position:absolute; top:100%; left:0; margin-top:4px; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:0.75rem; z-index:50; min-width:200px; box-shadow:var(--shadow); display:none; }
        .layer-config-popover.show { display:block; }
        .layer-config-popover label { display:block; font-size:0.78rem; color:var(--text-secondary); margin-bottom:0.3rem; }
        .layer-config-popover select, .layer-config-popover input { width:100%; padding:0.35rem 0.5rem; background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:4px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; margin-bottom:0.5rem; outline:none; }
        .layer-config-popover .config-actions { display:flex; gap:0.4rem; margin-top:0.25rem; }

        /* ========== Pipeline ========== */
        .pipeline { display:flex; flex-direction:column; gap:0; flex:1; overflow-y:auto; padding-right:4px; }
        .pipeline-layer { display:flex; align-items:stretch; position:relative; cursor:pointer; transition:all 0.2s; animation:fadeInUp 0.25s ease-out; }
        .pipeline-layer:hover { z-index:2; }
        .pipeline-layer.selected { z-index:3; }
        .layer-connector { width:2px; height:12px; background:var(--border-color); margin:0 auto; position:relative; }
        .layer-connector::after { content:''; position:absolute; bottom:-3px; left:50%; transform:translateX(-50%); border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--border-color); }
        .layer-block { flex:1; display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.65rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); transition:all 0.2s; min-height:44px; }
        .layer-block:hover { border-color:var(--accent-green); box-shadow:0 0 8px rgba(22,199,154,0.1); }
        .pipeline-layer.selected .layer-block { border-color:var(--accent-green); background:rgba(22,199,154,0.05); box-shadow:0 0 12px rgba(22,199,154,0.15); }
        .layer-color-bar { width:4px; min-height:28px; border-radius:2px; flex-shrink:0; align-self:stretch; }
        .layer-info { flex:1; min-width:0; }
        .layer-name { font-size:0.82rem; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .layer-dims { font-family:var(--font-mono); font-size:0.7rem; color:var(--text-muted); margin-top:1px; }
        .layer-params-count { font-family:var(--font-mono); font-size:0.65rem; color:var(--accent-purple); margin-top:1px; }
        .layer-remove-btn { width:22px; height:22px; display:flex; align-items:center; justify-content:center; border:none; background:rgba(255,82,82,0.1); color:var(--accent-red); border-radius:50%; cursor:pointer; font-size:0.75rem; opacity:0; transition:all 0.2s; flex-shrink:0; }
        .pipeline-layer:hover .layer-remove-btn { opacity:1; }
        .layer-remove-btn:hover { background:rgba(255,82,82,0.25); }
        .pipeline-layer.input-layer .layer-remove-btn { display:none; }

        /* ========== Run Button ========== */
        .run-area { padding-top:0.75rem; border-top:1px solid var(--border-color); margin-top:0.75rem; display:flex; gap:0.5rem; align-items:center; }
        .run-btn { flex:1; padding:0.55rem 1rem; font-size:0.9rem; font-weight:700; background:var(--accent-green); border:none; border-radius:var(--radius-sm); color:var(--bg-primary); cursor:pointer; transition:all 0.2s; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:0.4rem; }
        .run-btn:hover { background:#13b58a; box-shadow:0 0 16px rgba(22,199,154,0.3); }
        .run-btn:active { transform:scale(0.97); }
        .run-btn.running { background:var(--accent-orange); pointer-events:none; }
        .run-btn svg { width:16px; height:16px; }
        .error-display { margin-top:0.5rem; padding:0.5rem 0.7rem; background:rgba(255,82,82,0.1); border:1px solid rgba(255,82,82,0.3); border-radius:var(--radius-sm); color:var(--accent-red); font-size:0.78rem; display:none; }
        .error-display.show { display:block; }

        /* ========== Right Panel — Output ========== */
        .right-panel { overflow-y:auto; }
        .stats-bar { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:0.75rem; }
        .stat-card { background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:0.5rem 0.65rem; text-align:center; }
        .stat-card .stat-value { font-family:var(--font-mono); font-size:1.1rem; font-weight:700; color:var(--accent-green); }
        .stat-card .stat-label { font-size:0.7rem; color:var(--text-muted); margin-top:2px; }

        /* ========== Feature Maps ========== */
        .feature-maps-section { flex:1; overflow-y:auto; }
        .feature-map-group { margin-bottom:0.75rem; padding:0.6rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); cursor:pointer; transition:all 0.2s; }
        .feature-map-group:hover { border-color:var(--accent-blue); }
        .feature-map-group.selected { border-color:var(--accent-green); box-shadow:0 0 10px rgba(22,199,154,0.15); }
        .fmg-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.4rem; }
        .fmg-header .fmg-title { font-size:0.78rem; font-weight:600; color:var(--text-primary); }
        .fmg-header .fmg-dims { font-family:var(--font-mono); font-size:0.68rem; color:var(--text-muted); }
        .fmg-grids { display:flex; flex-wrap:wrap; gap:4px; }
        .fmg-mini-grid { display:grid; gap:0; border:1px solid rgba(42,42,74,0.5); border-radius:2px; overflow:hidden; }
        .fmg-mini-grid .mcell { width:100%; aspect-ratio:1; }

        /* ========== Enlarged Modal ========== */
        .enlarge-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:center; justify-content:center; padding:2rem; }
        .enlarge-overlay.show { display:flex; }
        .enlarge-modal { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:1.5rem; max-width:700px; max-height:85vh; overflow-y:auto; position:relative; }
        .enlarge-modal .close-btn { position:absolute; top:0.75rem; right:0.75rem; width:28px; height:28px; border-radius:50%; border:1px solid var(--border-color); background:var(--bg-primary); color:var(--text-primary); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.9rem; transition:all 0.2s; }
        .enlarge-modal .close-btn:hover { border-color:var(--accent-red); color:var(--accent-red); }
        .enlarge-modal h3 { margin-bottom:1rem; color:var(--accent-green); }
        .enlarge-grids { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
        .enlarge-single { display:flex; flex-direction:column; align-items:center; gap:4px; }
        .enlarge-single .elabel { font-size:0.72rem; color:var(--text-muted); font-family:var(--font-mono); }
        .enlarge-grid { display:grid; gap:1px; background:var(--border-color); border:1px solid var(--border-color); border-radius:3px; overflow:hidden; }
        .enlarge-grid .ecell { width:100%; aspect-ratio:1; }

        /* ========== Flat Output ========== */
        .output-1d { display:flex; flex-wrap:wrap; gap:3px; padding:4px; }
        .output-1d .val-chip { font-family:var(--font-mono); font-size:0.6rem; padding:2px 4px; border-radius:3px; border:1px solid var(--border-color); min-width:28px; text-align:center; }

        /* ========== Misc ========== */
        .formula-row { display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.65rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-secondary); }
        .formula-row .katex { font-size:0.85em; }
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; color:var(--text-muted); text-align:center; flex:1; }
        .empty-state svg { width:48px; height:48px; margin-bottom:0.75rem; opacity:0.4; }
        .empty-state p { font-size:0.85rem; color:var(--text-muted); }
        .dim-flow { display:flex; align-items:center; flex-wrap:wrap; gap:0.15rem; margin-bottom:0.5rem; padding:0.4rem 0.5rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:0.68rem; overflow-x:auto; }
        .dim-flow .dim-item { padding:2px 5px; background:rgba(22,199,154,0.1); border-radius:3px; color:var(--accent-green); white-space:nowrap; }
        .dim-flow .dim-arrow { color:var(--text-muted); }

        /* ========== Animations ========== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 0 rgba(22, 199, 154, 0); }
            50% { box-shadow: 0 0 16px rgba(22, 199, 154, 0.3); }
        }
        .pipeline-layer.processing { animation: pulseGreen 0.6s ease-in-out; }

        /* ========== Responsive ========== */
        @media (max-width: 1200px) {
            .playground-container { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .playground-header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <div class="playground-header">
            <h1><span>CNN</span> 游乐场</h1>
            <div class="header-actions">
                <button class="preset-btn" onclick="loadPreset('simple')">Simple CNN</button>
                <button class="preset-btn" onclick="loadPreset('deep')">Deep CNN</button>
                <button class="preset-btn" onclick="loadPreset('vgg')">Mini VGG</button>
                <button class="btn btn-sm" onclick="resetPlayground()"
                        style="color:var(--accent-red);border-color:rgba(255,82,82,0.3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                        <path d="M3 12a9 9 0 019-9 9 9 0 019 9 9 9 0 01-9 9"/>
                        <path d="M3 12l3-3m-3 3l3 3"/>
                    </svg>
                    重置
                </button>
            </div>
        </div>

        <!-- Dimension flow bar -->
        <div class="dim-flow" id="dimFlow">
            <span class="dim-item">8×8×1</span>
        </div>

        <!-- 3-Panel Layout -->
        <div class="playground-container">
            <!-- Left Panel: Input Config -->
            <div class="panel" id="leftPanel">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 3v18"/>
                    </svg>
                    输入配置
                </div>

                <div class="config-group">
                    <label>输入图像类型</label>
                    <select id="inputType" onchange="updateInput()">
                        <option value="checkerboard">棋盘格 Checkerboard</option>
                        <option value="circles">同心圆 Circles</option>
                        <option value="diagonal">对角条纹 Diagonal</option>
                        <option value="noise">随机噪声 Noise</option>
                        <option value="edges">边缘线 Edges</option>
                        <option value="gradients">渐变 Gradient</option>
                    </select>
                </div>

                <div class="config-group">
                    <label>输入尺寸</label>
                    <div class="size-selector" id="sizeSelector">
                        <button onclick="setInputSize(8)" class="active">8×8</button>
                        <button onclick="setInputSize(12)">12×12</button>
                        <button onclick="setInputSize(16)">16×16</button>
                    </div>
                </div>

                <div class="input-preview-container">
                    <div class="input-grid" id="inputGrid"></div>
                    <div class="input-size-label" id="inputSizeLabel">8×8×1</div>
                    <div class="input-legend">
                        <span>0</span>
                        <div class="legend-gradient"></div>
                        <span>1</span>
                    </div>
                </div>

                <div style="margin-top:auto; padding-top:0.75rem; border-top:1px solid var(--border-color);">
                    <div class="formula-row" id="formulaBox">
                        <span>输出公式:</span>
                        <span id="formulaRender"></span>
                    </div>
                    <p style="font-size:0.72rem; color:var(--text-muted); margin:0;">
                        点击层查看特征图 · Ctrl+Enter 运行
                    </p>
                </div>
            </div>

            <!-- Center Panel: Network Builder -->
            <div class="panel center-panel" id="centerPanel">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="6" height="6" rx="1"/>
                        <rect x="9" y="7" width="6" height="6" rx="1"/>
                        <rect x="16" y="10" width="6" height="6" rx="1"/>
                        <path d="M8 7l1 1M15 10l1 1"/>
                    </svg>
                    网络构建
                </div>

                <!-- Add Layer Buttons -->
                <div class="add-layer-bar" style="position:relative;" id="addLayerBar">
                    <button class="add-layer-btn" onclick="showConvConfig(event)">
                        <span class="dot" style="background:#4fc3f7"></span>+ Conv
                    </button>
                    <button class="add-layer-btn" onclick="addLayer('relu')">
                        <span class="dot" style="background:#16c79a"></span>+ ReLU
                    </button>
                    <button class="add-layer-btn" onclick="addLayer('maxpool')">
                        <span class="dot" style="background:#ffab40"></span>+ MaxPool
                    </button>
                    <button class="add-layer-btn" onclick="addLayer('flatten')">
                        <span class="dot" style="background:#b388ff"></span>+ Flatten
                    </button>
                    <button class="add-layer-btn" onclick="showFCConfig(event)">
                        <span class="dot" style="background:#ab47bc"></span>+ FC
                    </button>

                    <!-- Conv config popover -->
                    <div class="layer-config-popover" id="convPopover">
                        <label>卷积核大小</label>
                        <select id="convKernelSize">
                            <option value="3">3×3</option>
                            <option value="5">5×5</option>
                        </select>
                        <label>滤波器数量 (1-8)</label>
                        <input type="number" id="convFilters" value="4" min="1" max="8">
                        <label>填充 Padding</label>
                        <select id="convPadding">
                            <option value="0">无 (valid)</option>
                            <option value="same">Same</option>
                        </select>
                        <div class="config-actions">
                            <button class="btn btn-sm btn-primary" onclick="confirmAddConv()">添加</button>
                            <button class="btn btn-sm" onclick="hidePopovers()">取消</button>
                        </div>
                    </div>

                    <!-- FC config popover -->
                    <div class="layer-config-popover" id="fcPopover">
                        <label>输出神经元数 (1-64)</label>
                        <input type="number" id="fcUnits" value="10" min="1" max="64">
                        <div class="config-actions">
                            <button class="btn btn-sm btn-primary" onclick="confirmAddFC()">添加</button>
                            <button class="btn btn-sm" onclick="hidePopovers()">取消</button>
                        </div>
                    </div>
                </div>

                <!-- Pipeline -->
                <div class="pipeline" id="pipeline"></div>

                <!-- Run area -->
                <div class="run-area">
                    <button class="run-btn" id="runBtn" onclick="runForwardPass()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                             width="16" height="16">
                            <polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>
                        </svg>
                        前向传播
                    </button>
                </div>
                <div class="error-display" id="errorDisplay"></div>
            </div>

            <!-- Right Panel: Output Visualization -->
            <div class="panel right-panel" id="rightPanel">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    输出可视化
                </div>

                <div class="stats-bar" id="statsBar">
                    <div class="stat-card">
                        <div class="stat-value" id="totalParams">0</div>
                        <div class="stat-label">总参数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalLayers">1</div>
                        <div class="stat-label">网络层数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="outputDims">8×8×1</div>
                        <div class="stat-label">输出维度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="flopsEst">0</div>
                        <div class="stat-label">FLOPs 估算</div>
                    </div>
                </div>

                <div class="feature-maps-section" id="featureMapsSection">
                    <div class="empty-state" id="emptyState">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        <p>点击「前向传播」运行网络<br>查看每层的特征图输出</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Enlarged Feature Map Overlay -->
    <div class="enlarge-overlay" id="enlargeOverlay" onclick="closeEnlarge(event)">
        <div class="enlarge-modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeEnlarge()">×</button>
            <h3 id="enlargeTitle">特征图详情</h3>
            <div class="enlarge-grids" id="enlargeGrids"></div>
        </div>
    </div>

    <script src="../shared/scripts/nav.js"></script>
    <script src="../shared/scripts/cnn-utils.js"></script>
    <script>
    /* ============================================================
     *  CNN Playground — Main Application Logic
     * ============================================================ */

    // ==================== State ====================
    let inputSize = 8;
    let inputType = 'checkerboard';
    let inputData = null;
    let layers = [];
    let layerOutputs = [];
    let selectedLayerIdx = -1;
    let layerIdCounter = 0;

    const CLR = {
        input: '#4fc3f7', conv: '#4fc3f7', relu: '#16c79a',
        maxpool: '#ffab40', flatten: '#b388ff', fc: '#ab47bc'
    };

    // ==================== Initialization ====================
    function init() {
        generateInput();
        renderInputGrid();
        renderPipeline();
        updateStats();
        renderFormula();
    }

    // ==================== Input Generation ====================
    function generateInput() {
        inputType = document.getElementById('inputType').value;
        if (inputType === 'diagonal') {
            inputData = CNNUtils.zerosMatrix(inputSize, inputSize);
            const period = Math.max(2, Math.floor(inputSize / 4));
            for (let i = 0; i < inputSize; i++) {
                for (let j = 0; j < inputSize; j++) {
                    const d = (i + j) % period;
                    inputData[i][j] = d === 0 ? 1 : (d === 1 ? 0.4 : 0);
                }
            }
        } else if (inputType === 'noise') {
            const rng = CNNUtils.seededRandom(Date.now() % 10000);
            inputData = Array.from({ length: inputSize }, () =>
                Array.from({ length: inputSize }, () => rng()));
        } else {
            inputData = CNNUtils.generateSampleImage(inputSize, inputType);
        }
    }

    function updateInput() {
        generateInput();
        renderInputGrid();
        clearOutputs();
    }

    function setInputSize(size) {
        inputSize = size;
        document.querySelectorAll('#sizeSelector button').forEach(b => {
            b.classList.toggle('active', parseInt(b.textContent) === size);
        });
        generateInput();
        renderInputGrid();
        clearOutputs();
        renderPipeline();
        updateStats();
    }

    function renderInputGrid() {
        const grid = document.getElementById('inputGrid');
        const cs = Math.max(8, Math.min(28, Math.floor(220 / inputSize)));
        grid.style.gridTemplateColumns = `repeat(${inputSize}, ${cs}px)`;
        grid.innerHTML = '';

        for (let i = 0; i < inputSize; i++) {
            for (let j = 0; j < inputSize; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.background = CNNUtils.valueToColor(inputData[i][j], 0, 1);
                cell.title = `[${i},${j}] = ${inputData[i][j].toFixed(3)}`;
                grid.appendChild(cell);
            }
        }
        document.getElementById('inputSizeLabel').textContent = `${inputSize}×${inputSize}×1`;
    }

    // ==================== Layer Management ====================
    function getLayerId() { return ++layerIdCounter; }

    function addLayer(type, config = {}) {
        hidePopovers();
        const id = getLayerId();
        const defaultConfigs = {
            conv:    { kernelSize: config.kernelSize || 3, filters: config.filters || 4, padding: config.padding || 0 },
            relu:    {},
            maxpool: { size: 2, stride: 2 },
            flatten: {},
            fc:      { units: config.units || 10 }
        };
        layers.push({ type, id, config: defaultConfigs[type] || {} });
        clearOutputs();
        renderPipeline();
        updateStats();
    }

    function removeLayer(idx) {
        layers.splice(idx, 1);
        clearOutputs();
        renderPipeline();
        updateStats();
    }

    function clearOutputs() {
        layerOutputs = [];
        selectedLayerIdx = -1;
        renderFeatureMaps();
        updateDimFlow();
    }

    // ==================== Popovers ====================
    function showConvConfig(e) {
        e.stopPropagation();
        hidePopovers();
        document.getElementById('convPopover').classList.add('show');
    }

    function showFCConfig(e) {
        e.stopPropagation();
        hidePopovers();
        document.getElementById('fcPopover').classList.add('show');
    }

    function hidePopovers() {
        document.querySelectorAll('.layer-config-popover').forEach(p =>
            p.classList.remove('show'));
    }

    function confirmAddConv() {
        const ks = parseInt(document.getElementById('convKernelSize').value);
        const f = Math.max(1, Math.min(8, parseInt(document.getElementById('convFilters').value) || 4));
        const padVal = document.getElementById('convPadding').value;
        const padding = padVal === 'same' ? Math.floor(ks / 2) : 0;
        addLayer('conv', { kernelSize: ks, filters: f, padding });
    }

    function confirmAddFC() {
        const units = Math.max(1, Math.min(64, parseInt(document.getElementById('fcUnits').value) || 10));
        addLayer('fc', { units });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-config-popover') && !e.target.closest('.add-layer-btn')) {
            hidePopovers();
        }
    });

    // ==================== Dimension Computation ====================
    function computeDimensions() {
        let h = inputSize, w = inputSize, c = 1;
        let flat = false, flatSize = 0;
        const dims = [];

        for (let i = 0; i < layers.length; i++) {
            const L = layers[i];
            let params = 0, error = null;

            try {
                if (flat) {
                    if (L.type === 'fc') {
                        params = flatSize * L.config.units + L.config.units;
                        flatSize = L.config.units;
                        dims.push({ h: 1, w: 1, c: flatSize, str: `${flatSize}`,
                                    params, flat: true, flatSize, error: null });
                    } else if (L.type === 'relu') {
                        dims.push({ h: 1, w: 1, c: flatSize, str: `${flatSize}`,
                                    params: 0, flat: true, flatSize, error: null });
                    } else {
                        dims.push({ h, w, c, str: '?', params: 0,
                                    flat, flatSize, error: 'Flatten后不可用' });
                    }
                    continue;
                }

                switch (L.type) {
                    case 'conv': {
                        const ks = L.config.kernelSize, f = L.config.filters, p = L.config.padding;
                        const nH = CNNUtils.computeOutputSize(h, ks, 1, p);
                        const nW = CNNUtils.computeOutputSize(w, ks, 1, p);
                        if (nH <= 0 || nW <= 0) {
                            error = `尺寸不足: ${h}×${w} 核${ks}`;
                            dims.push({ h, w, c, str: '?', params: 0, flat: false, flatSize: 0, error });
                            continue;
                        }
                        params = ks * ks * c * f + f;
                        h = nH; w = nW; c = f;
                        break;
                    }
                    case 'relu':
                        break;
                    case 'maxpool': {
                        const nH = CNNUtils.computeOutputSize(h, 2, 2, 0);
                        const nW = CNNUtils.computeOutputSize(w, 2, 2, 0);
                        if (nH <= 0 || nW <= 0) {
                            error = `尺寸不足: ${h}×${w} Pool2×2`;
                            dims.push({ h, w, c, str: '?', params: 0, flat: false, flatSize: 0, error });
                            continue;
                        }
                        h = nH; w = nW;
                        break;
                    }
                    case 'flatten':
                        flatSize = h * w * c;
                        flat = true;
                        dims.push({ h: 1, w: 1, c: flatSize, str: `${flatSize}`,
                                    params: 0, flat: true, flatSize, error: null });
                        continue;
                    case 'fc':
                        dims.push({ h, w, c, str: '?', params: 0,
                                    flat: false, flatSize: 0, error: '需先Flatten' });
                        continue;
                }

                dims.push({
                    h, w, c,
                    str: flat ? `${flatSize}` : `${h}×${w}×${c}`,
                    params, flat, flatSize, error
                });
            } catch (ex) {
                dims.push({ h, w, c, str: '?', params: 0, flat, flatSize, error: ex.message });
            }
        }
        return dims;
    }

    // ==================== Pipeline Rendering ====================
    function renderPipeline() {
        const pipe = document.getElementById('pipeline');
        pipe.innerHTML = '';

        // Input layer block (always present)
        pipe.appendChild(mkLayerEl('input', '输入层 Input',
            `${inputSize}×${inputSize}×1`, 0, -1, false, null));

        const dims = computeDimensions();

        layers.forEach((L, idx) => {
            // Connector arrow between layers
            const conn = document.createElement('div');
            conn.className = 'layer-connector';
            conn.style.margin = '0 auto';
            pipe.appendChild(conn);

            const d = dims[idx];
            let label = '';
            switch (L.type) {
                case 'conv':
                    label = `Conv2D (${L.config.kernelSize}×${L.config.kernelSize}, ` +
                            `${L.config.filters}f${L.config.padding > 0 ? `, p=${L.config.padding}` : ''})`;
                    break;
                case 'relu':    label = 'ReLU'; break;
                case 'maxpool': label = 'MaxPool 2×2'; break;
                case 'flatten': label = 'Flatten'; break;
                case 'fc':      label = `FC (${L.config.units})`; break;
            }
            pipe.appendChild(mkLayerEl(L.type, label,
                d ? d.str : '?', d ? d.params : 0, idx, true, d ? d.error : null));
        });

        updateDimFlow();
    }

    function mkLayerEl(type, label, dims, params, idx, removable, error) {
        const wrap = document.createElement('div');
        wrap.className = 'pipeline-layer' +
            (idx === -1 ? ' input-layer' : '') +
            (idx === selectedLayerIdx ? ' selected' : '');
        wrap.onclick = () => selectLayer(idx);

        const block = document.createElement('div');
        block.className = 'layer-block';
        if (error) block.style.borderColor = 'var(--accent-red)';

        // Color bar indicating layer type
        const bar = document.createElement('div');
        bar.className = 'layer-color-bar';
        bar.style.background = CLR[type] || '#666';
        block.appendChild(bar);

        // Layer info section
        const info = document.createElement('div');
        info.className = 'layer-info';

        const nameEl = document.createElement('div');
        nameEl.className = 'layer-name';
        nameEl.textContent = label;
        info.appendChild(nameEl);

        const dimsEl = document.createElement('div');
        dimsEl.className = 'layer-dims';
        dimsEl.textContent = error || dims;
        if (error) dimsEl.style.color = 'var(--accent-red)';
        info.appendChild(dimsEl);

        if (params > 0) {
            const paramsEl = document.createElement('div');
            paramsEl.className = 'layer-params-count';
            paramsEl.textContent = `${fmtN(params)} params`;
            info.appendChild(paramsEl);
        }
        block.appendChild(info);

        // Remove button (not shown on input layer)
        if (removable) {
            const rb = document.createElement('button');
            rb.className = 'layer-remove-btn';
            rb.innerHTML = '×';
            rb.onclick = (e) => { e.stopPropagation(); removeLayer(idx); };
            block.appendChild(rb);
        }

        wrap.appendChild(block);
        return wrap;
    }

    // ==================== Dimension Flow Bar ====================
    function updateDimFlow() {
        const dims = computeDimensions();
        let html = `<span class="dim-item">${inputSize}×${inputSize}×1</span>`;
        dims.forEach(d => {
            if (!d.error) {
                html += `<span class="dim-arrow">→</span><span class="dim-item">${d.str}</span>`;
            }
        });
        document.getElementById('dimFlow').innerHTML = html;
    }

    // ==================== Stats ====================
    function updateStats() {
        const dims = computeDimensions();
        let totalP = 0, totalF = 0;
        let lastD = { h: inputSize, w: inputSize, c: 1, str: `${inputSize}×${inputSize}×1`, flat: false };

        dims.forEach((d, i) => {
            totalP += d.params || 0;
            const L = layers[i];
            if (L && L.type === 'conv' && !d.error) {
                totalF += 2 * L.config.kernelSize * L.config.kernelSize *
                          (lastD.c || 1) * (d.c || 1) * (d.h || 1) * (d.w || 1);
            } else if (L && L.type === 'fc' && !d.error) {
                totalF += 2 * d.params;
            }
            if (!d.error) lastD = d;
        });

        document.getElementById('totalParams').textContent = fmtN(totalP);
        document.getElementById('totalLayers').textContent = layers.length + 1;
        document.getElementById('outputDims').textContent = lastD.str;
        document.getElementById('flopsEst').textContent = fmtN(totalF);
    }

    function fmtN(n) {
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return n.toString();
    }

    // ==================== Formula ====================
    function renderFormula() {
        const el = document.getElementById('formulaRender');
        if (typeof katex !== 'undefined') {
            katex.render('O = \\lfloor \\frac{W + 2P - K}{S} \\rfloor + 1', el, { throwOnError: false });
        } else {
            setTimeout(renderFormula, 500);
        }
    }

    // ==================== Forward Pass ====================
    function runForwardPass() {
        const btn = document.getElementById('runBtn');
        const errEl = document.getElementById('errorDisplay');
        errEl.classList.remove('show');

        // Validate network structure
        const dims = computeDimensions();
        if (dims.some(d => d.error)) {
            errEl.textContent = '网络结构中存在错误，请修正后再运行。';
            errEl.classList.add('show');
            return;
        }
        if (!layers.length) {
            errEl.textContent = '请先添加至少一层网络。';
            errEl.classList.add('show');
            return;
        }

        // Visual feedback
        btn.classList.add('running');
        btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></span> 计算中...';

        setTimeout(() => {
            try {
                executeForwardPass();
                renderFeatureMaps();
                if (layerOutputs.length > 0) selectLayer(layerOutputs.length - 1);
            } catch (e) {
                errEl.textContent = '运行出错: ' + e.message;
                errEl.classList.add('show');
            }
            btn.classList.remove('running');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
                'width="16" height="16"><polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>' +
                '</svg> 前向传播';
        }, 120);
    }

    function executeForwardPass() {
        layerOutputs = [];
        let cur = [inputData.map(r => [...r])];  // Start with 1 channel
        let flat = false, fd = null;
        const rng = CNNUtils.seededRandom(42);

        for (let i = 0; i < layers.length; i++) {
            const L = layers[i];

            // ---- After flatten: only FC and ReLU are valid ----
            if (flat) {
                if (L.type === 'fc') {
                    const inS = fd.length, outS = L.config.units;
                    const sc = Math.sqrt(2.0 / inS);
                    const out = [];
                    for (let o = 0; o < outS; o++) {
                        let sum = 0;
                        for (let k = 0; k < inS; k++) {
                            sum += fd[k] * ((rng() - 0.5) * 2 * sc);
                        }
                        out.push(sum);
                    }
                    fd = out;
                    layerOutputs.push({ type: 'fc', data1d: [...out], flat: true });
                } else if (L.type === 'relu') {
                    fd = fd.map(v => Math.max(0, v));
                    layerOutputs.push({ type: 'relu', data1d: [...fd], flat: true });
                } else {
                    layerOutputs.push({ type: L.type, data1d: fd ? [...fd] : [], flat: true, error: true });
                }
                continue;
            }

            // ---- Spatial operations ----
            switch (L.type) {
                case 'conv': {
                    const ks = L.config.kernelSize;
                    const nf = L.config.filters;
                    const pad = L.config.padding;
                    const sc = Math.sqrt(2.0 / (ks * ks * cur.length));
                    const newChannels = [];

                    for (let f = 0; f < nf; f++) {
                        const oH = CNNUtils.computeOutputSize(cur[0].length, ks, 1, pad);
                        const oW = CNNUtils.computeOutputSize(cur[0][0].length, ks, 1, pad);
                        let acc = CNNUtils.zerosMatrix(oH, oW);

                        // Sum convolution results across all input channels
                        for (let ch = 0; ch < cur.length; ch++) {
                            const kern = [];
                            for (let ki = 0; ki < ks; ki++) {
                                const krow = [];
                                for (let kj = 0; kj < ks; kj++) {
                                    krow.push((rng() - 0.5) * 2 * sc);
                                }
                                kern.push(krow);
                            }
                            acc = CNNUtils.matAdd(acc, CNNUtils.conv2d(cur[ch], kern, 1, pad));
                        }

                        // Add bias term
                        const bias = (rng() - 0.5) * 0.1;
                        newChannels.push(acc.map(r => r.map(v => v + bias)));
                    }
                    cur = newChannels;
                    layerOutputs.push({
                        type: 'conv',
                        channels: cur.map(ch => ch.map(r => [...r])),
                        flat: false
                    });
                    break;
                }
                case 'relu':
                    cur = cur.map(ch => CNNUtils.applyRelu2d(ch));
                    layerOutputs.push({
                        type: 'relu',
                        channels: cur.map(ch => ch.map(r => [...r])),
                        flat: false
                    });
                    break;

                case 'maxpool':
                    cur = cur.map(ch => CNNUtils.maxPool2d(ch, 2, 2));
                    layerOutputs.push({
                        type: 'maxpool',
                        channels: cur.map(ch => ch.map(r => [...r])),
                        flat: false
                    });
                    break;

                case 'flatten': {
                    fd = [];
                    for (const ch of cur)
                        for (const row of ch)
                            for (const v of row)
                                fd.push(v);
                    flat = true;
                    layerOutputs.push({ type: 'flatten', data1d: [...fd], flat: true });
                    break;
                }
            }
        }
    }

    // ==================== Feature Map Rendering ====================
    function renderFeatureMaps() {
        const sec = document.getElementById('featureMapsSection');
        const empty = document.getElementById('emptyState');

        if (!layerOutputs.length) {
            sec.innerHTML = '';
            sec.appendChild(empty);
            empty.style.display = 'flex';
            return;
        }

        empty.style.display = 'none';
        sec.innerHTML = '';

        // Show input as first feature map group
        sec.appendChild(mkFMGroup(-1, '输入 Input', [inputData], `${inputSize}×${inputSize}×1`));

        // Show each layer's output
        layerOutputs.forEach((out, idx) => {
            const L = layers[idx];
            const labelMap = {
                conv: `Conv2D #${idx + 1}`, relu: `ReLU #${idx + 1}`,
                maxpool: `MaxPool #${idx + 1}`, flatten: `Flatten #${idx + 1}`,
                fc: `FC #${idx + 1}`
            };
            const lbl = labelMap[L.type];

            if (out.flat) {
                sec.appendChild(mkFlatGroup(idx, lbl, out.data1d));
            } else {
                const h = out.channels[0].length;
                const w = out.channels[0][0].length;
                sec.appendChild(mkFMGroup(idx, lbl, out.channels, `${h}×${w}×${out.channels.length}`));
            }
        });
    }

    function mkFMGroup(idx, label, channels, dimsStr) {
        const g = document.createElement('div');
        g.className = 'feature-map-group' + (idx === selectedLayerIdx ? ' selected' : '');
        g.onclick = () => { selectLayer(idx); openEnlarge(idx); };

        const header = document.createElement('div');
        header.className = 'fmg-header';
        header.innerHTML = `<span class="fmg-title">${label}</span><span class="fmg-dims">${dimsStr}</span>`;
        g.appendChild(header);

        const gridsWrap = document.createElement('div');
        gridsWrap.className = 'fmg-grids';

        const h = channels[0].length, w = channels[0][0].length;
        const shown = channels.slice(0, 8);

        shown.forEach(ch => {
            const gs = Math.max(2, Math.min(6, Math.floor(50 / Math.max(h, w))));
            const mg = document.createElement('div');
            mg.className = 'fmg-mini-grid';
            mg.style.gridTemplateColumns = `repeat(${w}, ${gs}px)`;

            let mn = Infinity, mx = -Infinity;
            for (const r of ch) for (const v of r) { if (v < mn) mn = v; if (v > mx) mx = v; }
            if (mn === mx) { mn -= 1; mx += 1; }

            for (let i = 0; i < h; i++) {
                for (let j = 0; j < w; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'mcell';
                    cell.style.background = CNNUtils.valueToColor(ch[i][j], mn, mx);
                    mg.appendChild(cell);
                }
            }
            gridsWrap.appendChild(mg);
        });

        if (channels.length > 8) {
            const more = document.createElement('span');
            more.style.cssText = 'font-size:0.68rem;color:var(--text-muted);align-self:center;margin-left:4px;';
            more.textContent = `+${channels.length - 8}`;
            gridsWrap.appendChild(more);
        }

        g.appendChild(gridsWrap);
        return g;
    }

    function mkFlatGroup(idx, label, data1d) {
        const g = document.createElement('div');
        g.className = 'feature-map-group' + (idx === selectedLayerIdx ? ' selected' : '');
        g.onclick = () => { selectLayer(idx); openEnlarge(idx); };

        const header = document.createElement('div');
        header.className = 'fmg-header';
        header.innerHTML = `<span class="fmg-title">${label}</span><span class="fmg-dims">${data1d.length}</span>`;
        g.appendChild(header);

        const container = document.createElement('div');
        container.className = 'output-1d';

        let mn = Infinity, mx = -Infinity;
        for (const v of data1d) { if (v < mn) mn = v; if (v > mx) mx = v; }
        if (mn === mx) { mn -= 1; mx += 1; }

        const maxShow = 24;
        data1d.slice(0, maxShow).forEach(v => {
            const chip = document.createElement('span');
            chip.className = 'val-chip';
            chip.style.background = CNNUtils.valueToColor(v, mn, mx);
            const t = (v - mn) / (mx - mn);
            chip.style.color = (t > 0.3 && t < 0.8) ? '#000' : '#fff';
            chip.textContent = v.toFixed(2);
            container.appendChild(chip);
        });

        if (data1d.length > maxShow) {
            const more = document.createElement('span');
            more.style.cssText = 'font-size:0.68rem;color:var(--text-muted);align-self:center;';
            more.textContent = `...+${data1d.length - maxShow}`;
            container.appendChild(more);
        }

        g.appendChild(container);
        return g;
    }

    // ==================== Layer Selection ====================
    function selectLayer(idx) {
        selectedLayerIdx = idx;
        document.querySelectorAll('.pipeline-layer').forEach((el, i) =>
            el.classList.toggle('selected', (i - 1) === idx));
        document.querySelectorAll('.feature-map-group').forEach((el, i) =>
            el.classList.toggle('selected', (i - 1) === idx));
    }

    // ==================== Enlarged View ====================
    function openEnlarge(idx) {
        const overlay = document.getElementById('enlargeOverlay');
        const title = document.getElementById('enlargeTitle');
        const grids = document.getElementById('enlargeGrids');
        grids.innerHTML = '';

        let data, label;
        if (idx === -1) {
            data = { channels: [inputData], flat: false };
            label = '输入图像';
        } else if (idx < layerOutputs.length) {
            data = layerOutputs[idx];
            label = `${layers[idx].type.toUpperCase()} 层 #${idx + 1} 特征图`;
        } else {
            return;
        }
        title.textContent = label;

        if (data.flat) {
            // Render 1D data as colored value chips
            const d1 = data.data1d || [];
            let mn = Infinity, mx = -Infinity;
            for (const v of d1) { if (v < mn) mn = v; if (v > mx) mx = v; }
            if (mn === mx) { mn -= 1; mx += 1; }

            const container = document.createElement('div');
            container.className = 'output-1d';
            container.style.justifyContent = 'center';

            d1.forEach((v, i) => {
                const chip = document.createElement('span');
                chip.className = 'val-chip';
                chip.style.background = CNNUtils.valueToColor(v, mn, mx);
                const t = (v - mn) / (mx - mn);
                chip.style.color = (t > 0.3 && t < 0.8) ? '#000' : '#fff';
                chip.textContent = v.toFixed(3);
                chip.title = `[${i}] = ${v.toFixed(6)}`;
                container.appendChild(chip);
            });
            grids.appendChild(container);
        } else {
            // Render 2D feature maps as grids
            const chs = data.channels;
            const h = chs[0].length, w = chs[0][0].length;
            const cs = Math.max(4, Math.min(20,
                Math.floor(500 / Math.max(h, w) / Math.min(chs.length, 4))));

            chs.forEach((ch, ci) => {
                const single = document.createElement('div');
                single.className = 'enlarge-single';

                const lbl = document.createElement('div');
                lbl.className = 'elabel';
                lbl.textContent = chs.length > 1 ? `Ch ${ci}` : `${h}×${w}`;
                single.appendChild(lbl);

                const grid = document.createElement('div');
                grid.className = 'enlarge-grid';
                grid.style.gridTemplateColumns = `repeat(${w}, ${cs}px)`;

                let mn = Infinity, mx = -Infinity;
                for (const r of ch) for (const v of r) { if (v < mn) mn = v; if (v > mx) mx = v; }
                if (mn === mx) { mn -= 1; mx += 1; }

                for (let ri = 0; ri < h; ri++) {
                    for (let cj = 0; cj < w; cj++) {
                        const cell = document.createElement('div');
                        cell.className = 'ecell';
                        cell.style.background = CNNUtils.valueToColor(ch[ri][cj], mn, mx);
                        cell.title = `[${ri},${cj}] = ${ch[ri][cj].toFixed(4)}`;
                        grid.appendChild(cell);
                    }
                }
                single.appendChild(grid);

                const rangeLabel = document.createElement('div');
                rangeLabel.className = 'elabel';
                rangeLabel.textContent = `${mn.toFixed(2)} ~ ${mx.toFixed(2)}`;
                single.appendChild(rangeLabel);

                grids.appendChild(single);
            });
        }

        overlay.classList.add('show');
    }

    function closeEnlarge(e) {
        if (e && e.target !== document.getElementById('enlargeOverlay') && !e.target.closest('.close-btn')) return;
        document.getElementById('enlargeOverlay').classList.remove('show');
    }

    // ==================== Presets ====================
    function loadPreset(name) {
        layers = [];
        layerOutputs = [];
        selectedLayerIdx = -1;
        layerIdCounter = 0;

        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        const presets = {
            simple: [
                { type: 'conv', config: { kernelSize: 3, filters: 4, padding: 0 } },
                { type: 'relu', config: {} },
                { type: 'maxpool', config: { size: 2, stride: 2 } },
                { type: 'flatten', config: {} },
                { type: 'fc', config: { units: 10 } }
            ],
            deep: [
                { type: 'conv', config: { kernelSize: 3, filters: 4, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'conv', config: { kernelSize: 3, filters: 8, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'maxpool', config: { size: 2, stride: 2 } },
                { type: 'conv', config: { kernelSize: 3, filters: 8, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'flatten', config: {} },
                { type: 'fc', config: { units: 32 } },
                { type: 'relu', config: {} },
                { type: 'fc', config: { units: 10 } }
            ],
            vgg: [
                { type: 'conv', config: { kernelSize: 3, filters: 4, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'conv', config: { kernelSize: 3, filters: 4, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'maxpool', config: { size: 2, stride: 2 } },
                { type: 'conv', config: { kernelSize: 3, filters: 8, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'conv', config: { kernelSize: 3, filters: 8, padding: 1 } },
                { type: 'relu', config: {} },
                { type: 'maxpool', config: { size: 2, stride: 2 } },
                { type: 'flatten', config: {} },
                { type: 'fc', config: { units: 32 } },
                { type: 'relu', config: {} },
                { type: 'fc', config: { units: 10 } }
            ]
        };

        const preset = presets[name] || [];
        preset.forEach(l => {
            layers.push({ type: l.type, id: getLayerId(), config: { ...l.config } });
        });

        renderPipeline();
        updateStats();
        clearOutputs();
    }

    function resetPlayground() {
        layers = [];
        layerOutputs = [];
        selectedLayerIdx = -1;
        layerIdCounter = 0;
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('errorDisplay').classList.remove('show');
        renderPipeline();
        updateStats();
        renderFeatureMaps();
        updateDimFlow();
    }

    // ==================== Keyboard Shortcuts ====================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeEnlarge(); hidePopovers(); }
        if (e.key === 'Enter' && e.ctrlKey) runForwardPass();
    });

    // ==================== Bootstrap ====================
    document.addEventListener('DOMContentLoaded', () => init());
    </script>
</body>
</html>
