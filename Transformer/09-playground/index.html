<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09 - 应用与游乐场 | Transformer 学习</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* ========== Playground 3-Panel Layout ========== */
        .playground-wrapper {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            gap: 0;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            overflow: hidden;
        }
        .panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            padding: 1rem;
        }
        .panel:last-child { border-right: none; }

        .panel-header {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-green);
            padding-bottom: 0.6rem;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .panel-header .panel-icon { font-size: 1rem; }

        /* ---- Left: Config ---- */
        .config-section { margin-bottom: 1rem; }
        .config-section-title {
            font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem;
        }
        .config-row {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.55rem;
        }
        .config-row label { font-size: 0.82rem; color: var(--text-secondary); white-space: nowrap; }
        .config-row select, .config-row input[type="range"] { width: 100px; }

        select {
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 0.3rem 0.5rem; font-family: var(--font-mono); font-size: 0.8rem;
            cursor: pointer; outline: none; transition: border-color 0.2s;
        }
        select:focus { border-color: var(--accent-green); }

        .task-selector { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.6rem; }
        .task-option {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.65rem;
            border-radius: var(--radius-sm); border: 1px solid var(--border-color);
            cursor: pointer; font-size: 0.82rem; color: var(--text-secondary);
            transition: all 0.2s; background: transparent;
        }
        .task-option:hover { border-color: var(--accent-green); color: var(--text-primary); }
        .task-option.active {
            border-color: var(--accent-green); background: rgba(22,199,154,0.1);
            color: var(--accent-green); font-weight: 600;
        }
        .task-option .task-icon { font-size: 1rem; }

        .input-area {
            width: 100%; min-height: 56px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            color: var(--text-primary); font-family: var(--font-cn), var(--font-sans);
            font-size: 0.85rem; padding: 0.5rem; resize: vertical; outline: none;
            line-height: 1.5; transition: border-color 0.2s;
        }
        .input-area:focus { border-color: var(--accent-green); }

        .preset-row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
        .preset-btn {
            padding: 0.25rem 0.55rem; font-size: 0.72rem; border-radius: 9999px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-muted); cursor: pointer; font-family: var(--font-mono);
            transition: all 0.2s; white-space: nowrap;
        }
        .preset-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .preset-btn.active {
            border-color: var(--accent-green); background: rgba(22,199,154,0.12); color: var(--accent-green);
        }

        .run-btn {
            width: 100%; padding: 0.65rem; font-size: 0.95rem; font-weight: 700;
            border: none; border-radius: var(--radius-sm); background: var(--accent-green);
            color: var(--bg-primary); cursor: pointer; font-family: var(--font-cn), var(--font-sans);
            transition: all 0.25s; display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; margin-top: 0.6rem; flex-shrink: 0;
        }
        .run-btn:hover { background: #13b58a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,199,154,0.35); }
        .run-btn:active { transform: scale(0.98); }
        .run-btn.running { background: var(--accent-orange); pointer-events: none; }
        .run-btn .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(26,26,46,0.3);
            border-top-color: var(--bg-primary); border-radius: 50%;
            animation: spin 0.6s linear infinite; display: none;
        }
        .run-btn.running .spinner { display: inline-block; }
        .run-btn.running .run-label { display: none; }

        .speed-control {
            display: flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem;
            font-size: 0.75rem; color: var(--text-muted);
        }
        .speed-control .speed-btns { display: flex; gap: 0; }
        .speed-control .spd-btn {
            padding: 0.2rem 0.4rem; border: 1px solid var(--border-color); background: transparent;
            color: var(--text-muted); cursor: pointer; font-size: 0.7rem; font-family: var(--font-mono);
            transition: all 0.15s;
        }
        .speed-control .spd-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .speed-control .spd-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .speed-control .spd-btn + .spd-btn { border-left: none; }
        .speed-control .spd-btn.active {
            background: rgba(22,199,154,0.15); border-color: var(--accent-green); color: var(--accent-green);
        }

        .param-counter {
            margin-top: 0.6rem; padding: 0.6rem; background: var(--bg-card);
            border-radius: var(--radius-sm); border: 1px solid var(--border-color);
        }
        .param-counter .counter-title {
            font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.04em; margin-bottom: 0.3rem;
        }
        .param-counter .counter-value {
            font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--accent-green);
        }
        .param-counter .counter-detail {
            font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem;
            font-family: var(--font-mono); line-height: 1.5;
        }
        .slider-val {
            font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent-green);
            min-width: 28px; text-align: right;
        }

        .config-summary {
            margin-top: 0.5rem; padding: 0.45rem 0.6rem; background: rgba(22,199,154,0.06);
            border-radius: var(--radius-sm); border: 1px solid rgba(22,199,154,0.15);
            font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted);
            line-height: 1.6;
        }
        .config-summary strong { color: var(--accent-green); }

        /* ---- Center: Architecture ---- */
        .center-panel {
            background: var(--bg-secondary); border-right: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden;
        }
        .center-panel .panel-header { padding: 1rem 1rem 0.6rem; margin-bottom: 0; }

        .arch-container { flex: 1; position: relative; overflow: auto; padding: 0.5rem; }
        .arch-svg { width: 100%; height: 100%; min-height: 500px; }

        .arch-legend {
            display: flex; gap: 1rem; padding: 0.5rem 1rem; font-size: 0.72rem;
            color: var(--text-muted); border-top: 1px solid var(--border-color);
            flex-wrap: wrap; flex-shrink: 0;
        }
        .arch-legend-item { display: flex; align-items: center; gap: 0.35rem; }
        .arch-legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

        .step-indicator {
            position: absolute; top: 0.5rem; right: 0.75rem;
            background: rgba(15,52,96,0.92); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); padding: 0.4rem 0.7rem;
            font-size: 0.78rem; color: var(--accent-green); font-family: var(--font-mono);
            z-index: 10; backdrop-filter: blur(6px); max-width: 260px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .step-indicator .step-progress {
            height: 2px; background: var(--border-color); border-radius: 1px;
            margin-top: 0.3rem; overflow: hidden;
        }
        .step-indicator .step-progress-fill {
            height: 100%; background: var(--accent-green); transition: width 0.3s;
        }

        /* Arch node interactions */
        .arch-node { cursor: pointer; transition: opacity 0.3s; }
        .arch-node:hover .arch-box { filter: brightness(1.25); }
        .arch-node.dimmed { opacity: 0.25; }
        .arch-node.highlighted .arch-box {
            stroke-width: 2.5 !important;
            filter: drop-shadow(0 0 8px rgba(22,199,154,0.6));
        }

        /* Data flow particles */
        .data-particle {
            fill: var(--accent-green); opacity: 0;
        }
        .data-particle.active { opacity: 1; }

        /* ---- Right: Results ---- */
        .right-panel .tabs { margin-bottom: 0.8rem; flex-shrink: 0; }
        .right-panel .tab { padding: 0.45rem 0.75rem; font-size: 0.8rem; }
        .result-content { flex: 1; overflow-y: auto; }

        /* Attention */
        .attn-controls {
            display: flex; gap: 0.5rem; margin-bottom: 0.8rem; align-items: center; flex-wrap: wrap;
        }
        .attn-controls select { width: auto; min-width: 70px; }
        .attn-controls label { font-size: 0.78rem; color: var(--text-muted); }
        .heatmap-container { width: 100%; overflow: auto; }

        /* Output */
        .output-section { margin-bottom: 1rem; }
        .output-section-title {
            font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; margin-bottom: 0.5rem;
        }
        .token-flow { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.8rem; }
        .token-chip {
            padding: 0.3rem 0.55rem; border-radius: var(--radius-sm);
            font-size: 0.82rem; font-weight: 600;
            opacity: 0; transform: translateY(8px); transition: all 0.35s;
        }
        .token-chip.source {
            background: rgba(79,195,247,0.15); color: var(--accent-blue);
            border: 1px solid rgba(79,195,247,0.3);
        }
        .token-chip.target {
            background: rgba(22,199,154,0.15); color: var(--accent-green);
            border: 1px solid rgba(22,199,154,0.3);
        }
        .token-chip.visible { opacity: 1; transform: translateY(0); }
        .token-chip.current {
            box-shadow: 0 0 10px rgba(22,199,154,0.4);
            border-color: var(--accent-green);
        }
        .token-arrow {
            color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center;
            padding: 0 0.15rem; opacity: 0; transition: opacity 0.3s;
        }
        .token-arrow.visible { opacity: 1; }

        .prob-chart-container { height: 170px; margin-top: 0.5rem; }
        .generation-info {
            font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.6rem;
            padding: 0.4rem 0.6rem; background: var(--bg-card); border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-green);
        }

        /* Stats */
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem;
        }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); padding: 0.65rem; text-align: center;
        }
        .stat-card .stat-label {
            font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .stat-card .stat-value {
            font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700;
            color: var(--accent-green); margin-top: 0.15rem;
        }
        .stat-card .stat-unit { font-size: 0.65rem; color: var(--text-muted); }

        .formula-box {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); padding: 0.75rem; margin-bottom: 0.8rem; overflow-x: auto;
        }
        .formula-box .formula-title {
            font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.35rem;
        }
        .comparison-chart-container { height: 200px; margin-top: 0.5rem; }

        .breakdown-list {
            font-size: 0.78rem; color: var(--text-secondary); line-height: 1.8;
            font-family: var(--font-mono);
        }
        .breakdown-list .item-label { color: var(--text-muted); }
        .breakdown-list .item-value { color: var(--accent-green); font-weight: 600; }

        .layer-detail-table {
            width: 100%; font-size: 0.72rem; border-collapse: collapse; margin-top: 0.5rem;
        }
        .layer-detail-table th, .layer-detail-table td {
            padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border-color); text-align: left;
        }
        .layer-detail-table th {
            color: var(--text-muted); font-weight: 600; text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 0.04em;
        }
        .layer-detail-table td { color: var(--text-secondary); font-family: var(--font-mono); }
        .layer-detail-table td.val { color: var(--accent-green); font-weight: 600; }

        /* Keyboard hint */
        .kbd-hint {
            position: fixed; bottom: 0.5rem; left: 50%; transform: translateX(-50%);
            font-size: 0.68rem; color: var(--text-muted); opacity: 0.5; z-index: 100;
        }
        .kbd-hint kbd {
            padding: 0.1rem 0.35rem; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 3px; font-family: var(--font-mono); font-size: 0.65rem;
        }

        /* ---- Responsive ---- */
        @media (max-width: 1200px) {
            .playground-wrapper { grid-template-columns: 240px 1fr 300px; }
        }
        @media (max-width: 1024px) {
            .playground-wrapper {
                grid-template-columns: 1fr; grid-template-rows: auto 1fr auto;
                height: auto; min-height: calc(100vh - var(--header-height));
            }
            .panel { border-right: none; border-bottom: 1px solid var(--border-color); max-height: none; }
            .center-panel { min-height: 420px; }
            .kbd-hint { display: none; }
        }
    </style>
</head>
<body>

<!-- ============ 3-Panel Playground ============ -->
<div class="playground-wrapper">

    <!-- ====== LEFT: Configuration ====== -->
    <div class="panel" id="configPanel">
        <div class="panel-header">
            <span class="panel-icon">&#9881;</span> 配置
        </div>

        <!-- Task Selector -->
        <div class="config-section">
            <div class="config-section-title">任务类型</div>
            <div class="task-selector" id="taskSelector">
                <div class="task-option active" data-task="translation">
                    <span class="task-icon">&#127760;</span> 翻译
                </div>
                <div class="task-option" data-task="generation">
                    <span class="task-icon">&#9998;</span> 文本生成
                </div>
                <div class="task-option" data-task="attention">
                    <span class="task-icon">&#128269;</span> 注意力探索
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="config-section">
            <div class="config-section-title">输入文本</div>
            <div class="preset-row" id="inputPresets"></div>
            <textarea class="input-area" id="inputText" rows="2" spellcheck="false">机器 学习 改变 了 世界</textarea>
        </div>

        <!-- Model Presets -->
        <div class="config-section">
            <div class="config-section-title">模型预设</div>
            <div class="preset-row" id="modelPresets">
                <button class="preset-btn" data-preset="tiny">Tiny</button>
                <button class="preset-btn active" data-preset="small">Transformer-Small</button>
                <button class="preset-btn" data-preset="base">Transformer-Base</button>
            </div>
        </div>

        <!-- Model Config -->
        <div class="config-section">
            <div class="config-section-title">模型参数</div>
            <div class="config-row">
                <label>d_model</label>
                <select id="cfgDModel">
                    <option value="8">8</option>
                    <option value="16" selected>16</option>
                    <option value="32">32</option>
                    <option value="64">64</option>
                </select>
            </div>
            <div class="config-row">
                <label>num_heads</label>
                <select id="cfgHeads">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="4">4</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div class="config-row">
                <label>num_layers</label>
                <select id="cfgLayers">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="6">6</option>
                </select>
            </div>
            <div class="config-row">
                <label>d_ff 倍数</label>
                <select id="cfgFF">
                    <option value="2">2x</option>
                    <option value="4" selected>4x</option>
                    <option value="8">8x</option>
                </select>
            </div>
            <div class="config-row">
                <label>dropout</label>
                <div style="display:flex; align-items:center; gap:0.4rem;">
                    <input type="range" id="cfgDropout" min="0" max="3" step="1" value="1" style="width:70px;">
                    <span class="slider-val" id="dropoutVal">0.1</span>
                </div>
            </div>
        </div>

        <!-- Config Summary -->
        <div class="config-summary" id="configSummary"></div>

        <!-- Parameter Counter -->
        <div class="param-counter" id="paramCounter">
            <div class="counter-title">总参数量</div>
            <div class="counter-value" id="paramValue">--</div>
            <div class="counter-detail" id="paramDetail"></div>
        </div>

        <!-- Speed Control -->
        <div class="speed-control">
            <span>动画速度:</span>
            <div class="speed-btns" id="speedBtns">
                <button class="spd-btn" data-speed="0.5">0.5x</button>
                <button class="spd-btn active" data-speed="1">1x</button>
                <button class="spd-btn" data-speed="2">2x</button>
                <button class="spd-btn" data-speed="4">4x</button>
            </div>
        </div>

        <!-- Run Button -->
        <button class="run-btn" id="runBtn">
            <span class="spinner"></span>
            <span class="run-label">&#9654; 运行</span>
        </button>
    </div>

    <!-- ====== CENTER: Architecture Viz ====== -->
    <div class="center-panel" id="centerPanel">
        <div class="panel-header" style="padding:1rem 1rem 0.6rem;">
            <span class="panel-icon">&#9645;</span> 架构可视化
        </div>
        <div class="arch-container" id="archContainer">
            <div class="step-indicator" id="stepIndicator" style="display:none;">
                <div>步骤: <span id="stepText">--</span></div>
                <div class="step-progress"><div class="step-progress-fill" id="stepProgressFill" style="width:0%;"></div></div>
            </div>
            <svg class="arch-svg" id="archSvg"></svg>
        </div>
        <div class="arch-legend" id="archLegend">
            <div class="arch-legend-item"><div class="arch-legend-swatch" style="background:rgba(79,195,247,0.6);"></div> 嵌入层</div>
            <div class="arch-legend-item"><div class="arch-legend-swatch" style="background:rgba(22,199,154,0.6);"></div> 多头注意力</div>
            <div class="arch-legend-item"><div class="arch-legend-swatch" style="background:rgba(179,136,255,0.6);"></div> 前馈网络</div>
            <div class="arch-legend-item"><div class="arch-legend-swatch" style="background:rgba(255,171,64,0.6);"></div> 层归一化</div>
            <div class="arch-legend-item"><div class="arch-legend-swatch" style="background:rgba(255,82,82,0.6);"></div> 输出层</div>
        </div>
    </div>

    <!-- ====== RIGHT: Results ====== -->
    <div class="panel right-panel" id="rightPanel">
        <div class="panel-header">
            <span class="panel-icon">&#9776;</span> 结果
        </div>

        <div class="tabs" id="resultTabs">
            <button class="tab active" data-tab="attention">注意力图</button>
            <button class="tab" data-tab="output">输出</button>
            <button class="tab" data-tab="stats">统计</button>
        </div>

        <div class="result-content">
            <!-- Tab: Attention Maps -->
            <div class="tab-content active" id="tabAttention">
                <div class="attn-controls">
                    <label>层:</label>
                    <select id="attnLayer"></select>
                    <label>头:</label>
                    <select id="attnHead"></select>
                    <label>显示:</label>
                    <select id="attnDisplay">
                        <option value="single">单头</option>
                        <option value="average">平均</option>
                    </select>
                </div>
                <div id="attnHeadDescription" style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.5rem;"></div>
                <div class="heatmap-container" id="heatmapContainer"></div>
                <div id="attnInsight" style="font-size:0.72rem; color:var(--text-muted); margin-top:0.5rem; padding:0.4rem; background:var(--bg-card); border-radius:var(--radius-sm); display:none;"></div>
            </div>

            <!-- Tab: Output -->
            <div class="tab-content" id="tabOutput">
                <div class="generation-info" id="generationInfo" style="display:none;"></div>
                <div class="output-section">
                    <div class="output-section-title" id="outputSourceTitle">源序列（中文）</div>
                    <div class="token-flow" id="sourceTokens"></div>
                </div>
                <div class="output-section">
                    <div class="output-section-title" id="outputTargetTitle">目标序列（英文）</div>
                    <div class="token-flow" id="targetTokens"></div>
                </div>
                <div class="output-section">

<script>
(function() {
    'use strict';

    /* ================================================================
       CONSTANTS & STATE
    ================================================================ */
    const DROPOUT_LEVELS = [0.0, 0.1, 0.2, 0.3];
    const VOCAB_SIZE = 5000;
    const MAX_SEQ_LEN = 512;

    const PRESETS = {
        tiny:  { dModel: 8,  heads: 1, layers: 1, ff: 2,  dropout: 0 },
        small: { dModel: 16, heads: 2, layers: 2, ff: 4,  dropout: 1 },
        base:  { dModel: 64, heads: 8, layers: 6, ff: 4,  dropout: 1 },
    };

    const INPUT_PRESETS = {
        translation: [
            { label: '示例1', text: '机器 学习 改变 了 世界' },
            { label: '示例2', text: '我 喜欢 深度 学习' },
            { label: '长句', text: '自然 语言 处理 是 人工 智能 最 重要 的 研究 方向 之一' },
        ],
        generation: [
            { label: '天气', text: '今天 天气' },
            { label: '未来', text: '深度 学习 的 未来' },
            { label: '改变', text: '人工 智能 将 改变' },
        ],
        attention: [
            { label: '代词', text: '小猫 坐在 垫子 上 因为 它 很 柔软' },
            { label: '简单', text: '我 喜欢 深度 学习' },
            { label: '长句', text: '自然 语言 处理 是 人工 智能 最 重要 的 研究 方向 之一' },
        ]
    };

    const TRANSLATION_TARGETS = {
        '机器 学习 改变 了 世界': {
            tokens: ['Machine', 'learning', 'changed', 'the', 'world'],
            alignments: [[0,0],[1,1],[2,2],[3,3],[4,4]]
        },
        '我 喜欢 深度 学习': {
            tokens: ['I', 'like', 'deep', 'learning'],
            alignments: [[0,0],[1,1],[2,2],[3,3]]
        },
        '自然 语言 处理 是 人工 智能 最 重要 的 研究 方向 之一': {
            tokens: ['Natural', 'language', 'processing', 'is', 'one', 'of', 'the', 'most', 'important', 'research', 'areas', 'in', 'AI'],
            alignments: [[0,0],[1,1],[2,2],[3,3],[4,11],[5,12],[6,7],[7,8],[9,9],[10,10]]
        },
    };

    const GENERATION_CONT = {
        '今天 天气': ['很', '好', '适合', '出去', '散步'],
        '深度 学习 的 未来': ['充满', '了', '无限', '可能', '性'],
        '人工 智能 将 改变': ['我们', '的', '生活', '方式'],
    };

    let attentionData = null;
    let animSpeed = 1;
    let state = {
        task: 'translation', dModel: 16, heads: 2, layers: 2,
        ffMult: 4, dropout: 0.1, running: false
    };
    let probChartInst = null;
    let compChartInst = null;
    let archNodeMap = {};  // maps component-id -> SVG group

    /* ================================================================
       DOM UTILITIES
    ================================================================ */
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const cfgDModel = $('#cfgDModel'), cfgHeads = $('#cfgHeads'),
          cfgLayers = $('#cfgLayers'), cfgFF = $('#cfgFF'),
          cfgDropout = $('#cfgDropout'), dropoutVal = $('#dropoutVal'),
          inputText = $('#inputText'), runBtn = $('#runBtn'),
          archSvg = $('#archSvg'), attnLayerSel = $('#attnLayer'),
          attnHeadSel = $('#attnHead'), attnDisplay = $('#attnDisplay'),
          stepIndicator = $('#stepIndicator'), stepText = $('#stepText'),
          stepProgressFill = $('#stepProgressFill');

    /* ================================================================
       INITIALIZATION
    ================================================================ */
    async function init() {
        try {
            const resp = await fetch('../shared/data/attention-data.json');
            attentionData = await resp.json();
        } catch (e) {
            console.warn('注意力数据加载失败，使用合成数据');
        }

        bindEvents();
        readConfig();
        updateInputPresets();
        updateConfigSummary();
        updateParamCount();
        drawArchitecture();
        populateAttnSelectors();
        renderAttentionHeatmap();
        updateStats();
        renderParamFormula();
        updateLayerDetailTable();
        renderComparisonChart();
        updateOutputTabLabels();
    }

    /* ================================================================
       EVENT BINDING
    ================================================================ */
    function bindEvents() {
        /* Task selector */
        $$('#taskSelector .task-option').forEach(el => {
            el.addEventListener('click', () => {
                $$('#taskSelector .task-option').forEach(o => o.classList.remove('active'));
                el.classList.add('active');
                state.task = el.dataset.task;
                updateInputPresets();
                updateOutputTabLabels();
            });
        });

        /* Model presets */
        $$('#modelPresets .preset-btn').forEach(el => {
            el.addEventListener('click', () => {
                $$('#modelPresets .preset-btn').forEach(o => o.classList.remove('active'));
                el.classList.add('active');
                applyPreset(el.dataset.preset);
            });
        });

        /* Config dropdowns */
        [cfgDModel, cfgHeads, cfgLayers, cfgFF].forEach(sel => {
            sel.addEventListener('change', onConfigChange);
        });

        cfgDropout.addEventListener('input', () => {
            state.dropout = DROPOUT_LEVELS[+cfgDropout.value];
            dropoutVal.textContent = state.dropout.toFixed(1);
            updateConfigSummary();
        });

        /* Result tabs */
        $$('#resultTabs .tab').forEach(tab => {
            tab.addEventListener('click', () => {
                $$('#resultTabs .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                $$('.tab-content').forEach(tc => tc.classList.remove('active'));
                const id = 'tab' + capitalize(tab.dataset.tab);
                document.getElementById(id).classList.add('active');
            });
        });

        /* Attention selectors */
        attnLayerSel.addEventListener('change', renderAttentionHeatmap);
        attnHeadSel.addEventListener('change', renderAttentionHeatmap);
        attnDisplay.addEventListener('change', renderAttentionHeatmap);

        /* Run */
        runBtn.addEventListener('click', runPlayground);

        /* Speed */
        $$('#speedBtns .spd-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                $$('#speedBtns .spd-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                animSpeed = parseFloat(btn.dataset.speed);
            });
        });

        /* Keyboard shortcuts */
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === 'Enter') { e.preventDefault(); runPlayground(); }
            if (e.key === '1') selectTask('translation');
            if (e.key === '2') selectTask('generation');
            if (e.key === '3') selectTask('attention');
            if (e.key === 't' || e.key === 'T') cycleResultTab();
        });
    }

    function selectTask(task) {
        $$('#taskSelector .task-option').forEach(o => {
            o.classList.toggle('active', o.dataset.task === task);
        });
        state.task = task;
        updateInputPresets();
        updateOutputTabLabels();
    }

    function cycleResultTab() {
        const tabs = [...$$('#resultTabs .tab')];
        const idx = tabs.findIndex(t => t.classList.contains('active'));
        tabs[idx].classList.remove('active');
        const next = tabs[(idx + 1) % tabs.length];
        next.classList.add('active');
        $$('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.getElementById('tab' + capitalize(next.dataset.tab)).classList.add('active');
    }

    function onConfigChange() {
        readConfig();
        $$('#modelPresets .preset-btn').forEach(o => o.classList.remove('active'));
        updateConfigSummary();
        updateParamCount();
        drawArchitecture();
        populateAttnSelectors();
        renderAttentionHeatmap();
        updateStats();
        updateLayerDetailTable();
        renderComparisonChart();
    }

    /* ================================================================
       CONFIG MANAGEMENT
    ================================================================ */
    function readConfig() {
        state.dModel = +cfgDModel.value;
        state.heads = +cfgHeads.value;
        state.layers = +cfgLayers.value;
        state.ffMult = +cfgFF.value;
        state.dropout = DROPOUT_LEVELS[+cfgDropout.value];
    }

    function applyPreset(name) {
        const p = PRESETS[name]; if (!p) return;
        cfgDModel.value = p.dModel;
        cfgHeads.value = p.heads;
        cfgLayers.value = p.layers;
        cfgFF.value = p.ff;
        cfgDropout.value = p.dropout;
        dropoutVal.textContent = DROPOUT_LEVELS[p.dropout].toFixed(1);
        readConfig();
        updateConfigSummary();
        updateParamCount();
        drawArchitecture();
        populateAttnSelectors();
        renderAttentionHeatmap();
        updateStats();
        updateLayerDetailTable();
        renderComparisonChart();
    }

    function updateInputPresets() {
        const ct = $('#inputPresets');
        ct.innerHTML = '';
        const presets = INPUT_PRESETS[state.task] || [];
        presets.forEach((p, i) => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
            btn.textContent = p.label;
            btn.addEventListener('click', () => {
                ct.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                inputText.value = p.text;
            });
            ct.appendChild(btn);
        });
        if (presets.length > 0) inputText.value = presets[0].text;
    }

    function updateOutputTabLabels() {
        const srcT = $('#outputSourceTitle'), tgtT = $('#outputTargetTitle');
        const alignSec = $('#alignmentSection'), genInfo = $('#generationInfo');
        genInfo.style.display = 'none';
        if (state.task === 'translation') {
            srcT.textContent = '源序列（中文）'; tgtT.textContent = '目标序列（英文）';
            alignSec.style.display = 'block';
        } else if (state.task === 'generation') {
            srcT.textContent = '输入序列'; tgtT.textContent = '自回归生成';
            alignSec.style.display = 'none';
        } else {
            srcT.textContent = '输入序列'; tgtT.textContent = '注意力加权表示';
            alignSec.style.display = 'none';
        }
    }

    function updateConfigSummary() {
        const dk = Math.floor(state.dModel / state.heads);
        const dff = state.dModel * state.ffMult;
        $('#configSummary').innerHTML =
            `<strong>d_model</strong>=${state.dModel} &middot; ` +
            `<strong>h</strong>=${state.heads} &middot; ` +
            `<strong>N</strong>=${state.layers} &middot; ` +
            `<strong>d_k</strong>=${dk} &middot; ` +
            `<strong>d_ff</strong>=${dff} &middot; ` +
            `<strong>dropout</strong>=${state.dropout}`;
    }

    /* ================================================================
       PARAMETER CALCULATION
    ================================================================ */
    function calcParams() {
        const d = state.dModel, h = state.heads, N = state.layers;
        const dff = d * state.ffMult, V = VOCAB_SIZE;

        const embedParams = V * d * 2;      // src + tgt embedding tables
        const posEmbed = MAX_SEQ_LEN * d;    // positional encoding params (if learned)
        const mhaParams = 4 * (d * d + d);   // Wq, Wk, Wv, Wo + biases
        const ffnParams = d * dff + dff + dff * d + d;  // W1, b1, W2, b2
        const lnParams = 2 * 2 * d;          // 2 layer norms per encoder layer, each gamma+beta
        const encLayerParams = mhaParams + ffnParams + lnParams;
        const decLnParams = 3 * 2 * d;       // 3 layer norms in decoder
        const decLayerParams = mhaParams * 2 + ffnParams + decLnParams; // self-attn + cross-attn + FFN
        const outParams = d * V + V;          // final linear + bias

        const totalEnc = N * encLayerParams;
        const totalDec = N * decLayerParams;
        const total = embedParams + posEmbed + totalEnc + totalDec + outParams;

        return {
            total, embedParams, posEmbed, totalEnc, totalDec, outParams,
            encLayerParams, decLayerParams, mhaParams, ffnParams, lnParams, decLnParams,
            d, h, N, dff, V
        };
    }

    function calcFlops() {
        const d = state.dModel, N = state.layers, dff = d * state.ffMult;
        const L = getTokens().length || 6;
        const attnFlops = 4 * L * d * d + 2 * L * L * d;
        const ffnFlops = 2 * L * d * dff;
        const encFlops = N * (attnFlops + ffnFlops);
        const decFlops = N * (attnFlops * 2 + ffnFlops); // self + cross attn
        return encFlops + decFlops;
    }

    function calcMemory() {
        return (calcParams().total * 4) / (1024 * 1024); // FP32
    }

    function formatNum(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return String(Math.round(n));
    }

    function updateParamCount() {
        const p = calcParams();
        $('#paramValue').textContent = formatNum(p.total);
        $('#paramDetail').innerHTML =
            `<span class="item-label">嵌入:</span> <span class="item-value">${formatNum(p.embedParams + p.posEmbed)}</span><br>` +
            `<span class="item-label">编码器:</span> <span class="item-value">${formatNum(p.totalEnc)}</span><br>` +
            `<span class="item-label">解码器:</span> <span class="item-value">${formatNum(p.totalDec)}</span><br>` +
            `<span class="item-label">输出层:</span> <span class="item-value">${formatNum(p.outParams)}</span>`;
    }

    /* ================================================================
       ARCHITECTURE DIAGRAM (D3/SVG)
    ================================================================ */
    function drawArchitecture() {
        const svg = d3.select('#archSvg');
        svg.selectAll('*').remove();
        archNodeMap = {};

        const cw = document.getElementById('archContainer').clientWidth;
        const W = Math.max(580, cw - 16);
        const N = state.layers;
        const compH = 24, gap = 7, stackPad = 38;

        const encComps = 4; // MHA, Norm, FFN, Norm
        const decComps = 6; // MaskedMHA, Norm, CrossAttn, Norm, FFN, Norm
        const encLayerH = encComps * (compH + gap) + 10;
        const decLayerH = decComps * (compH + gap) + 10;
        const stackH_enc = N * encLayerH + stackPad;
        const stackH_dec = N * decLayerH + stackPad;
        const maxStack = Math.max(stackH_enc, stackH_dec);
        const H = maxStack + 180;

        svg.attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').attr('height', H);

        const encX = W * 0.18, decX = W * 0.58;
        const boxW = W * 0.30, compW = boxW - 24;

        /* Colors */
        const C = {
            embed: ['rgba(79,195,247,0.45)', 'rgba(79,195,247,0.8)'],
            mha:   ['rgba(22,199,154,0.4)', 'rgba(22,199,154,0.75)'],
            ffn:   ['rgba(179,136,255,0.4)', 'rgba(179,136,255,0.75)'],
            norm:  ['rgba(255,171,64,0.3)', 'rgba(255,171,64,0.65)'],
            out:   ['rgba(255,82,82,0.4)', 'rgba(255,82,82,0.75)'],
            bg:    'rgba(42,42,74,0.18)', bgS: 'rgba(42,42,74,0.55)',
            arrow: '#4a4a6a', txt: '#e8e8e8', dim: '#7c7c9c',
        };

        /* Defs: markers */
        const defs = svg.append('defs');
        [['ah', C.arrow], ['ahG', '#16c79a']].forEach(([id, fill]) => {
            defs.append('marker').attr('id', id)
                .attr('viewBox', '0 0 10 7').attr('refX', 10).attr('refY', 3.5)
                .attr('markerWidth', 8).attr('markerHeight', 6).attr('orient', 'auto')
                .append('path').attr('d', 'M0,0 L10,3.5 L0,7 Z').attr('fill', fill);
        });

        /* Helpers */
        function comp(parent, id, x, y, w, h, label, [fill, stroke], sub) {
            const g = parent.append('g').attr('class', 'arch-node').attr('data-id', id);
            g.append('rect').attr('class', 'arch-box')
                .attr('x', x).attr('y', y).attr('width', w).attr('height', h)
                .attr('rx', 4).attr('fill', fill).attr('stroke', stroke).attr('stroke-width', 1.2);
            g.append('text').attr('x', x + w/2).attr('y', y + h/2 + (sub ? -2 : 4))
                .attr('text-anchor', 'middle').attr('fill', C.txt)
                .attr('font-size', '10.5').attr('font-weight', '600').text(label);
            if (sub) {
                g.append('text').attr('x', x + w/2).attr('y', y + h/2 + 10)
                    .attr('text-anchor', 'middle').attr('fill', C.dim)
                    .attr('font-size', '7.5').attr('font-family', 'JetBrains Mono, monospace').text(sub);
            }
            archNodeMap[id] = g;
            return g;
        }

        function arrow(x1, y1, x2, y2, m) {
            svg.append('line')
                .attr('x1', x1).attr('y1', y1).attr('x2', x2).attr('y2', y2)
                .attr('stroke', C.arrow).attr('stroke-width', 1.1)
                .attr('marker-end', `url(#${m || 'ah'})`);
        }

        function curvedArrow(x1, y1, x2, y2, m) {
            const my = (y1 + y2) / 2;
            svg.append('path')
                .attr('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`)
                .attr('fill', 'none').attr('stroke', C.arrow).attr('stroke-width', 1.1)
                .attr('marker-end', `url(#${m || 'ah'})`);
        }

        const dk = Math.floor(state.dModel / state.heads);
        const dff = state.dModel * state.ffMult;
        const headSub = `${state.heads}h, d_k=${dk}`;
        const ffnSub = `${state.dModel}\u2192${dff}\u2192${state.dModel}`;

        /* Input embeddings */
        const eY = 18, eH = 30;
        comp(svg, 'emb-enc', encX, eY, boxW * 0.42, eH, '输入嵌入', C.embed, `d=${state.dModel}`);
        comp(svg, 'emb-dec', decX, eY, boxW * 0.42, eH, '输出嵌入', C.embed, `d=${state.dModel}`);

        svg.append('text').attr('x', encX + boxW*0.50).attr('y', eY + eH/2 + 3)
            .attr('fill', C.dim).attr('font-size', '8.5').text('+PE');
        svg.append('text').attr('x', decX + boxW*0.50).attr('y', eY + eH/2 + 3)
            .attr('fill', C.dim).attr('font-size', '8.5').text('+PE');

        /* Encoder stack */
        const sY = eY + eH + 28;
        const esX = encX - 10;

        svg.append('rect').attr('x', esX).attr('y', sY)
            .attr('width', boxW + 20).attr('height', N * encLayerH + stackPad - 10)
            .attr('rx', 8).attr('fill', C.bg).attr('stroke', C.bgS).attr('stroke-dasharray', '4 2');
        svg.append('text').attr('x', esX + 8).attr('y', sY + 13)
            .attr('fill', '#16c79a').attr('font-size', '10').attr('font-weight', '700')
            .text(`\u7F16\u7801\u5668 \xD7${N}`);

        arrow(encX + boxW*0.21, eY + eH, encX + boxW*0.21, sY);

        for (let i = 0; i < N; i++) {
            const ly = sY + stackPad + i * encLayerH;
            if (i > 0) {
                svg.append('line').attr('x1', esX+5).attr('y1', ly - 5)
                    .attr('x2', esX + boxW+15).attr('y2', ly - 5)
                    .attr('stroke', 'rgba(42,42,74,0.35)').attr('stroke-dasharray', '2 2');
            }
            const cx = encX;
            comp(svg, `enc-mha-${i}`, cx, ly, compW, compH, '多头自注意力', C.mha, headSub);
            comp(svg, `enc-an1-${i}`, cx, ly+(compH+gap), compW, compH, 'Add & Norm', C.norm);
            const ffW = compW * Math.min(1, 0.55 + state.ffMult * 0.08);
            const ffX = cx + (compW - ffW) / 2;
            comp(svg, `enc-ffn-${i}`, ffX, ly+2*(compH+gap), ffW, compH, '前馈网络', C.ffn, ffnSub);
            comp(svg, `enc-an2-${i}`, cx, ly+3*(compH+gap), compW, compH, 'Add & Norm', C.norm);

            /* Mini connecting arrows inside layer */
            for (let s = 0; s < 3; s++) {
                const fromY = ly + s*(compH+gap) + compH;
                const toY = fromY + gap;
                svg.append('line').attr('x1', cx+compW/2).attr('y1', fromY)
                    .attr('x2', cx+compW/2).attr('y2', toY)
                    .attr('stroke', 'rgba(74,74,106,0.4)').attr('stroke-width', 0.8);
            }
        }

        /* Decoder stack */
        const dsX = decX - 10;
        svg.append('rect').attr('x', dsX).attr('y', sY)
            .attr('width', boxW + 20).attr('height', N * decLayerH + stackPad - 10)
            .attr('rx', 8).attr('fill', C.bg).attr('stroke', C.bgS).attr('stroke-dasharray', '4 2');
        svg.append('text').attr('x', dsX + 8).attr('y', sY + 13)
            .attr('fill', '#16c79a').attr('font-size', '10').attr('font-weight', '700')
            .text(`\u89E3\u7801\u5668 \xD7${N}`);

        arrow(decX + boxW*0.21, eY + eH, decX + boxW*0.21, sY);

        for (let i = 0; i < N; i++) {
            const ly = sY + stackPad + i * decLayerH;
            if (i > 0) {
                svg.append('line').attr('x1', dsX+5).attr('y1', ly-5)
                    .attr('x2', dsX+boxW+15).attr('y2', ly-5)
                    .attr('stroke', 'rgba(42,42,74,0.35)').attr('stroke-dasharray', '2 2');
            }
            const cx = decX;
            comp(svg, `dec-mmha-${i}`, cx, ly, compW, compH, '掩码自注意力', C.mha, headSub);
            comp(svg, `dec-an1-${i}`, cx, ly+(compH+gap), compW, compH, 'Add & Norm', C.norm);
            comp(svg, `dec-xattn-${i}`, cx, ly+2*(compH+gap), compW, compH, '交叉注意力', C.mha, headSub);
            comp(svg, `dec-an2-${i}`, cx, ly+3*(compH+gap), compW, compH, 'Add & Norm', C.norm);
            const ffW = compW * Math.min(1, 0.55 + state.ffMult * 0.08);
            const ffX = cx + (compW - ffW) / 2;
            comp(svg, `dec-ffn-${i}`, ffX, ly+4*(compH+gap), ffW, compH, '前馈网络', C.ffn, ffnSub);
            comp(svg, `dec-an3-${i}`, cx, ly+5*(compH+gap), compW, compH, 'Add & Norm', C.norm);

            for (let s = 0; s < 5; s++) {
                const fromY = ly + s*(compH+gap) + compH;
                svg.append('line').attr('x1', cx+compW/2).attr('y1', fromY)
                    .attr('x2', cx+compW/2).attr('y2', fromY + gap)
                    .attr('stroke', 'rgba(74,74,106,0.4)').attr('stroke-width', 0.8);
            }

            /* Cross-attention arrow from encoder */
            const crossY = ly + 2*(compH+gap) + compH/2;
            const encEnd = esX + boxW + 10 + 5;
            curvedArrow(encEnd, crossY, cx - 3, crossY, 'ahG');
        }

        /* Output layer */
        const outY = sY + N * decLayerH + stackPad + 8;
        comp(svg, 'out-linear', decX, outY, boxW*0.38, 26, 'Linear', C.out);
        comp(svg, 'out-softmax', decX + boxW*0.42, outY, boxW*0.32, 26, 'Softmax', C.out);
        arrow(decX + compW/2, sY + N*decLayerH + stackPad - 12, decX + boxW*0.19, outY);
        arrow(decX + boxW*0.38, outY + 13, decX + boxW*0.42, outY + 13);

        /* Title watermark */
        svg.append('text').attr('x', W/2).attr('y', H - 6)
            .attr('text-anchor', 'middle').attr('fill', 'rgba(124,124,156,0.4)')
            .attr('font-size', '7.5').text('Transformer \u67B6\u6784 \u00B7 \u5B9E\u65F6\u53CD\u6620\u914D\u7F6E');
    }

    /* ================================================================
       ATTENTION HEATMAP
    ================================================================ */
    function getTokens() {
        return inputText.value.trim().split(/\s+/).filter(t => t.length > 0);
    }

    function populateAttnSelectors() {
        attnLayerSel.innerHTML = '';
        attnHeadSel.innerHTML = '';
        for (let i = 0; i < state.layers; i++) {
            const o = document.createElement('option'); o.value = i; o.textContent = `层 ${i}`;
            attnLayerSel.appendChild(o);
        }
        for (let i = 0; i < state.heads; i++) {
            const o = document.createElement('option'); o.value = i; o.textContent = `头 ${i}`;
            attnHeadSel.appendChild(o);
        }
    }

    function generateAttnWeights(tokens, li, hi) {
        // Try to use pre-computed data when tokens match
        if (attentionData && attentionData.layers) {
            const srcTok = attentionData.tokens;
            const aL = attentionData.layers;
            const rli = li % aL.length, rhi = hi % aL[rli].heads.length;
            if (tokens.length === srcTok.length && tokens.join(' ') === srcTok.join(' ')) {
                return {
                    weights: aL[rli].heads[rhi].weights,
                    desc: aL[rli].heads[rhi].description,
                    name: aL[rli].heads[rhi].name
                };
            }
        }

        // Synthetic generation with distinct patterns per head
        const n = tokens.length;
        const rng = TransformerUtils.seededRandom(li * 137 + hi * 31 + n * 7);
        const pattern = hi % 4; // 0=positional, 1=self, 2=syntax, 3=global
        const W = [];
        for (let i = 0; i < n; i++) {
            const row = [];
            let sum = 0;
            for (let j = 0; j < n; j++) {
                let w;
                const dist = Math.abs(i - j);
                if (pattern === 0) {       // Positional: nearby tokens
                    w = Math.exp(-dist * (0.4 + li * 0.1)) + rng() * 0.05;
                } else if (pattern === 1) { // Self focus
                    w = (i === j ? 0.6 : 0.05) + rng() * 0.08;
                } else if (pattern === 2) { // Syntax-like: verb-noun pairs
                    w = (dist <= 2 ? 0.2 : 0.04) + (i === j ? 0.15 : 0) + rng() * 0.06;
                } else {                    // Global: uniform
                    w = 0.12 + rng() * 0.06;
                }
                row.push(Math.max(0.001, w));
                sum += row[row.length - 1];
            }
            W.push(row.map(v => v / sum));
        }

        const names = ['位置注意力', '自注意力', '句法注意力', '全局注意力'];
        const descs = ['关注邻近位置的token', '主要关注自身位置', '捕捉句法依赖关系', '均匀聚合全局信息'];
        return { weights: W, desc: descs[pattern], name: names[pattern] };
    }

    function renderAttentionHeatmap() {
        const container = document.getElementById('heatmapContainer');
        container.innerHTML = '';
        const tokens = getTokens();
        if (tokens.length === 0) return;

        const li = +attnLayerSel.value || 0;
        const hi = +attnHeadSel.value || 0;
        const mode = attnDisplay.value;

        let weights, desc;
        if (mode === 'average') {
            // Average across all heads
            const n = tokens.length;
            const avg = Array.from({length: n}, () => new Array(n).fill(0));
            for (let h = 0; h < state.heads; h++) {
                const { weights: hw } = generateAttnWeights(tokens, li, h);
                for (let i = 0; i < n; i++)
                    for (let j = 0; j < n; j++)
                        avg[i][j] += hw[i][j] / state.heads;
            }
            weights = avg;
            desc = `层${li} 所有${state.heads}个头的平均注意力`;
        } else {
            const result = generateAttnWeights(tokens, li, hi);
            weights = result.weights;
            desc = `${result.name}: ${result.desc}`;
        }

        $('#attnHeadDescription').textContent = desc;

        const cellSize = Math.min(38, Math.max(24, 260 / tokens.length));
        new MatrixRenderer({
            container, data: weights,
            rowLabels: tokens, colLabels: tokens,
            cellSize, showValues: tokens.length <= 10,
            colorScale: (v) => TransformerUtils.attentionColor(v),
            title: mode === 'average' ? `平均注意力 \u00B7 层${li}` : `注意力 \u00B7 层${li} 头${hi}`,
        });

        // Insight
        const insight = $('#attnInsight');
        const maxWeight = Math.max(...weights.flat());
        const maxIdx = weights.flat().indexOf(maxWeight);
        const mi = Math.floor(maxIdx / tokens.length), mj = maxIdx % tokens.length;
        if (tokens.length >= 3) {
            insight.style.display = 'block';
            insight.textContent = `最强注意力: "${tokens[mi]}" \u2192 "${tokens[mj]}" (${maxWeight.toFixed(3)})`;
        } else {
            insight.style.display = 'none';
        }
    }

    /* ================================================================
       RUN ANIMATION
    ================================================================ */
    function getTarget() {
        const txt = inputText.value.trim();
        if (state.task === 'translation') {
            if (TRANSLATION_TARGETS[txt]) return TRANSLATION_TARGETS[txt];
            const toks = getTokens();
            const fake = toks.map((_, i) => `word${i}`);
            return { tokens: fake, alignments: toks.map((_, i) => [i, Math.min(i, fake.length-1)]) };
        }
        if (state.task === 'generation') {
            if (GENERATION_CONT[txt]) return { tokens: GENERATION_CONT[txt], alignments: [] };
            return { tokens: ['\u2026', '(\u751F\u6210)', '\u6A21\u62DF'], alignments: [] };
        }
        return { tokens: getTokens().map(t => `[${t}]`), alignments: [] };
    }

    async function runPlayground() {
        if (state.running) return;
        state.running = true;
        runBtn.classList.add('running');
        stepIndicator.style.display = 'block';

        const tokens = getTokens();
        const target = getTarget();
        const steps = buildSteps(tokens, target);

        /* Clear output */
        const srcC = $('#sourceTokens'), tgtC = $('#targetTokens');
        srcC.innerHTML = ''; tgtC.innerHTML = '';

        /* Show generation info */
        if (state.task === 'generation') {
            const gi = $('#generationInfo');
            gi.style.display = 'block';
            gi.textContent = `\u81EA\u56DE\u5F52\u751F\u6210: \u6BCF\u6B65\u9884\u6D4B\u4E0B\u4E00\u4E2Atoken\uFF0C\u5171${target.tokens.length}\u6B65`;
        }

        /* Source tokens */
        tokens.forEach((t, i) => {
            const chip = document.createElement('span');
            chip.className = 'token-chip source';
            chip.textContent = t;
            srcC.appendChild(chip);
            setTimeout(() => {
                chip.classList.add('visible');
                gsap.from(chip, { x: -10, opacity: 0, duration: 0.3, delay: i * 0.06 });
            }, 50 + i * 60);
        });

        await delay(tokens.length * 60 + 200);

        /* Animate steps */
        for (let i = 0; i < steps.length; i++) {
            if (!state.running) break;
            const s = steps[i];
            stepText.textContent = s.label;
            stepProgressFill.style.width = ((i + 1) / steps.length * 100) + '%';
            highlightNode(s.nodeId);
            await delay((s.dur || 350) / animSpeed);

            if (s.outputToken != null) {
                const chip = document.createElement('span');
                chip.className = 'token-chip target';
                chip.textContent = s.outputToken;
                tgtC.appendChild(chip);
                await delay(40 / animSpeed);
                chip.classList.add('visible');
                gsap.from(chip, { y: 12, opacity: 0, duration: 0.3, ease: 'back.out(1.7)' });

                /* Add arrow between tokens if generation */
                if (state.task === 'generation' && tgtC.children.length > 1) {
                    const arrowEl = document.createElement('span');
                    arrowEl.className = 'token-arrow visible';
                    arrowEl.textContent = '\u2192';
                    tgtC.insertBefore(arrowEl, chip);
                }
            }
        }

        /* Post-run updates */
        renderAttentionHeatmap();
        renderProbChart(target.tokens);
        if (state.task === 'translation') {
            renderAlignment(tokens, target.tokens, target.alignments);
            $('#alignmentSection').style.display = 'block';
        }

        clearAllHighlights();
        stepIndicator.style.display = 'none';
        state.running = false;
        runBtn.classList.remove('running');
    }

    function buildSteps(srcTok, target) {
        const S = [], N = state.layers;

        S.push({ label: '输入嵌入 + 位置编码', nodeId: 'emb-enc', dur: 450 });

        for (let i = 0; i < N; i++) {
            S.push({ label: `Enc[${i}] 多头自注意力`, nodeId: `enc-mha-${i}`, dur: 380 });
            S.push({ label: `Enc[${i}] Add & Norm`,   nodeId: `enc-an1-${i}`, dur: 200 });
            S.push({ label: `Enc[${i}] 前馈网络`,     nodeId: `enc-ffn-${i}`, dur: 320 });
            S.push({ label: `Enc[${i}] Add & Norm`,   nodeId: `enc-an2-${i}`, dur: 200 });
        }

        S.push({ label: '输出嵌入 + 位置编码', nodeId: 'emb-dec', dur: 350 });

        const tgt = target.tokens;
        for (let t = 0; t < tgt.length; t++) {
            const first = (t === 0);
            for (let i = 0; i < N; i++) {
                const show = first || i === 0;
                if (show) {
                    S.push({ label: `Dec[${i}] 掩码自注意力 (t=${t})`, nodeId: `dec-mmha-${i}`, dur: first ? 330 : 180 });
                    S.push({ label: `Dec[${i}] Add & Norm`, nodeId: `dec-an1-${i}`, dur: first ? 180 : 100 });
                    S.push({ label: `Dec[${i}] 交叉注意力 (t=${t})`, nodeId: `dec-xattn-${i}`, dur: first ? 330 : 180 });
                    S.push({ label: `Dec[${i}] Add & Norm`, nodeId: `dec-an2-${i}`, dur: first ? 180 : 100 });
                    S.push({ label: `Dec[${i}] 前馈网络 (t=${t})`, nodeId: `dec-ffn-${i}`, dur: first ? 280 : 140 });
                    S.push({ label: `Dec[${i}] Add & Norm`, nodeId: `dec-an3-${i}`, dur: first ? 180 : 100 });
                }
            }
            S.push({ label: `Linear + Softmax \u2192 "${tgt[t]}"`, nodeId: 'out-linear', dur: 280, outputToken: tgt[t] });
        }

        return S;
    }

    function highlightNode(nodeId) {
        clearAllHighlights();
        const g = archNodeMap[nodeId];
        if (!g) return;

        /* Dim all others */
        Object.keys(archNodeMap).forEach(id => {
            if (id !== nodeId) archNodeMap[id].classed('dimmed', true);
        });
        g.classed('highlighted', true);

        /* Pulse effect on the box */
        const box = g.select('.arch-box');
        if (box.node()) {
            const origStroke = box.attr('stroke');
            gsap.fromTo(box.node(),
                { attr: { 'stroke-width': 1.2 } },
                { attr: { 'stroke-width': 3 }, duration: 0.25, yoyo: true, repeat: 1 }
            );
        }
    }

    function clearAllHighlights() {
        Object.values(archNodeMap).forEach(g => {
            g.classed('dimmed', false).classed('highlighted', false);
        });
    }

    /* ================================================================
       PROBABILITY CHART
    ================================================================ */
    function renderProbChart(targetTokens) {
        const ctx = document.getElementById('probChart');
        if (probChartInst) probChartInst.destroy();

        const rng = TransformerUtils.seededRandom(42 + targetTokens.length);
        const lastTok = targetTokens[targetTokens.length - 1] || '?';
        const candidates = [lastTok, '[EOS]', '\u7684', '\u4E86', '\u662F', '\u5728', '\u6709', '\u548C'];
        const unique = [...new Set(candidates)].slice(0, 8);

        const raw = unique.map((t, i) => i === 0 ? 0.4 + rng() * 0.15 : rng() * 0.12 + 0.02);
        const sum = raw.reduce((a, b) => a + b, 0);
        const probs = raw.map(p => +(p / sum * 100).toFixed(1));

        probChartInst = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: unique,
                datasets: [{
                    data: probs,
                    backgroundColor: probs.map((_, i) => i === 0 ? 'rgba(22,199,154,0.7)' : 'rgba(79,195,247,0.35)'),
                    borderColor: probs.map((_, i) => i === 0 ? '#16c79a' : 'rgba(79,195,247,0.5)'),
                    borderWidth: 1, borderRadius: 3,
                }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: i => i.raw + '%' } }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(42,42,74,0.3)' },
                        ticks: { color: '#a8a8b8', font: { size: 9 }, callback: v => v + '%' }, max: 65
                    },
                    y: {
                        grid: { display: false },
                        ticks: { color: '#e8e8e8', font: { size: 10, family: 'Noto Sans SC, sans-serif' } }
                    }
                }
            }
        });
    }

    /* ================================================================
       ALIGNMENT VISUALIZATION
    ================================================================ */
    function renderAlignment(srcTok, tgtTok, alignments) {
        const ct = document.getElementById('alignmentViz');
        ct.innerHTML = '';
        const pL = 10, pT = 25, pB = 25, tokW = 52, tokH = 22, gapY = 55;
        const maxN = Math.max(srcTok.length, tgtTok.length);
        const W = maxN * tokW + pL * 2;
        const H = 2 * tokH + gapY + pT + pB;

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('width', W); svg.setAttribute('height', H);
        svg.style.display = 'block';
        ct.appendChild(svg);

        function drawTokenRow(tokens, startX, y, fill, stroke, txtColor) {
            tokens.forEach((t, i) => {
                const x = startX + i * tokW;
                const r = document.createElementNS(svgNS, 'rect');
                r.setAttribute('x', x); r.setAttribute('y', y);
                r.setAttribute('width', tokW - 4); r.setAttribute('height', tokH);
                r.setAttribute('rx', 3); r.setAttribute('fill', fill); r.setAttribute('stroke', stroke);
                svg.appendChild(r);
                const tx = document.createElementNS(svgNS, 'text');
                tx.setAttribute('x', x + (tokW - 4)/2); tx.setAttribute('y', y + tokH/2 + 4);
                tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('fill', txtColor);
                tx.setAttribute('font-size', '10');
                tx.textContent = t.length > 7 ? t.slice(0, 6) + '..' : t;
                svg.appendChild(tx);
            });
        }

        const srcStartX = pL + (maxN - srcTok.length) * tokW / 2;
        const tgtStartX = pL + (maxN - tgtTok.length) * tokW / 2;

        drawTokenRow(srcTok, srcStartX, pT, 'rgba(79,195,247,0.12)', 'rgba(79,195,247,0.35)', '#4fc3f7');
        drawTokenRow(tgtTok, tgtStartX, pT + tokH + gapY, 'rgba(22,199,154,0.12)', 'rgba(22,199,154,0.35)', '#16c79a');

        alignments.forEach(([si, ti]) => {
            if (si >= srcTok.length || ti >= tgtTok.length) return;
            const x1 = srcStartX + si * tokW + (tokW-4)/2;
            const x2 = tgtStartX + ti * tokW + (tokW-4)/2;
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', pT + tokH);
            line.setAttribute('x2', x2); line.setAttribute('y2', pT + tokH + gapY);
            line.setAttribute('stroke', 'rgba(22,199,154,0.35)');
            line.setAttribute('stroke-width', '1.5'); line.setAttribute('stroke-dasharray', '3 2');
            svg.appendChild(line);
        });

        /* Row labels */
        const mkLabel = (x, y, text) => {
            const t = document.createElementNS(svgNS, 'text');
            t.setAttribute('x', x); t.setAttribute('y', y);
            t.setAttribute('fill', '#6c6c7c'); t.setAttribute('font-size', '9');
            t.textContent = text;
            svg.appendChild(t);
        };
        mkLabel(pL, pT - 6, '\u6E90');
        mkLabel(pL, pT + tokH + gapY - 6, '\u76EE\u6807');
    }

    /* ================================================================
       UTILITIES
    ================================================================ */
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    /* ================================================================
       BOOT
    ================================================================ */
    document.addEventListener('DOMContentLoaded', init);

})();
</script>
