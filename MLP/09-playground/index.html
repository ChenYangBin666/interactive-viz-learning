<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLP 游乐场 — MLP Playground</title>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
    <style>
        /* ===== Playground Layout ===== */
        .playground-wrapper {
            display: grid;
            grid-template-columns: 260px 1fr 320px;
            gap: 1rem;
            padding: calc(var(--header-height) + 1rem) 1rem 1rem;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) {
            .playground-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Panels ===== */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ===== Left Panel Controls ===== */
        .control-group {
            margin-bottom: 1rem;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .control-group select,
        .control-group input[type="range"] {
            width: 100%;
        }

        .control-group select {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .control-group select:focus {
            border-color: var(--accent-green);
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .range-row input[type="range"] {
            flex: 1;
        }

        .range-val {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-green);
            min-width: 2.5rem;
            text-align: right;
        }

        /* ===== Center Panel ===== */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .network-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
        }

        .network-controls .layer-editor {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.3rem 0.5rem;
        }

        .network-controls .layer-editor span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-width: 1.5rem;
            text-align: center;
        }

        .network-controls .layer-editor button {
            width: 22px;
            height: 22px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            padding: 0;
            line-height: 1;
        }

        .network-controls .layer-editor button:hover {
            border-color: var(--accent-green);
            background: rgba(22, 199, 154, 0.15);
        }

        .layer-controls-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .layer-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #networkCanvas {
            width: 100%;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        /* ===== Playback Bar ===== */
        .playback-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
        }

        .playback-bar .pb-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .playback-bar .pb-btn:hover {
            border-color: var(--accent-green);
            background: rgba(22, 199, 154, 0.15);
            color: var(--accent-green);
        }

        .playback-bar .pb-btn.active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: var(--bg-primary);
        }

        .playback-bar .speed-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-left: 0.5rem;
        }

        .playback-bar .speed-control label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .playback-bar .speed-control input[type="range"] {
            width: 80px;
        }

        .playback-bar .epoch-display {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-left: auto;
        }

        .preset-btns {
            display: flex;
            gap: 0.3rem;
        }

        .preset-btns .btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }

        /* ===== Right Panel ===== */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        #decisionCanvas {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        #lossCanvas {
            width: 100%;
            height: 160px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .metric-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
            text-align: center;
        }

        .metric-card .metric-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-card .metric-value {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0.15rem;
        }

        .metric-card .metric-value.green { color: var(--accent-green); }
        .metric-card .metric-value.blue { color: var(--accent-blue); }
        .metric-card .metric-value.orange { color: var(--accent-orange); }
        .metric-card .metric-value.purple { color: var(--accent-purple); }

        /* ===== Weight Toggle ===== */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .toggle-row .mini-toggle {
            position: relative;
            width: 36px;
            height: 20px;
            cursor: pointer;
        }

        .toggle-row .mini-toggle input { display: none; }

        .toggle-row .mini-toggle .track {
            position: absolute;
            inset: 0;
            background: var(--border-color);
            border-radius: 10px;
            transition: background 0.3s;
        }

        .toggle-row .mini-toggle input:checked + .track {
            background: var(--accent-green);
        }

        .toggle-row .mini-toggle .track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-row .mini-toggle input:checked + .track::after {
            transform: translateX(16px);
        }

        /* ===== Separator ===== */
        .sep {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 0.25rem;
        }

        /* ===== Data preview mini canvas ===== */
        #dataPreviewCanvas {
            width: 100%;
            height: 120px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="playground-wrapper">
        <!-- ========== LEFT PANEL ========== -->
        <div class="panel" id="leftPanel">
            <div class="panel-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>

            <div class="control-group">

            <div class="control-group">

                <div class="range-row">

                    <span class="range-val" id="noiseVal">0.15</span>

            <div class="control-group">

                    <span class="range-val" id="splitVal">80%</span>

            </div>

            <div class="control-group">
                <label>学习率 Learning Rate</label>
                <select id="lrSelect">
                    <option value="0.001">0.001</option>
                    <option value="0.003">0.003</option>
                    <option value="0.01" selected>0.01</option>
                    <option value="0.03">0.03</option>

            <div class="control-group">
                <label>激活函数 Activation</label>

                <div class="range-row">

        <!-- ========== CENTER PANEL ========== -->
        <div class="center-panel">
            <div class="panel" style="flex:1; display:flex; flex-direction:column;">
                <div class="panel-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="8" r="2"/><circle cx="6" cy="16" r="2"/>
                        <circle cx="12" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/>
                        <circle cx="18" cy="10" r="2"/><circle cx="18" cy="16" r="2"/>

                    网络可视化

                <!-- Layer architecture controls -->

                <canvas id="networkCanvas" height="340"></canvas>

            <!-- Playback Bar -->

    <script>
    /* ================================================================
       MLP 游乐场 — Playground
       ================================================================ */
    (() => {
        'use strict';

        /* ---------- DOM refs ---------- */
        const $ = id => document.getElementById(id);
        const datasetSel    = $('datasetSelect');
        const noiseSlider   = $('noiseSlider');
        const noiseVal      = $('noiseVal');
        const splitSlider   = $('splitSlider');
        const splitVal      = $('splitVal');
        const lrSel         = $('lrSelect');
        const actSel        = $('activationSelect');
        const regSel        = $('regSelect');
        const lambdaGroup   = $('lambdaGroup');
        const lambdaSlider  = $('lambdaSlider');
        const lambdaVal     = $('lambdaVal');
        const addLayerBtn   = $('addLayerBtn');
        const removeLayerBtn= $('removeLayerBtn');
        const layerEditors  = $('layerEditors');
        const showWeights   = $('showWeightsToggle');
        const playBtn       = $('playBtn');
        const pauseBtn      = $('pauseBtn');
        const stepBtn       = $('stepBtn');
        const resetBtn      = $('resetBtn');
        const speedSlider   = $('speedSlider');
        const epochSpan     = $('epochCount');
        const trainLossEl   = $('trainLossVal');
        const testLossEl    = $('testLossVal');
        const trainAccEl    = $('trainAccVal');
        const testAccEl     = $('testAccVal');

        const netCanvas     = $('networkCanvas');
        const netCtx        = netCanvas.getContext('2d');
        const decCanvas     = $('decisionCanvas');
        const decCtx        = decCanvas.getContext('2d');
        const lossCanvas    = $('lossCanvas');
        const lossCtx       = lossCanvas.getContext('2d');
        const previewCanvas = $('dataPreviewCanvas');
        const previewCtx    = previewCanvas.getContext('2d');

        /* ---------- State ---------- */
        let hiddenLayers = [4, 4];          // neuron counts per hidden layer
        let network = null;
        let trainData = null;
        let testData  = null;
        let epoch = 0;
        let running = false;
        let animId = null;
        let lossHistory = { train: [], test: [] };
        let lastForwardResult = null;       // for neuron coloring

        /* ---------- Helpers ---------- */
        function getActivationName() { return actSel.value; }
        function getLR() { return parseFloat(lrSel.value); }
        function getNoise() { return parseFloat(noiseSlider.value); }
        function getSplit() { return parseFloat(splitSlider.value); }
        function getReg() { return regSel.value; }
        function getLambda() { return parseFloat(lambdaSlider.value); }
        function getSpeed() { return parseInt(speedSlider.value); }

        function getLayerSizes() {
            // Binary classification -> output 1
            return [2, ...hiddenLayers, 1];
        }

        /* ---------- Activation helpers (for custom backprop) ---------- */
        function getActFnPair(name) {
            switch (name) {
                case 'sigmoid': return { fn: MLPUtils.sigmoid, dfn: MLPUtils.sigmoidDeriv };
                case 'tanh':    return { fn: MLPUtils.tanh, dfn: MLPUtils.tanhDeriv };
                case 'relu':
                default:        return { fn: MLPUtils.relu, dfn: MLPUtils.reluDeriv };
            }
        }

        /* Custom backprop that respects chosen activation */
        function customBackwardPass(network, forwardResult, target, activation) {
            const { weights } = network;
            const { activations, preActivations } = forwardResult;
            const L = weights.length;
            const weightGrads = [];
            const biasGrads = [];
            const act = getActFnPair(activation);

            // Output layer delta (MSE, linear output)
            const output = activations[L];
            let delta = output.map((o, i) => (2 / output.length) * (o - target[i]));

            for (let l = L - 1; l >= 0; l--) {
                const aIn = activations[l];
                const wGrad = [];
                for (let i = 0; i < delta.length; i++) {
                    wGrad[i] = [];
                    for (let j = 0; j < aIn.length; j++) {
                        wGrad[i][j] = delta[i] * aIn[j];
                    }
                }
                weightGrads.unshift(wGrad);
                biasGrads.unshift(delta.slice());

                if (l > 0) {
                    const Wt = MLPUtils.transpose(weights[l]);
                    const dPrev = MLPUtils.matVecMul(Wt, delta);
                    delta = dPrev.map((v, i) => v * act.dfn(preActivations[l - 1][i]));
                }
            }
            return { weightGrads, biasGrads };
        }

        /* Regularization gradient addition */
        function addRegGrads(network, grads) {
            const reg = getReg();
            if (reg === 'none') return;
            const lam = getLambda();
            const { weights } = network;
            for (let l = 0; l < weights.length; l++) {
                for (let i = 0; i < weights[l].length; i++) {
                    for (let j = 0; j < weights[l][i].length; j++) {
                        if (reg === 'l2') {
                            grads.weightGrads[l][i][j] += lam * 2 * weights[l][i][j];
                        } else if (reg === 'l1') {
                            grads.weightGrads[l][i][j] += lam * Math.sign(weights[l][i][j]);
                        }
                    }
                }
            }
        }

        /* ---------- Data Generation ---------- */
        function generateData() {
            const noise = getNoise();
            const seed = Math.floor(Math.random() * 100000);
            let raw;
            switch (datasetSel.value) {
                case 'circle':  raw = MLPUtils.generateCircleData(400, noise, seed); break;
                case 'xor':     raw = MLPUtils.generateXORData(400, noise, seed); break;
                case 'spiral':  raw = MLPUtils.generateSpiralData(400, 2, seed); break;
                case 'moons':   raw = MLPUtils.generateMoonsData(400, noise, seed); break;
                default:        raw = MLPUtils.generateXORData(400, noise, seed);
            }

            // Normalize points to [-1, 1]
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const [x, y] of raw.points) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
            const rangeX = (maxX - minX) || 1;
            const rangeY = (maxY - minY) || 1;
            const scale = Math.max(rangeX, rangeY) / 2;
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const normalized = raw.points.map(([x, y]) => [(x - cx) / scale, (y - cy) / scale]);

            // Shuffle
            const indices = Array.from({ length: normalized.length }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            const splitIdx = Math.floor(normalized.length * getSplit());
            trainData = { points: [], labels: [] };
            testData  = { points: [], labels: [] };

            for (let k = 0; k < indices.length; k++) {
                const idx = indices[k];
                if (k < splitIdx) {
                    trainData.points.push(normalized[idx]);
                    trainData.labels.push(raw.labels[idx]);
                } else {
                    testData.points.push(normalized[idx]);
                    testData.labels.push(raw.labels[idx]);
                }
            }
        }

        /* ---------- Network Init ---------- */
        function initNetwork() {
            const sizes = getLayerSizes();
            network = MLPUtils.createNetwork(sizes, Math.floor(Math.random() * 100000));
            epoch = 0;
            lossHistory = { train: [], test: [] };
            lastForwardResult = null;
            epochSpan.textContent = '0';
            trainLossEl.textContent = '—';
            testLossEl.textContent = '—';
            trainAccEl.textContent = '—';
            testAccEl.textContent = '—';
        }

        /* ---------- Training Step ---------- */
        function trainEpoch() {
            if (!network || !trainData) return;
            const lr = getLR();
            const activation = getActivationName();
            const n = trainData.points.length;

            // Mini-batch SGD (full batch for simplicity)
            let totalGrads = null;

            for (let i = 0; i < n; i++) {
                const input = trainData.points[i];
                const target = [trainData.labels[i]];
                const fwd = MLPUtils.forwardPass(network, input, activation);
                const grads = customBackwardPass(network, fwd, target, activation);
                addRegGrads(network, grads);

                if (!totalGrads) {
                    totalGrads = grads;
                } else {
                    for (let l = 0; l < grads.weightGrads.length; l++) {
                        for (let r = 0; r < grads.weightGrads[l].length; r++) {
                            totalGrads.biasGrads[l][r] += grads.biasGrads[l][r];
                            for (let c = 0; c < grads.weightGrads[l][r].length; c++) {
                                totalGrads.weightGrads[l][r][c] += grads.weightGrads[l][r][c];
                            }
                        }
                    }
                }
            }

            // Average gradients
            for (let l = 0; l < totalGrads.weightGrads.length; l++) {
                for (let r = 0; r < totalGrads.weightGrads[l].length; r++) {
                    totalGrads.biasGrads[l][r] /= n;
                    for (let c = 0; c < totalGrads.weightGrads[l][r].length; c++) {
                        totalGrads.weightGrads[l][r][c] /= n;
                    }
                }
            }

            MLPUtils.updateWeights(network, totalGrads, lr);
            epoch++;

            // Store a forward result from last sample for neuron coloring
            lastForwardResult = MLPUtils.forwardPass(network, trainData.points[0], activation);
        }

        /* ---------- Evaluation ---------- */
        function computeLossAndAcc(data) {
            if (!data || data.points.length === 0) return { loss: 0, acc: 0 };
            const activation = getActivationName();
            let totalLoss = 0;
            let correct = 0;
            for (let i = 0; i < data.points.length; i++) {
                const out = MLPUtils.predict(network, data.points[i], activation);
                const pred = out[0];
                const target = data.labels[i];
                const diff = pred - target;
                totalLoss += diff * diff;
                const predicted = pred >= 0.5 ? 1 : 0;
                if (predicted === target) correct++;
            }
            return {
                loss: totalLoss / data.points.length,
                acc: correct / data.points.length
            };
        }

        function updateMetrics() {
            const tr = computeLossAndAcc(trainData);
            const te = computeLossAndAcc(testData);
            lossHistory.train.push(tr.loss);
            lossHistory.test.push(te.loss);
            // Keep last 500 points
            if (lossHistory.train.length > 500) {
                lossHistory.train.shift();
                lossHistory.test.shift();
            }
            epochSpan.textContent = epoch;
            trainLossEl.textContent = tr.loss.toFixed(4);
            testLossEl.textContent  = te.loss.toFixed(4);
            trainAccEl.textContent  = (tr.acc * 100).toFixed(1) + '%';
            testAccEl.textContent   = (te.acc * 100).toFixed(1) + '%';
        }

        /* ================================================================
           DRAWING
           ================================================================ */

        /* ---------- Data Preview ---------- */
        function drawDataPreview() {
            const canvas = previewCanvas;
            const ctx = previewCtx;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = rect.height;

            ctx.clearRect(0, 0, w, h);

            const allData = trainData && testData
                ? { points: [...trainData.points, ...testData.points], labels: [...trainData.labels, ...testData.labels] }
                : null;

            if (!allData) return;

            const pad = 10;
            for (let i = 0; i < allData.points.length; i++) {
                const [px, py] = allData.points[i];
                const x = pad + (px + 1) / 2 * (w - 2 * pad);
                const y = pad + (1 - (py + 1) / 2) * (h - 2 * pad);
                ctx.beginPath();
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = allData.labels[i] === 0 ? '#4fc3f7' : '#ff7043';
                ctx.fill();
            }
        }

        /* ---------- Network Diagram ---------- */
        function drawNetwork() {
            const canvas = netCanvas;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = 340 * dpr;
            const ctx = netCtx;
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = 340;

            ctx.clearRect(0, 0, w, h);

            const sizes = getLayerSizes();
            const numLayers = sizes.length;
            const padX = 50;
            const padY = 30;
            const layerSpacing = (w - 2 * padX) / (numLayers - 1);

            // Compute node positions
            const nodePositions = []; // [layer][neuron] = {x, y}
            for (let l = 0; l < numLayers; l++) {
                nodePositions[l] = [];
                const n = sizes[l];
                const totalH = h - 2 * padY;
                const nodeSpacing = Math.min(40, totalH / (n + 1));
                const startY = h / 2 - ((n - 1) * nodeSpacing) / 2;
                const x = padX + l * layerSpacing;
                for (let i = 0; i < n; i++) {
                    nodePositions[l].push({ x, y: startY + i * nodeSpacing });
                }
            }

            // Draw connections
            if (showWeights.checked && network) {
                for (let l = 0; l < network.weights.length; l++) {
                    const W = network.weights[l];
                    // Find max weight for scaling
                    let maxW = 0;
                    for (let i = 0; i < W.length; i++) {
                        for (let j = 0; j < W[i].length; j++) {
                            const aw = Math.abs(W[i][j]);
                            if (aw > maxW) maxW = aw;
                        }
                    }
                    if (maxW === 0) maxW = 1;

                    for (let i = 0; i < W.length; i++) {
                        for (let j = 0; j < W[i].length; j++) {
                            const weight = W[i][j];
                            const norm = Math.abs(weight) / maxW;
                            const from = nodePositions[l][j];
                            const to = nodePositions[l + 1][i];
                            ctx.beginPath();
                            ctx.moveTo(from.x, from.y);
                            ctx.lineTo(to.x, to.y);
                            ctx.lineWidth = 0.5 + norm * 3;
                            const alpha = 0.15 + norm * 0.6;
                            if (weight > 0) {
                                ctx.strokeStyle = `rgba(79, 195, 247, ${alpha})`;
                            } else {
                                ctx.strokeStyle = `rgba(255, 112, 67, ${alpha})`;
                            }
                            ctx.stroke();
                        }
                    }
                }
            } else if (!network) {
                // Draw faint connections when no network
                for (let l = 0; l < numLayers - 1; l++) {
                    for (let i = 0; i < sizes[l + 1]; i++) {
                        for (let j = 0; j < sizes[l]; j++) {
                            const from = nodePositions[l][j];
                            const to = nodePositions[l + 1][i];
                            ctx.beginPath();
                            ctx.moveTo(from.x, from.y);
                            ctx.lineTo(to.x, to.y);
                            ctx.lineWidth = 0.5;
                            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                            ctx.stroke();
                        }
                    }
                }
            }

            // Draw nodes
            for (let l = 0; l < numLayers; l++) {
                for (let i = 0; i < sizes[l]; i++) {
                    const pos = nodePositions[l][i];
                    const r = 12;

                    // Neuron color from activation value
                    let fillColor = '#2a2a4a';
                    if (lastForwardResult && lastForwardResult.activations[l]) {
                        const val = lastForwardResult.activations[l][i];
                        if (val !== undefined) {
                            fillColor = MLPUtils.valueToColor(val, -1, 1);
                        }
                    }

                    // Ring color by layer type
                    let ringColor;
                    if (l === 0) ringColor = '#4fc3f7';
                    else if (l === numLayers - 1) ringColor = '#66bb6a';
                    else ringColor = '#ff9800';

                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = ringColor;
                    ctx.stroke();
                }
            }

            // Layer labels
            ctx.font = '11px Inter, sans-serif';
            ctx.textAlign = 'center';
            for (let l = 0; l < numLayers; l++) {
                const x = nodePositions[l][0].x;
                let label;
                if (l === 0) label = '输入';
                else if (l === numLayers - 1) label = '输出';
                else label = `隐藏${l}`;
                ctx.fillStyle = '#6c6c7c';
                ctx.fillText(label, x, h - 8);
                ctx.fillStyle = '#4a4a6a';
                ctx.fillText(`(${sizes[l]})`, x, h - 8 + 13);
            }
        }

        /* ---------- Decision Boundary ---------- */
        function drawDecisionBoundary() {
            const canvas = decCanvas;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.width * dpr;  // square
            const ctx = decCtx;
            ctx.scale(dpr, dpr);
            const size = rect.width;

            ctx.clearRect(0, 0, size, size);

            if (!network) {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, size, size);
                ctx.font = '14px Inter, sans-serif';
                ctx.fillStyle = '#6c6c7c';
                ctx.textAlign = 'center';
                ctx.fillText('点击播放开始训练', size / 2, size / 2);
                return;
            }

            const activation = getActivationName();
            const resolution = 60;
            const cellW = size / resolution;
            const cellH = size / resolution;

            // Draw colored grid
            for (let gx = 0; gx < resolution; gx++) {
                for (let gy = 0; gy < resolution; gy++) {
                    const px = (gx / resolution) * 2 - 1;
                    const py = 1 - (gy / resolution) * 2;
                    const out = MLPUtils.predict(network, [px, py], activation);
                    const val = Math.max(0, Math.min(1, out[0]));
                    // Blue for class 0, orange for class 1
                    const r = Math.round(79 + val * (255 - 79));
                    const g = Math.round(195 - val * (195 - 112));
                    const b = Math.round(247 - val * (247 - 67));
                    ctx.fillStyle = `rgba(${r},${g},${b},0.35)`;
                    ctx.fillRect(gx * cellW, gy * cellH, cellW + 1, cellH + 1);
                }
            }

            // Draw data points
            const allData = [
                { data: trainData, outline: false },
                { data: testData,  outline: true }
            ];

            const pad = 0;
            for (const { data, outline } of allData) {
                if (!data) continue;
                for (let i = 0; i < data.points.length; i++) {
                    const [px, py] = data.points[i];
                    const x = ((px + 1) / 2) * size;
                    const y = ((1 - (py + 1) / 2)) * size;
                    ctx.beginPath();
                    ctx.arc(x, y, outline ? 3.5 : 3, 0, Math.PI * 2);
                    ctx.fillStyle = data.labels[i] === 0 ? '#4fc3f7' : '#ff7043';
                    ctx.fill();
                    if (outline) {
                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = '#ffffff';
                        ctx.stroke();
                    }
                }
            }
        }

        /* ---------- Loss Curve ---------- */
        function drawLossCurve() {
            const canvas = lossCanvas;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = lossCtx;
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = rect.height;

            ctx.clearRect(0, 0, w, h);

            if (lossHistory.train.length < 2) {
                ctx.font = '12px Inter, sans-serif';
                ctx.fillStyle = '#6c6c7c';
                ctx.textAlign = 'center';
                ctx.fillText('等待训练数据...', w / 2, h / 2);
                return;
            }

            const pad = { top: 15, right: 10, bottom: 25, left: 45 };
            const plotW = w - pad.left - pad.right;
            const plotH = h - pad.top - pad.bottom;

            // Find max loss for scale
            let maxLoss = 0;
            for (const v of lossHistory.train) if (v > maxLoss) maxLoss = v;
            for (const v of lossHistory.test)  if (v > maxLoss) maxLoss = v;
            maxLoss = Math.max(maxLoss, 0.01) * 1.1;

            const n = lossHistory.train.length;

            function drawLine(data, color) {
                ctx.beginPath();
                for (let i = 0; i < data.length; i++) {
                    const x = pad.left + (i / (n - 1)) * plotW;
                    const y = pad.top + (1 - data[i] / maxLoss) * plotH;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + (i / 4) * plotH;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(pad.left + plotW, y);
                ctx.stroke();

                ctx.font = '10px JetBrains Mono, monospace';
                ctx.fillStyle = '#6c6c7c';
                ctx.textAlign = 'right';
                const val = maxLoss * (1 - i / 4);
                ctx.fillText(val.toFixed(3), pad.left - 5, y + 3);
            }

            drawLine(lossHistory.train, '#ffab40');
            drawLine(lossHistory.test, '#b388ff');

            // Legend
            ctx.font = '10px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffab40';
            ctx.fillRect(pad.left + 5, h - 15, 12, 3);
            ctx.fillText('Train', pad.left + 22, h - 11);
            ctx.fillStyle = '#b388ff';
            ctx.fillRect(pad.left + 70, h - 15, 12, 3);
            ctx.fillText('Test', pad.left + 87, h - 11);
        }

        /* ================================================================
           LAYER EDITORS UI
           ================================================================ */
        function renderLayerEditors() {
            layerEditors.innerHTML = '';
            hiddenLayers.forEach((count, idx) => {
                const div = document.createElement('div');
                div.className = 'layer-editor';
                div.innerHTML = `
                    <button data-layer="${idx}" data-dir="-1">−</button>
                    <span title="隐藏层 ${idx + 1}">${count}</span>
                    <button data-layer="${idx}" data-dir="1">+</button>
                `;
                layerEditors.appendChild(div);
            });

            layerEditors.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const li = parseInt(btn.dataset.layer);
                    const dir = parseInt(btn.dataset.dir);
                    hiddenLayers[li] = Math.max(1, Math.min(8, hiddenLayers[li] + dir));
                    fullReset();
                });
            });
        }

        /* ================================================================
           CONTROLS
           ================================================================ */
        function fullReset() {
            stop();
            generateData();
            initNetwork();
            renderLayerEditors();
            drawAll();
        }

        function drawAll() {
            drawDataPreview();
            drawNetwork();
            drawDecisionBoundary();
            drawLossCurve();
        }

        function step() {
            trainEpoch();
            updateMetrics();
            drawNetwork();
            drawDecisionBoundary();
            drawLossCurve();
        }

        function play() {
            if (running) return;
            running = true;
            playBtn.classList.add('active');
            tick();
        }

        function stop() {
            running = false;
            playBtn.classList.remove('active');
            if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
            }
        }

        let lastTime = 0;
        function tick(timestamp) {
            if (!running) return;
            const speed = getSpeed();
            // Run multiple epochs per frame for higher speeds
            const epochsPerFrame = Math.max(1, Math.floor(speed / 5));
            for (let i = 0; i < epochsPerFrame; i++) {
                trainEpoch();
            }
            updateMetrics();

            // Draw at ~30fps max
            if (!timestamp || timestamp - lastTime > 33) {
                drawNetwork();
                drawDecisionBoundary();
                drawLossCurve();
                lastTime = timestamp || 0;
            }

            animId = requestAnimationFrame(tick);
        }

        /* --- Event listeners --- */
        playBtn.addEventListener('click', () => {
            if (!network) fullReset();
            play();
        });
        pauseBtn.addEventListener('click', stop);
        stepBtn.addEventListener('click', () => {
            if (!network) fullReset();
            stop();
            step();
        });
        resetBtn.addEventListener('click', fullReset);

        addLayerBtn.addEventListener('click', () => {
            if (hiddenLayers.length < 4) {
                hiddenLayers.push(4);
                fullReset();
            }
        });

        removeLayerBtn.addEventListener('click', () => {
            if (hiddenLayers.length > 1) {
                hiddenLayers.pop();
                fullReset();
            }
        });

        datasetSel.addEventListener('change', fullReset);
        noiseSlider.addEventListener('input', () => {
            noiseVal.textContent = getNoise().toFixed(2);
        });
        noiseSlider.addEventListener('change', fullReset);

        splitSlider.addEventListener('input', () => {
            splitVal.textContent = Math.round(getSplit() * 100) + '%';
        });
        splitSlider.addEventListener('change', fullReset);

        lrSel.addEventListener('change', () => { /* no reset needed, takes effect next epoch */ });
        actSel.addEventListener('change', fullReset);

        regSel.addEventListener('change', () => {
            lambdaGroup.style.display = getReg() === 'none' ? 'none' : 'block';
        });
        lambdaSlider.addEventListener('input', () => {
            lambdaVal.textContent = getLambda().toFixed(4);
        });

        showWeights.addEventListener('change', drawNetwork);

        // Presets
        document.querySelectorAll('[data-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = btn.dataset.preset;
                switch (preset) {
                    case 'simple':
                        hiddenLayers = [4];
                        actSel.value = 'relu';
                        lrSel.value = '0.03';
                        regSel.value = 'none';
                        lambdaGroup.style.display = 'none';
                        break;
                    case 'deep':
                        hiddenLayers = [4, 4, 4, 4];
                        actSel.value = 'relu';
                        lrSel.value = '0.01';
                        regSel.value = 'none';
                        lambdaGroup.style.display = 'none';
                        break;
                    case 'wide':
                        hiddenLayers = [8, 8];
                        actSel.value = 'tanh';
                        lrSel.value = '0.01';
                        regSel.value = 'none';
                        lambdaGroup.style.display = 'none';
                        break;
                }
                fullReset();
            });
        });

        /* --- Resize handler --- */
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawAll, 150);
        });

        /* ================================================================
           INIT
           ================================================================ */
        function init() {
            generateData();
            initNetwork();
            renderLayerEditors();
            drawAll();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
