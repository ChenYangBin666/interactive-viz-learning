<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机森林游乐场 — 模块 09</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- D3 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Project CSS -->
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <style>
        /* ===== Playground Layout ===== */
        .playground-container {
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            gap: 1rem;
            min-height: calc(100vh - 120px);
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* ===== Left Panel - Config ===== */
        .config-panel {
            max-height: calc(100vh - 120px);
        }

        .config-group {
            margin-bottom: 1rem;
        }

        .config-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .config-group select,
        .config-group input[type="range"] {
            width: 100%;
        }

        .config-group select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 0.4rem 0.6rem;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .config-group select:focus {
            border-color: var(--accent-green);
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .range-row input[type="range"] {
            flex: 1;
        }

        .range-val {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-green);
            min-width: 2.5rem;
            text-align: right;
        }

        .btn-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-row .btn {
            flex: 1;
        }

        .config-separator {
            height: 1px;
            background: var(--border-color);
            margin: 0.75rem 0;
        }

        /* ===== Center Panel - Visualization ===== */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: calc(100vh - 120px);
        }

        .scatter-container {
            flex: 1;
            position: relative;
            min-height: 400px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .scatter-container svg {
            width: 100%;
            height: 100%;
        }

        .scatter-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .scatter-tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 52, 96, 0.95);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            color: var(--text-primary);
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
            white-space: nowrap;
        }

        .mini-tree-gallery {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            min-height: 100px;
            max-height: 140px;
            align-items: flex-start;
        }

        .mini-tree-gallery::-webkit-scrollbar {
            height: 6px;
        }

        .mini-tree {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .mini-tree:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(22, 199, 154, 0.3);
        }

        .mini-tree.active {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px rgba(255, 171, 64, 0.4);
        }

        .mini-tree svg {
            width: 100%;
            height: 100%;
        }

        .mini-tree-label {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .gallery-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        /* ===== Right Panel - Results ===== */
        .results-panel {
            max-height: calc(100vh - 120px);
        }

        .stat-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(42, 42, 74, 0.4);
        }

        .stat-card:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .stat-value.warn {
            color: var(--accent-orange);
        }

        .chart-container {
            margin-top: 0.75rem;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .chart-container canvas {
            max-height: 160px;
        }

        .chart-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .confidence-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding: 0.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .confidence-toggle label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* ===== Status bar ===== */
        .status-bar {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0.25rem;
        }

        .status-bar .highlight {
            color: var(--accent-green);
            font-weight: 600;
        }

        /* ===== Building animation overlay ===== */
        .building-overlay {
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .building-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .building-overlay .building-text {
            margin-top: 1rem;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 1200px) {
            .playground-container {
                grid-template-columns: 220px 1fr 240px;
            }
        }

        @media (max-width: 900px) {
            .playground-container {
                grid-template-columns: 1fr;
                max-height: none;
            }
            .config-panel, .center-panel, .results-panel {
                max-height: none;
            }
        }
    </style>
</head>
<body>

<div class="page-container" style="max-width:1600px;">
    <div class="page-header" style="margin-bottom:1rem;">
        <div class="breadcrumb" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.3rem;">
            <a href="../index.html">随机森林</a> / 模块 09
        </div>
        <h1 style="margin-bottom:0.25rem;">随机森林游乐场</h1>
        <p style="margin:0;font-size:0.85rem;">调整参数，观察决策边界的实时变化。点击画布添加或删除数据点。</p>
    </div>

    <div class="playground-container">
        <!-- ==================== LEFT PANEL: CONFIG ==================== -->
        <div class="panel config-panel">
            <div class="panel-title">配置</div>

            <!-- Dataset -->
            <div class="config-group">
                <label>数据集形状</label>
                <select id="sel-dataset">
                    <option value="moons" selected>月亮</option>
                    <option value="circles">圆环</option>
                    <option value="linear">线性</option>
                    <option value="xor">XOR</option>
                    <option value="spiral">螺旋</option>
                </select>
            </div>

            <!-- Data size -->
            <div class="config-group">
                <label>数据量</label>
                <select id="sel-datasize">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="200">200</option>
                </select>
            </div>

            <!-- Noise -->
            <div class="config-group">
                <label>噪声</label>
                <div class="range-row">
                    <input type="range" id="sld-noise" min="0" max="1" step="0.05" value="0.3">
                    <span class="range-val" id="val-noise">0.30</span>
                </div>
            </div>

            <div class="config-separator"></div>

            <!-- n_trees -->
            <div class="config-group">
                <label>树的数量 (n_trees)</label>
                <select id="sel-ntrees">
                    <option value="1">1</option>
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <!-- max_depth -->
            <div class="config-group">
                <label>最大深度 (max_depth)</label>
                <div class="range-row">
                    <input type="range" id="sld-maxdepth" min="1" max="10" step="1" value="4">
                    <span class="range-val" id="val-maxdepth">4</span>
                </div>
            </div>

            <!-- max_features -->
            <div class="config-group">
                <label>最大特征数 (max_features)</label>
                <select id="sel-maxfeatures">
                    <option value="1">1</option>
                    <option value="sqrt" selected>sqrt</option>
                    <option value="all">全部</option>
                </select>
            </div>

            <!-- min_samples_split -->
            <div class="config-group">
                <label>最小分裂样本 (min_samples_split)</label>
                <select id="sel-minsplit">
                    <option value="2" selected>2</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </div>

            <!-- Criterion -->
            <div class="config-group">
                <label>分裂准则</label>
                <div class="btn-group" style="width:100%;">
                    <button class="btn btn-sm active" data-criterion="gini" style="flex:1;">Gini</button>
                    <button class="btn btn-sm" data-criterion="entropy" style="flex:1;">Entropy</button>
                </div>
            </div>

            <div class="config-separator"></div>

            <!-- Action buttons -->
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-build">构建森林</button>
                <button class="btn" id="btn-reset">重置</button>
            </div>

            <div class="btn-row" style="margin-top:0.5rem;">
                <button class="btn btn-sm" id="btn-regenerate" style="flex:1;">重新生成数据</button>
            </div>
        </div>

        <!-- ==================== CENTER PANEL: VISUALIZATION ==================== -->
        <div class="panel center-panel">
            <div class="panel-title">可视化</div>

            <div class="scatter-container" id="scatter-container">
                <canvas id="boundary-canvas"></canvas>
                <svg id="scatter-svg"></svg>
                <div class="scatter-tooltip" id="scatter-tooltip"></div>
                <div class="building-overlay" id="building-overlay">
                    <div class="loading-spinner"></div>
                    <div class="building-text">正在构建随机森林...</div>
                </div>
            </div>

            <div class="gallery-label">树结构预览（悬停查看单棵树的决策边界）</div>
            <div class="mini-tree-gallery" id="mini-tree-gallery">
                <div style="color:var(--text-muted);font-size:0.8rem;padding:1rem;text-align:center;width:100%;">
                    点击「构建森林」开始
                </div>
            </div>

            <div class="status-bar" id="status-bar">就绪 — 选择参数后点击「构建森林」</div>
        </div>

        <!-- ==================== RIGHT PANEL: RESULTS ==================== -->
        <div class="panel results-panel">
            <div class="panel-title">结果</div>

            <div class="stat-card">
                <span class="stat-label">OOB 准确率</span>
                <span class="stat-value" id="stat-oob">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">训练准确率</span>
                <span class="stat-value" id="stat-train">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">总节点数</span>
                <span class="stat-value" id="stat-nodes">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">森林大小</span>
                <span class="stat-value" id="stat-size">—</span>
            </div>

            <!-- Feature importance chart -->
            <div class="chart-container">
                <div class="chart-title">特征重要性</div>
                <canvas id="chart-importance"></canvas>
            </div>

            <!-- Accuracy vs n_trees chart -->
            <div class="chart-container">
                <div class="chart-title">准确率 vs 树的数量</div>
                <canvas id="chart-accuracy"></canvas>
            </div>

            <!-- Confidence heatmap toggle -->
            <div class="confidence-toggle">
                <label class="toggle">
                    <input type="checkbox" id="chk-confidence">
                    <span class="track"></span>
                </label>
                <label for="chk-confidence">显示置信度热力图</label>
            </div>
        </div>
    </div>
</div>

<!-- Project scripts -->
<script src="../shared/scripts/rf-utils.js"></script>
<script src="../shared/scripts/animation-controller.js"></script>
<script src="../shared/scripts/matrix-renderer.js"></script>
<script src="../shared/scripts/nav.js"></script>
<script src="../shared/scripts/katex-init.js"></script>

<script>
(function() {
    'use strict';

    /* ================================================================
       STATE
    ================================================================ */
    const state = {
        data: [],
        forest: null,
        hoveredTreeIdx: -1,
        showConfidence: false,
        boundaryGrid: null,     // cached full-forest boundary
        treeBoundaries: [],     // per-tree boundary grids
        seed: 42,
        isBuilding: false,
    };

    /* ================================================================
       DOM REFERENCES
    ================================================================ */
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const selDataset = $('#sel-dataset');
    const selDatasize = $('#sel-datasize');
    const sldNoise = $('#sld-noise');
    const valNoise = $('#val-noise');
    const selNtrees = $('#sel-ntrees');
    const sldMaxdepth = $('#sld-maxdepth');
    const valMaxdepth = $('#val-maxdepth');
    const selMaxfeatures = $('#sel-maxfeatures');
    const selMinsplit = $('#sel-minsplit');
    const criterionBtns = $$('[data-criterion]');
    const btnBuild = $('#btn-build');
    const btnReset = $('#btn-reset');
    const btnRegenerate = $('#btn-regenerate');
    const scatterContainer = $('#scatter-container');
    const boundaryCvs = $('#boundary-canvas');
    const scatterSvg = $('#scatter-svg');
    const tooltip = $('#scatter-tooltip');
    const miniGallery = $('#mini-tree-gallery');
    const statusBar = $('#status-bar');
    const buildingOverlay = $('#building-overlay');
    const chkConfidence = $('#chk-confidence');

    const statOob = $('#stat-oob');
    const statTrain = $('#stat-train');
    const statNodes = $('#stat-nodes');
    const statSize = $('#stat-size');

    /* ================================================================
       DATA GENERATION
    ================================================================ */
    function generateData() {
        const type = selDataset.value;
        const n = +selDatasize.value;
        const noise = +sldNoise.value;
        const rng = RFUtils.seededRandom(state.seed);

        const data = [];
        for (let i = 0; i < n; i++) {
            let x, y, label;
            const r1 = rng(), r2 = rng(), r3 = rng();

            switch (type) {
                case 'moons': {
                    if (r1 < 0.5) {
                        const angle = Math.PI * r2;
                        x = Math.cos(angle) + (r3 - 0.5) * noise;
                        y = Math.sin(angle) + (rng() - 0.5) * noise;
                        label = 0;
                    } else {
                        const angle = Math.PI * r2;
                        x = 1 - Math.cos(angle) + (r3 - 0.5) * noise;
                        y = 1 - Math.sin(angle) - 0.5 + (rng() - 0.5) * noise;
                        label = 1;
                    }
                    break;
                }
                case 'circles': {
                    const angle = 2 * Math.PI * r2;
                    if (r1 < 0.5) {
                        const rad = 0.4 + r3 * 0.1 + (rng() - 0.5) * noise * 0.3;
                        x = rad * Math.cos(angle);
                        y = rad * Math.sin(angle);
                        label = 0;
                    } else {
                        const rad = 1.0 + r3 * 0.1 + (rng() - 0.5) * noise * 0.3;
                        x = rad * Math.cos(angle);
                        y = rad * Math.sin(angle);
                        label = 1;
                    }
                    break;
                }
                case 'linear': {
                    x = r2 * 4 - 2;
                    y = r3 * 4 - 2;
                    const boundary = 0.6 * x + 0.4 * y + (rng() - 0.5) * noise * 2;
                    label = boundary > 0 ? 1 : 0;
                    break;
                }
                case 'xor': {
                    x = r2 * 4 - 2;
                    y = r3 * 4 - 2;
                    const noiseVal = (rng() - 0.5) * noise * 1.5;
                    label = ((x > noiseVal && y > noiseVal) || (x < noiseVal && y < noiseVal)) ? 1 : 0;
                    break;
                }
                case 'spiral': {
                    const cls = r1 < 0.5 ? 0 : 1;
                    const t = r2 * 2 * Math.PI + cls * Math.PI;
                    const rad = 0.3 + r2 * 1.2;
                    x = rad * Math.cos(t) + (rng() - 0.5) * noise * 0.5;
                    y = rad * Math.sin(t) + (rng() - 0.5) * noise * 0.5;
                    label = cls;
                    break;
                }
            }
            data.push({ x, y, label, features: [x, y] });
        }
        return data;
    }

    /* ================================================================
       SCATTER PLOT RENDERING (D3)
    ================================================================ */
    const margin = { top: 10, right: 10, bottom: 10, left: 10 };
    let plotW, plotH, xScale, yScale;

    function getPlotSize() {
        const rect = scatterContainer.getBoundingClientRect();
        plotW = rect.width - margin.left - margin.right;
        plotH = rect.height - margin.top - margin.bottom;
    }

    function computeScales() {
        if (state.data.length === 0) return;
        const xs = state.data.map(d => d.x);
        const ys = state.data.map(d => d.y);
        const pad = 0.3;
        const xMin = Math.min(...xs) - pad, xMax = Math.max(...xs) + pad;
        const yMin = Math.min(...ys) - pad, yMax = Math.max(...ys) + pad;

        xScale = d3.scaleLinear().domain([xMin, xMax]).range([0, plotW]);
        yScale = d3.scaleLinear().domain([yMax, yMin]).range([0, plotH]); // inverted
    }

    function renderPoints() {
        getPlotSize();
        computeScales();
        if (!xScale) return;

        const svg = d3.select(scatterSvg);
        svg.selectAll('*').remove();
        svg.attr('viewBox', `0 0 ${plotW + margin.left + margin.right} ${plotH + margin.top + margin.bottom}`);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        // Draw overlay path for single-tree boundary (dashed)
        g.append('g').attr('class', 'tree-overlay-group');

        // Data points
        const points = g.selectAll('circle.data-point')
            .data(state.data)
            .join('circle')
            .attr('class', 'data-point')
            .attr('cx', d => xScale(d.x))
            .attr('cy', d => yScale(d.y))
            .attr('r', 4.5)
            .attr('fill', d => d.label === 1 ? '#4fc3f7' : '#ff5252')
            .attr('stroke', '#1a1a2e')
            .attr('stroke-width', 1.5)
            .style('cursor', 'pointer');

        // Hover interaction
        const svgNode = scatterSvg;
        svgNode.addEventListener('mousemove', handleScatterHover);
        svgNode.addEventListener('mouseleave', () => { tooltip.style.opacity = 0; });
        svgNode.addEventListener('click', handleScatterClick);
    }

    function handleScatterHover(e) {
        if (!xScale || !state.forest) return;
        const rect = scatterContainer.getBoundingClientRect();
        const mx = e.clientX - rect.left - margin.left;
        const my = e.clientY - rect.top - margin.top;
        const dataX = xScale.invert(mx);
        const dataY = yScale.invert(my);

        const point = { x: dataX, y: dataY, features: [dataX, dataY] };
        const result = RFUtils.predictForest(state.forest, point);

        const totalVotes = Object.values(result.votes).reduce((a, b) => a + b, 0);
        const confidence = (result.votes[result.prediction] || 0) / totalVotes;

        tooltip.innerHTML = `预测: <b style="color:${result.prediction === 1 ? '#4fc3f7' : '#ff5252'}">${result.prediction === 1 ? '类别 1' : '类别 0'}</b><br>` +
            `置信度: <b>${(confidence * 100).toFixed(1)}%</b><br>` +
            `投票: ${result.votes[0] || 0} vs ${result.votes[1] || 0}`;
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
        tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    }

    function handleScatterClick(e) {
        if (!xScale) return;
        const rect = scatterContainer.getBoundingClientRect();
        const mx = e.clientX - rect.left - margin.left;
        const my = e.clientY - rect.top - margin.top;
        const dataX = xScale.invert(mx);
        const dataY = yScale.invert(my);

        // Check if clicking near existing point to remove it
        const threshold = 8;
        let removed = false;
        for (let i = state.data.length - 1; i >= 0; i--) {
            const d = state.data[i];
            const sx = xScale(d.x), sy = yScale(d.y);
            if (Math.hypot(sx - mx, sy - my) < threshold) {
                state.data.splice(i, 1);
                removed = true;
                break;
            }
        }

        if (!removed) {
            // Add point: left-click = class 0, need to detect label.
            // Use nearest-neighbor heuristic or alternating. We'll use shift for class.
            const label = e.shiftKey ? 1 : 0;
            state.data.push({ x: dataX, y: dataY, label, features: [dataX, dataY] });
        }

        renderPoints();
        updateStatus(`数据点: ${state.data.length}（点击添加类别0，Shift+点击添加类别1，点击已有点删除）`);
    }

    /* ================================================================
       DECISION BOUNDARY RENDERING (Canvas)
    ================================================================ */
    const GRID_RES = 80; // resolution of boundary grid

    function computeBoundaryGrid(predictor) {
        if (!xScale) return null;
        const grid = [];
        const xDom = xScale.domain();
        const yDom = yScale.domain(); // note: yDom[0] > yDom[1] because inverted
        const xMin = xDom[0], xMax = xDom[1];
        const yMin = Math.min(yDom[0], yDom[1]), yMax = Math.max(yDom[0], yDom[1]);

        for (let j = 0; j < GRID_RES; j++) {
            const row = [];
            const gy = yMax - (j / (GRID_RES - 1)) * (yMax - yMin);
            for (let i = 0; i < GRID_RES; i++) {
                const gx = xMin + (i / (GRID_RES - 1)) * (xMax - xMin);
                row.push(predictor(gx, gy));
            }
            grid.push(row);
        }
        return grid;
    }

    function renderBoundary(grid, alpha, dashed) {
        if (!grid) return;
        getPlotSize();
        const cvs = boundaryCvs;
        const dpr = window.devicePixelRatio || 1;
        cvs.width = (plotW + margin.left + margin.right) * dpr;
        cvs.height = (plotH + margin.top + margin.bottom) * dpr;
        const ctx = cvs.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        const cellW = plotW / GRID_RES;
        const cellH = plotH / GRID_RES;

        for (let j = 0; j < GRID_RES; j++) {
            for (let i = 0; i < GRID_RES; i++) {
                const val = grid[j][i]; // { prediction, confidence }
                let r, g, b;
                if (state.showConfidence) {
                    // Confidence heatmap
                    const conf = val.confidence;
                    if (val.prediction === 0) {
                        r = 255; g = 82; b = 82;
                    } else {
                        r = 79; g = 195; b = 247;
                    }
                    ctx.fillStyle = `rgba(${r},${g},${b},${0.08 + conf * alpha * 0.4})`;
                } else {
                    if (val.prediction === 0) {
                        ctx.fillStyle = `rgba(255, 82, 82, ${alpha * 0.25})`;
                    } else {
                        ctx.fillStyle = `rgba(79, 195, 247, ${alpha * 0.25})`;
                    }
                }
                ctx.fillRect(
                    margin.left + i * cellW,
                    margin.top + j * cellH,
                    cellW + 0.5,
                    cellH + 0.5
                );
            }
        }

        // Draw boundary contour
        if (!dashed) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        } else {
            ctx.strokeStyle = 'rgba(255, 171, 64, 0.6)';
            ctx.setLineDash([4, 4]);
        }
        ctx.lineWidth = 1.5;

        for (let j = 0; j < GRID_RES - 1; j++) {
            for (let i = 0; i < GRID_RES - 1; i++) {
                const p00 = grid[j][i].prediction;
                const p10 = grid[j][i + 1].prediction;
                const p01 = grid[j + 1][i].prediction;

                if (p00 !== p10) {
                    const px = margin.left + (i + 1) * cellW;
                    const py = margin.top + j * cellH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px, py + cellH);
                    ctx.stroke();
                }
                if (p00 !== p01) {
                    const px = margin.left + i * cellW;
                    const py = margin.top + (j + 1) * cellH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + cellW, py);
                    ctx.stroke();
                }
            }
        }
        ctx.setLineDash([]);
    }

    function renderForestBoundary() {
        if (!state.forest || !xScale) return;
        renderBoundary(state.boundaryGrid, 1.0, false);
    }

    function renderSingleTreeBoundary(treeIdx) {
        if (treeIdx < 0 || !state.treeBoundaries[treeIdx]) {
            renderForestBoundary();
            return;
        }
        // Render forest boundary faintly, then overlay single tree
        renderBoundary(state.boundaryGrid, 0.3, false);

        // Overlay single tree boundary on top
        const grid = state.treeBoundaries[treeIdx];
        const cvs = boundaryCvs;
        const ctx = cvs.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const cellW = plotW / GRID_RES;
        const cellH = plotH / GRID_RES;

        // Draw single tree boundary contour with dashed lines
        ctx.strokeStyle = 'rgba(255, 171, 64, 0.8)';
        ctx.setLineDash([5, 3]);
        ctx.lineWidth = 2;

        for (let j = 0; j < GRID_RES - 1; j++) {
            for (let i = 0; i < GRID_RES - 1; i++) {
                const p00 = grid[j][i].prediction;
                const p10 = grid[j][i + 1].prediction;
                const p01 = grid[j + 1][i].prediction;

                if (p00 !== p10) {
                    const px = margin.left + (i + 1) * cellW;
                    const py = margin.top + j * cellH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px, py + cellH);
                    ctx.stroke();
                }
                if (p00 !== p01) {
                    const px = margin.left + i * cellW;
                    const py = margin.top + (j + 1) * cellH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + cellW, py);
                    ctx.stroke();
                }
            }
        }
        ctx.setLineDash([]);
    }

    /* ================================================================
       MINI TREE RENDERING
    ================================================================ */
    function renderMiniTree(svgEl, tree, idx) {
        const w = 90, h = 76;
        const svg = d3.select(svgEl).attr('viewBox', `0 0 ${w} ${h}`);
        svg.selectAll('*').remove();

        const nodes = [];
        function collect(node, x, y, dx) {
            if (!node) return;
            nodes.push({ node, x, y });
            if (!node.isLeaf) {
                const childDx = dx * 0.5;
                const childY = y + 14;
                collect(node.left, x - dx, childY, childDx);
                collect(node.right, x + dx, childY, childDx);

                // Edge to children
                svg.append('line')
                    .attr('x1', x).attr('y1', y + 3)
                    .attr('x2', x - dx).attr('y2', childY - 3)
                    .attr('stroke', '#2a2a4a').attr('stroke-width', 0.8);
                svg.append('line')
                    .attr('x1', x).attr('y1', y + 3)
                    .attr('x2', x + dx).attr('y2', childY - 3)
                    .attr('stroke', '#2a2a4a').attr('stroke-width', 0.8);
            }
        }

        collect(tree, w / 2, 8, w * 0.22);

        for (const { node, x, y } of nodes) {
            const color = node.isLeaf
                ? (node.prediction === 1 ? '#4fc3f7' : '#ff5252')
                : '#16c79a';
            svg.append('circle')
                .attr('cx', x).attr('cy', y)
                .attr('r', node.isLeaf ? 3 : 2.5)
                .attr('fill', color)
                .attr('opacity', 0.9);
        }
    }

    function buildMiniTreeGallery() {
        miniGallery.innerHTML = '';
        if (!state.forest) return;

        state.forest.trees.forEach(({ tree }, idx) => {
            const div = document.createElement('div');
            div.className = 'mini-tree';
            div.innerHTML = `<svg></svg><div class="mini-tree-label">T${idx + 1}</div>`;
            renderMiniTree(div.querySelector('svg'), tree, idx);

            div.addEventListener('mouseenter', () => {
                state.hoveredTreeIdx = idx;
                div.classList.add('active');
                renderSingleTreeBoundary(idx);
            });
            div.addEventListener('mouseleave', () => {
                state.hoveredTreeIdx = -1;
                div.classList.remove('active');
                renderForestBoundary();
            });

            miniGallery.appendChild(div);
        });
    }

    /* ================================================================
       CHARTS (Chart.js)
    ================================================================ */
    let importanceChart = null;
    let accuracyChart = null;

    function initCharts() {
        // Shared Chart.js defaults
        Chart.defaults.color = '#a8a8b8';
        Chart.defaults.borderColor = '#2a2a4a';
        Chart.defaults.font.family = "'Noto Sans SC', 'Inter', sans-serif";
        Chart.defaults.font.size = 11;

        // Feature importance bar chart
        const ctxImp = $('#chart-importance').getContext('2d');
        importanceChart = new Chart(ctxImp, {
            type: 'bar',
            data: {
                labels: ['特征 X', '特征 Y'],
                datasets: [{
                    label: '重要性',
                    data: [0, 0],
                    backgroundColor: ['#16c79a', '#ffab40'],
                    borderRadius: 4,
                    barThickness: 28,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        min: 0, max: 1,
                        grid: { color: 'rgba(42,42,74,0.5)' },
                        ticks: { callback: v => (v * 100).toFixed(0) + '%' }
                    },
                    y: {
                        grid: { display: false }
                    }
                }
            }
        });

        // Accuracy vs n_trees line chart
        const ctxAcc = $('#chart-accuracy').getContext('2d');
        accuracyChart = new Chart(ctxAcc, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '训练准确率',
                        data: [],
                        borderColor: '#16c79a',
                        backgroundColor: 'rgba(22,199,154,0.1)',
                        borderWidth: 2,
                        pointRadius: 2,
                        fill: true,
                        tension: 0.3,
                    },
                    {
                        label: 'OOB 准确率',
                        data: [],
                        borderColor: '#ffab40',
                        backgroundColor: 'rgba(255,171,64,0.1)',
                        borderWidth: 2,
                        pointRadius: 2,
                        fill: true,
                        tension: 0.3,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { boxWidth: 12, padding: 8, font: { size: 10 } }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: '树的数量', font: { size: 10 } },
                        grid: { color: 'rgba(42,42,74,0.5)' }
                    },
                    y: {
                        min: 0, max: 1,
                        title: { display: true, text: '准确率', font: { size: 10 } },
                        grid: { color: 'rgba(42,42,74,0.5)' },
                        ticks: { callback: v => (v * 100).toFixed(0) + '%' }
                    }
                }
            }
        });
    }

    function updateImportanceChart() {
        if (!state.forest || !importanceChart) return;
        const imp = RFUtils.giniImportance(state.forest);
        const xImp = imp[0] || 0;
        const yImp = imp[1] || 0;
        importanceChart.data.datasets[0].data = [xImp, yImp];
        importanceChart.update('none');
    }

    function computeIncrementalAccuracy() {
        if (!state.forest) return;
        const nTrees = state.forest.nTrees;
        const labels = [];
        const trainAccs = [];
        const oobAccs = [];

        for (let k = 1; k <= nTrees; k++) {
            labels.push(k);
            const subForest = { trees: state.forest.trees.slice(0, k), nTrees: k, maxFeatures: state.forest.maxFeatures };

            // Training accuracy
            let trainCorrect = 0;
            for (const d of state.data) {
                const { prediction } = RFUtils.predictForest(subForest, d);
                if (prediction === d.label) trainCorrect++;
            }
            trainAccs.push(trainCorrect / state.data.length);

            // OOB accuracy
            const oob = RFUtils.oobScore(state.data, subForest);
            oobAccs.push(oob);
        }

        accuracyChart.data.labels = labels;
        accuracyChart.data.datasets[0].data = trainAccs;
        accuracyChart.data.datasets[1].data = oobAccs;
        accuracyChart.update('none');
    }

    /* ================================================================
       BUILD FOREST
    ================================================================ */
    function getMaxFeatures() {
        const val = selMaxfeatures.value;
        if (val === '1') return 1;
        if (val === 'all') return 2;
        return null; // sqrt (default in buildForest)
    }

    function getCriterion() {
        const active = document.querySelector('[data-criterion].active');
        return active ? active.dataset.criterion : 'gini';
    }

    async function buildForest() {
        if (state.data.length < 4) {
            updateStatus('数据不足，请先生成数据');
            return;
        }

        state.isBuilding = true;
        buildingOverlay.classList.add('active');
        updateStatus('正在构建随机森林...');

        // Yield to let UI update
        await new Promise(r => setTimeout(r, 50));

        const nTrees = +selNtrees.value;
        const maxDepth = +sldMaxdepth.value;
        const minSamples = +selMinsplit.value;
        const maxFeatures = getMaxFeatures();
        const criterion = getCriterion();

        try {
            state.forest = RFUtils.buildForest(state.data, {
                nTrees,
                maxDepth,
                minSamples,
                maxFeatures,
                criterion,
                seed: state.seed,
            });

            // Compute boundary grids
            await new Promise(r => setTimeout(r, 20));
            state.boundaryGrid = computeBoundaryGrid((gx, gy) => {
                const pt = { x: gx, y: gy, features: [gx, gy] };
                const res = RFUtils.predictForest(state.forest, pt);
                const total = Object.values(res.votes).reduce((a, b) => a + b, 0);
                const confidence = (res.votes[res.prediction] || 0) / total;
                return { prediction: res.prediction, confidence };
            });

            // Compute per-tree boundaries
            state.treeBoundaries = [];
            for (let t = 0; t < nTrees; t++) {
                const tree = state.forest.trees[t].tree;
                state.treeBoundaries.push(computeBoundaryGrid((gx, gy) => {
                    const pt = { x: gx, y: gy, features: [gx, gy] };
                    const res = RFUtils.predictTree(tree, pt);
                    return { prediction: res.prediction, confidence: 1.0 };
                }));
            }

            // Render
            renderForestBoundary();
            renderPoints();
            buildMiniTreeGallery();

            // Stats
            updateStats();
            updateImportanceChart();

            await new Promise(r => setTimeout(r, 20));
            computeIncrementalAccuracy();

            const totalNodes = state.forest.trees.reduce((s, t) => s + RFUtils.treeNodeCount(t.tree), 0);
            updateStatus(`森林构建完成 — ${nTrees} 棵树，${totalNodes} 个节点`);

        } catch (err) {
            console.error(err);
            updateStatus('构建出错: ' + err.message);
        }

        state.isBuilding = false;
        buildingOverlay.classList.remove('active');
    }

    function updateStats() {
        if (!state.forest) return;

        // OOB accuracy
        const oob = RFUtils.oobScore(state.data, state.forest);
        statOob.textContent = (oob * 100).toFixed(1) + '%';
        statOob.className = 'stat-value' + (oob < 0.7 ? ' warn' : '');

        // Training accuracy
        let trainCorrect = 0;
        for (const d of state.data) {
            const { prediction } = RFUtils.predictForest(state.forest, d);
            if (prediction === d.label) trainCorrect++;
        }
        const trainAcc = trainCorrect / state.data.length;
        statTrain.textContent = (trainAcc * 100).toFixed(1) + '%';

        // Total nodes
        const totalNodes = state.forest.trees.reduce((s, t) => s + RFUtils.treeNodeCount(t.tree), 0);
        statNodes.textContent = totalNodes;

        // Forest size
        statSize.textContent = state.forest.nTrees + ' 棵树';
    }

    /* ================================================================
       EVENT HANDLERS
    ================================================================ */
    function updateStatus(text) {
        statusBar.innerHTML = text;
    }

    // Slider displays
    sldNoise.addEventListener('input', () => {
        valNoise.textContent = (+sldNoise.value).toFixed(2);
    });
    sldMaxdepth.addEventListener('input', () => {
        valMaxdepth.textContent = sldMaxdepth.value;
    });

    // Criterion toggle
    criterionBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            criterionBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Build button
    btnBuild.addEventListener('click', () => {
        if (!state.isBuilding) buildForest();
    });

    // Reset button
    btnReset.addEventListener('click', () => {
        state.forest = null;
        state.boundaryGrid = null;
        state.treeBoundaries = [];
        state.hoveredTreeIdx = -1;

        // Clear canvas
        const ctx = boundaryCvs.getContext('2d');
        ctx.clearRect(0, 0, boundaryCvs.width, boundaryCvs.height);

        // Clear gallery
        miniGallery.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:1rem;text-align:center;width:100%;">点击「构建森林」开始</div>';

        // Reset stats
        statOob.textContent = '—';
        statTrain.textContent = '—';
        statNodes.textContent = '—';
        statSize.textContent = '—';
        statOob.className = 'stat-value';

        // Reset charts
        if (importanceChart) {
            importanceChart.data.datasets[0].data = [0, 0];
            importanceChart.update('none');
        }
        if (accuracyChart) {
            accuracyChart.data.labels = [];
            accuracyChart.data.datasets[0].data = [];
            accuracyChart.data.datasets[1].data = [];
            accuracyChart.update('none');
        }

        renderPoints();
        updateStatus('已重置 — 选择参数后点击「构建森林」');
    });

    // Regenerate data
    btnRegenerate.addEventListener('click', () => {
        state.seed = Math.floor(Math.random() * 100000);
        state.data = generateData();
        state.forest = null;
        state.boundaryGrid = null;
        state.treeBoundaries = [];

        const ctx = boundaryCvs.getContext('2d');
        ctx.clearRect(0, 0, boundaryCvs.width, boundaryCvs.height);

        miniGallery.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:1rem;text-align:center;width:100%;">点击「构建森林」开始</div>';

        statOob.textContent = '—';
        statTrain.textContent = '—';
        statNodes.textContent = '—';
        statSize.textContent = '—';

        renderPoints();
        updateStatus(`已生成 ${state.data.length} 个数据点（${selDataset.options[selDataset.selectedIndex].text}）`);
    });

    // Dataset / size change => regenerate
    selDataset.addEventListener('change', () => {
        state.seed = Math.floor(Math.random() * 100000);
        state.data = generateData();
        state.forest = null;
        state.boundaryGrid = null;
        state.treeBoundaries = [];
        const ctx = boundaryCvs.getContext('2d');
        ctx.clearRect(0, 0, boundaryCvs.width, boundaryCvs.height);
        miniGallery.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:1rem;text-align:center;width:100%;">点击「构建森林」开始</div>';
        renderPoints();
        updateStatus(`数据集: ${selDataset.options[selDataset.selectedIndex].text}，${state.data.length} 个点`);
    });

    selDatasize.addEventListener('change', () => {
        state.data = generateData();
        state.forest = null;
        state.boundaryGrid = null;
        state.treeBoundaries = [];
        const ctx = boundaryCvs.getContext('2d');
        ctx.clearRect(0, 0, boundaryCvs.width, boundaryCvs.height);
        renderPoints();
        updateStatus(`数据量: ${state.data.length} 个点`);
    });

    // Noise change => regenerate data
    sldNoise.addEventListener('change', () => {
        state.data = generateData();
        state.forest = null;
        state.boundaryGrid = null;
        state.treeBoundaries = [];
        const ctx = boundaryCvs.getContext('2d');
        ctx.clearRect(0, 0, boundaryCvs.width, boundaryCvs.height);
        renderPoints();
    });

    // Confidence heatmap toggle
    chkConfidence.addEventListener('change', () => {
        state.showConfidence = chkConfidence.checked;
        if (state.forest) {
            if (state.hoveredTreeIdx >= 0) {
                renderSingleTreeBoundary(state.hoveredTreeIdx);
            } else {
                renderForestBoundary();
            }
        }
    });

    // Resize handler
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            getPlotSize();
            computeScales();
            renderPoints();
            if (state.forest) {
                // Recompute boundary grid with new scales
                state.boundaryGrid = computeBoundaryGrid((gx, gy) => {
                    const pt = { x: gx, y: gy, features: [gx, gy] };
                    const res = RFUtils.predictForest(state.forest, pt);
                    const total = Object.values(res.votes).reduce((a, b) => a + b, 0);
                    const confidence = (res.votes[res.prediction] || 0) / total;
                    return { prediction: res.prediction, confidence };
                });
                for (let t = 0; t < state.forest.nTrees; t++) {
                    const tree = state.forest.trees[t].tree;
                    state.treeBoundaries[t] = computeBoundaryGrid((gx, gy) => {
                        const pt = { x: gx, y: gy, features: [gx, gy] };
                        const res = RFUtils.predictTree(tree, pt);
                        return { prediction: res.prediction, confidence: 1.0 };
                    });
                }
                renderForestBoundary();
            }
        }, 200);
    });

    /* ================================================================
       KEYBOARD SHORTCUT
    ================================================================ */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            if (!state.isBuilding) buildForest();
        }
    });

    /* ================================================================
       INIT
    ================================================================ */
    function init() {
        initCharts();
        state.data = generateData();
        // Short delay to let container size settle
        requestAnimationFrame(() => {
            renderPoints();
            updateStatus(`就绪 — ${state.data.length} 个数据点。点击「构建森林」或 Ctrl+Enter 开始构建。`);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
