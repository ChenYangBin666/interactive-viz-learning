    <style>
        .playground-container { display: grid; grid-template-columns: 280px 1fr 320px; gap: 1rem; padding: 1rem 0; min-height: calc(100vh - var(--header-height) - 120px); }
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.2rem; overflow-y: auto; }
        .panel-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-green); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem; }
        .panel-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); }
        .config-group { margin-bottom: 1.2rem; }
        .config-group label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600; }
        .radio-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .radio-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.2s; font-size: 0.85rem; color: var(--text-secondary); }
        .radio-item:hover { background: rgba(22, 199, 154, 0.08); }
        .radio-item input[type="radio"] { accent-color: var(--accent-green); width: 14px; height: 14px; cursor: pointer; }
        .radio-item.selected { background: rgba(22, 199, 154, 0.12); color: var(--accent-green); }
        .config-slider { display: flex; align-items: center; gap: 0.5rem; }
        .config-slider input[type="range"] { flex: 1; }
        .config-slider .val { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent-green); min-width: 2.5rem; text-align: right; }
        .btn-row { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        .btn-row .btn { flex: 1; }
        .btn-run { background: var(--accent-green); border-color: var(--accent-green); color: var(--bg-primary); font-weight: 700; font-size: 0.95rem; }
        .btn-run:hover { background: #13b58a; border-color: #13b58a; }
        .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-reset { background: transparent; border-color: var(--accent-red); color: var(--accent-red); }
        .btn-reset:hover { background: rgba(255, 82, 82, 0.1); }
        .center-panel { display: flex; flex-direction: column; gap: 1rem; }
        .viz-block { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1rem; position: relative; }

        .hidden-chart-wrap { height: 200px; position: relative; }
        .hidden-chart-wrap canvas, .output-chart-wrap canvas { width: 100% !important; height: 100% !important; }
        .result-block { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 0.75rem; }
        .result-block-title { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.6rem; font-weight: 600; }
        .output-chart-wrap { height: 200px; position: relative; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .metric-card { background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 0.6rem 0.8rem; text-align: center; }
        .metric-card .metric-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.2rem; }
        .metric-card .metric-value { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--accent-green); }
        .gate-stats-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; font-family: var(--font-mono); }
        .gate-stats-table th { color: var(--accent-green); text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        .gate-stats-table td { color: var(--text-secondary); padding: 0.3rem 0.5rem; border-bottom: 1px solid rgba(42, 42, 74, 0.3); }
        .confidence-bars { display: flex; flex-direction: column; gap: 0.4rem; }

        .gen-text-output { font-family: var(--font-mono); font-size: 1.1rem; color: var(--accent-blue); background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 0.8rem; min-height: 60px; letter-spacing: 0.15em; line-height: 1.6; word-break: break-all; }
        .gen-char { display: inline-block; opacity: 0; transform: translateY(8px); }
        .gen-char.visible { opacity: 1; transform: translateY(0); }
        .placeholder-msg { display: flex; align-items: center; justify-content: center; height: 120px; color: var(--text-muted); font-size: 0.9rem; font-style: italic; }
        .page-header { text-align: center; padding-bottom: 0.5rem; }
        .page-header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        @media (max-width: 1200px) { .playground-container { grid-template-columns: 1fr; } .panel { max-height: none; } }

<body>
    <div class="page-container">
        <div class="page-header">

    <!-- Shared Scripts -->
    <script src="../shared/scripts/rnn-utils.js"></script>
    <script src="../shared/scripts/animation-controller.js"></script>
    <script src="../shared/scripts/matrix-renderer.js"></script>
    <script src="../shared/scripts/nav.js"></script>
    <script src="../shared/scripts/katex-init.js"></script>

    <script>
    /* ============================================================
     *  Module 09: RNN 游乐场 — 全部内联逻辑
     * ============================================================ */
    (() => {
        'use strict';

        /* ---------- DOM refs ---------- */
        const $ = id => document.getElementById(id);
        const modelRadios  = document.querySelectorAll('input[name="model-type"]');
        const taskRadios   = document.querySelectorAll('input[name="task-type"]');
        const hiddenSlider = $('hidden-size');
        const layersSlider = $('num-layers');
        const seqSlider    = $('seq-length');
        const lrSlider     = $('lr-slider');
        const btnRun       = $('btn-run');
        const btnReset     = $('btn-reset');

        const HIDDEN_SIZES = [2, 4, 8, 16, 32];

        /* ---------- State ---------- */
        let state = {
            model: 'rnn',
            task: 'sine',
            hiddenSize: 8,
            numLayers: 1,
            seqLength: 20,
            seed: 42,
            lastResult: null,
        };

        let hiddenChart = null;
        let outputChart = null;

        /* ---------- Slider display updates ---------- */
        function syncSliders() {
            $('hidden-size-val').textContent = HIDDEN_SIZES[+hiddenSlider.value];
            $('num-layers-val').textContent  = layersSlider.value;
            $('seq-length-val').textContent   = seqSlider.value;
            $('lr-val').textContent = (lrSlider.value / 1000).toFixed(3);
        }

        hiddenSlider.addEventListener('input', syncSliders);
        layersSlider.addEventListener('input', syncSliders);
        seqSlider.addEventListener('input', syncSliders);
        lrSlider.addEventListener('input', syncSliders);
        syncSliders();

        /* ---------- Radio highlight ---------- */
        function setupRadioHighlight(groupId) {
            const items = document.querySelectorAll(`#${groupId} .radio-item`);
            items.forEach(item => {
                const radio = item.querySelector('input[type="radio"]');
                radio.addEventListener('change', () => {
                    items.forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                });
            });
        }
        setupRadioHighlight('model-type-group');
        setupRadioHighlight('task-type-group');

        /* ---------- Read current config ---------- */
        function readConfig() {
            state.model      = document.querySelector('input[name="model-type"]:checked').value;
            state.task       = document.querySelector('input[name="task-type"]:checked').value;
            state.hiddenSize = HIDDEN_SIZES[+hiddenSlider.value];
            state.numLayers  = +layersSlider.value;
            state.seqLength  = +seqSlider.value;
            state.seed       = +lrSlider.value;
        }

        /* ==========================================================
         *  DATA GENERATION
         * ========================================================== */
        function generateInputData() {
            const { task, seqLength, seed, hiddenSize } = state;
            if (task === 'sine') {
                const raw = RNNUtils.generateSineSequence(seqLength + 1, 0.08, 0.05, seed);
                const xs = raw.slice(0, seqLength).map(v => [v]);
                const targets = raw.slice(1);
                return { xs, targets, inputSize: 1 };
            }
            if (task === 'classify') {
                const rng = RNNUtils.seededRandom(seed);
                const numClasses = 3;
                const trueClass = Math.floor(rng() * numClasses);
                const xs = [];
                for (let t = 0; t < seqLength; t++) {
                    const vec = [];
                    for (let i = 0; i < 3; i++) {
                        vec.push((rng() - 0.5) * 2 + (i === trueClass ? 0.3 : -0.1));
                    }
                    xs.push(vec);
                }
                return { xs, targets: trueClass, inputSize: 3, numClasses, classLabels: ['A 类', 'B 类', 'C 类'] };
            }
            if (task === 'generate') {
                const vocab = 'abcdefghijklmnop';
                const vocabSize = vocab.length;
                const rng = RNNUtils.seededRandom(seed);
                const indices = [];
                for (let t = 0; t < seqLength; t++) {
                    indices.push(Math.floor(rng() * vocabSize));
                }
                const xs = indices.map(i => RNNUtils.oneHot(i, vocabSize));
                return { xs, targets: indices, inputSize: vocabSize, vocab, vocabSize };
            }
        }

        /* ==========================================================
         *  CREATE PARAMS (RNN needs explicit creator)
         * ========================================================== */
        function createRNNParams(hiddenSize, inputSize, seed) {
            return {
                Wxh: RNNUtils.randomMatrix(hiddenSize, inputSize, 0.3, seed + 100),
                Whh: RNNUtils.randomMatrix(hiddenSize, hiddenSize, 0.3, seed + 200),
                bh:  RNNUtils.randomVector(hiddenSize, 0.1, seed + 300),
            };
        }

        /* ==========================================================
         *  FORWARD PASS (multi-layer support)
         * ========================================================== */
        function runForward(data) {
            const { model, hiddenSize, numLayers, seed } = state;
            const { xs, inputSize } = data;
            const allLayerResults = [];
            let layerInput = xs;

            for (let l = 0; l < numLayers; l++) {
                const inSize = l === 0 ? inputSize : hiddenSize;
                const h0 = RNNUtils.zerosVector(hiddenSize);
                const layerSeed = seed * 100 + l * 1000;
                let result;

                if (model === 'rnn') {
                    const p = createRNNParams(hiddenSize, inSize, layerSeed);
                    result = RNNUtils.rnnForward(layerInput, h0, p.Wxh, p.Whh, p.bh);
                    result.type = 'rnn';
                    result.params = p;
                } else if (model === 'lstm') {
                    const p = RNNUtils.createLSTMParams(hiddenSize, inSize, layerSeed);
                    const c0 = RNNUtils.zerosVector(hiddenSize);
                    result = RNNUtils.lstmForward(layerInput, h0, c0, p);
                    result.type = 'lstm';
                    result.params = p;
                } else {
                    const p = RNNUtils.createGRUParams(hiddenSize, inSize, layerSeed);
                    result = RNNUtils.gruForward(layerInput, h0, p);
                    result.type = 'gru';
                    result.params = p;
                }

                allLayerResults.push(result);
                layerInput = result.steps.map(s => s.h);
            }

            return allLayerResults;
        }

        /* ==========================================================
         *  OUTPUT LAYER & LOSS
         * ========================================================== */
        function computeOutput(allLayerResults, data) {
            const { task, hiddenSize, seed } = state;
            const lastLayer = allLayerResults[allLayerResults.length - 1];
            const { steps, finalH } = lastLayer;

            if (task === 'sine') {
                const Why = RNNUtils.randomMatrix(1, hiddenSize, 0.3, seed + 5000);
                const by  = RNNUtils.randomVector(1, 0.1, seed + 5100);
                const predictions = steps.map(s => {
                    const out = RNNUtils.outputLayer(s.h, Why, by);
                    return out[0];
                });
                const loss = RNNUtils.mseLoss(predictions, data.targets.slice(0, predictions.length));
                return { predictions, loss, type: 'sine' };
            }

            if (task === 'classify') {
                const Why = RNNUtils.randomMatrix(data.numClasses, hiddenSize, 0.3, seed + 5000);
                const by  = RNNUtils.randomVector(data.numClasses, 0.1, seed + 5100);
                const result = RNNUtils.classifySequence(finalH, Why, by);
                const loss = RNNUtils.crossEntropyLoss(result.probs, data.targets);
                return { ...result, loss, classLabels: data.classLabels, trueClass: data.targets, type: 'classify' };
            }

            if (task === 'generate') {
                const Why = RNNUtils.randomMatrix(data.vocabSize, hiddenSize, 0.3, seed + 5000);
                const by  = RNNUtils.randomVector(data.vocabSize, 0.1, seed + 5100);
                const generated = [];
                let totalLoss = 0;
                for (let t = 0; t < steps.length - 1; t++) {
                    const logits = RNNUtils.outputLayer(steps[t].h, Why, by);
                    const probs = RNNUtils.softmax(logits);
                    const pred = probs.indexOf(Math.max(...probs));
                    generated.push(data.vocab[pred]);
                    totalLoss += RNNUtils.crossEntropyLoss(probs, data.targets[t + 1]);
                }
                const loss = totalLoss / Math.max(1, steps.length - 1);
                return { generated, loss, type: 'generate' };
            }
        }

        /* ==========================================================
         *  COUNT PARAMETERS
         * ========================================================== */
        function countParams(allLayerResults) {
            let total = 0;
            for (const lr of allLayerResults) {
                const p = lr.params;
                if (lr.type === 'rnn') {
                    total += p.Wxh.length * p.Wxh[0].length;
                    total += p.Whh.length * p.Whh[0].length;
                    total += p.bh.length;
                } else if (lr.type === 'lstm') {
                    for (const key of ['Wf', 'Wi', 'Wc', 'Wo']) {
                        total += p[key].length * p[key][0].length;
                    }
                    for (const key of ['bf', 'bi', 'bc', 'bo']) {
                        total += p[key].length;
                    }
                } else {
                    for (const key of ['Wz', 'Wr', 'Wh']) {
                        total += p[key].length * p[key][0].length;
                    }
                    for (const key of ['bz', 'br', 'bh']) {
                        total += p[key].length;
                    }
                }
            }
            return total;
        }

        /* ==========================================================
         *  GATE STATISTICS
         * ========================================================== */
        function computeGateStats(allLayerResults) {
            const stats = [];
            for (let l = 0; l < allLayerResults.length; l++) {
                const lr = allLayerResults[l];
                const prefix = allLayerResults.length > 1 ? `L${l + 1} ` : '';

                if (lr.type === 'lstm') {
                    const gateNames = ['f', 'i', 'cCand', 'o'];
                    const gateLabels = { f: '遗忘门', i: '输入门', cCand: '候选值', o: '输出门' };
                    for (const g of gateNames) {
                        const vals = lr.steps.flatMap(s => s.gates[g]);
                        stats.push({
                            name: prefix + gateLabels[g],
                            mean: vals.reduce((a, b) => a + b, 0) / vals.length,
                            min: Math.min(...vals),
                            max: Math.max(...vals),
                        });
                    }
                } else if (lr.type === 'gru') {
                    const gateNames = ['z', 'r', 'hCand'];
                    const gateLabels = { z: '更新门', r: '重置门', hCand: '候选隐状态' };
                    for (const g of gateNames) {
                        const vals = lr.steps.flatMap(s => s.gates[g]);
                        stats.push({
                            name: prefix + gateLabels[g],
                            mean: vals.reduce((a, b) => a + b, 0) / vals.length,
                            min: Math.min(...vals),
                            max: Math.max(...vals),
                        });
                    }
                } else {
                    const vals = lr.steps.flatMap(s => s.h);
                    stats.push({
                        name: prefix + '隐藏状态',
                        mean: vals.reduce((a, b) => a + b, 0) / vals.length,
                        min: Math.min(...vals),
                        max: Math.max(...vals),
                    });
                }
            }
            return stats;
        }

        /* ==========================================================
         *  ARCHITECTURE DIAGRAM (D3)
         * ========================================================== */
        function drawArchitecture() {
            const container = $('arch-svg');
            container.innerHTML = '';

            const { model, numLayers, seqLength, hiddenSize } = state;
            const maxSteps = Math.min(seqLength, 8);
            const cellW = 60, cellH = 40, stepGap = 20, layerGap = 60;
            const padX = 50, padY = 40;
            const width  = padX * 2 + maxSteps * (cellW + stepGap) - stepGap;
            const height = padY * 2 + numLayers * (cellH + layerGap) - layerGap + 50;

            const svg = d3.select(container).append('svg')
                .attr('width', width)
                .attr('height', height);

            const defs = svg.append('defs');
            defs.append('marker')
                .attr('id', 'arrowG')
                .attr('viewBox', '0 0 10 6')
                .attr('refX', 10).attr('refY', 3)
                .attr('markerWidth', 8).attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', '#16c79a');

            defs.append('marker')
                .attr('id', 'arrowB')
                .attr('viewBox', '0 0 10 6')
                .attr('refX', 10).attr('refY', 3)
                .attr('markerWidth', 8).attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', '#4fc3f7');

            const modelColors = {
                rnn:  { fill: 'rgba(22,199,154,0.15)', stroke: '#16c79a', label: 'RNN' },
                lstm: { fill: 'rgba(79,195,247,0.15)', stroke: '#4fc3f7', label: 'LSTM' },
                gru:  { fill: 'rgba(179,136,255,0.15)', stroke: '#b388ff', label: 'GRU' },
            };

            const mc = modelColors[model];

            for (let l = 0; l < numLayers; l++) {
                const y = padY + (numLayers - 1 - l) * (cellH + layerGap);

                for (let t = 0; t < maxSteps; t++) {
                    const x = padX + t * (cellW + stepGap);

                    /* Cell rect */
                    svg.append('rect')
                        .attr('x', x).attr('y', y)
                        .attr('width', cellW).attr('height', cellH)
                        .attr('rx', 6).attr('ry', 6)
                        .attr('fill', mc.fill)
                        .attr('stroke', mc.stroke)
                        .attr('stroke-width', 1.5)
                        .attr('opacity', 0)
                        .transition().duration(300).delay(t * 40 + l * 120)
                        .attr('opacity', 1);

                    /* Cell label */
                    svg.append('text')
                        .attr('x', x + cellW / 2).attr('y', y + cellH / 2 + 4)
                        .attr('text-anchor', 'middle')
                        .attr('fill', mc.stroke)
                        .attr('font-size', '11')
                        .attr('font-family', 'JetBrains Mono, monospace')
                        .attr('font-weight', '600')
                        .text(mc.label)
                        .attr('opacity', 0)
                        .transition().duration(300).delay(t * 40 + l * 120)
                        .attr('opacity', 1);

                    /* Horizontal arrows between cells */
                    if (t > 0) {
                        const x0 = padX + (t - 1) * (cellW + stepGap) + cellW;
                        svg.append('line')
                            .attr('x1', x0 + 2).attr('y1', y + cellH / 2)
                            .attr('x2', x - 2).attr('y2', y + cellH / 2)
                            .attr('stroke', mc.stroke).attr('stroke-width', 1.5)
                            .attr('marker-end', 'url(#arrowG)')
                            .attr('opacity', 0)
                            .transition().duration(200).delay(t * 40 + l * 120 + 80)
                            .attr('opacity', 0.7);
                    }

                    /* Vertical arrows between layers */
                    if (l > 0) {
                        const yBelow = padY + (numLayers - l) * (cellH + layerGap) + cellH;
                        svg.append('line')
                            .attr('x1', x + cellW / 2).attr('y1', yBelow - cellH + 2)
                            .attr('x2', x + cellW / 2).attr('y2', y + cellH + 2)
                            .attr('stroke', '#4fc3f7').attr('stroke-width', 1)
                            .attr('stroke-dasharray', '4,3')
                            .attr('marker-end', 'url(#arrowB)')
                            .attr('opacity', 0)
                            .transition().duration(200).delay(t * 40 + l * 120 + 100)
                            .attr('opacity', 0.5);
                    }

                    /* Input labels (bottom) */
                    if (l === 0) {
                        svg.append('text')
                            .attr('x', x + cellW / 2)
                            .attr('y', padY + numLayers * (cellH + layerGap) - layerGap + cellH + 20)
                            .attr('text-anchor', 'middle')
                            .attr('fill', '#6c6c7c')
                            .attr('font-size', '10')
                            .attr('font-family', 'JetBrains Mono, monospace')
                            .text(t < maxSteps - 1 ? `x${t}` : (seqLength > maxSteps ? '...' : `x${t}`));
                    }
                }

                /* Layer label */
                svg.append('text')
                    .attr('x', padX - 8).attr('y', y + cellH / 2 + 4)
                    .attr('text-anchor', 'end')
                    .attr('fill', '#a8a8b8')
                    .attr('font-size', '10')
                    .attr('font-family', 'JetBrains Mono, monospace')
                    .text(numLayers > 1 ? `L${l + 1}` : '');
            }

            /* Dimension label */
            svg.append('text')
                .attr('x', width / 2).attr('y', 16)
                .attr('text-anchor', 'middle')
                .attr('fill', '#a8a8b8')
                .attr('font-size', '11')
                .text(`${model.toUpperCase()} | 隐藏维度=${hiddenSize} | ${numLayers}层 | ${seqLength}步`);
        }

        /* ==========================================================
         *  GATE HEATMAP (D3)
         * ========================================================== */
        function drawHeatmap(allLayerResults) {
            const container = $('heatmap-container');
            container.innerHTML = '';

            const lastLayer = allLayerResults[allLayerResults.length - 1];
            const { steps, type } = lastLayer;
            const T = steps.length;

            let gateData = [];
            let gateLabels = [];

            if (type === 'lstm') {
                gateLabels = ['遗忘门', '输入门', '候选值', '输出门'];
                const gateKeys = ['f', 'i', 'cCand', 'o'];
                for (const key of gateKeys) {
                    const row = steps.map(s => {
                        const vals = s.gates[key];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;
                    });
                    gateData.push(row);
                }
            } else if (type === 'gru') {
                gateLabels = ['更新门', '重置门', '候选隐状态'];
                const gateKeys = ['z', 'r', 'hCand'];
                for (const key of gateKeys) {
                    const row = steps.map(s => {
                        const vals = s.gates[key];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;
                    });
                    gateData.push(row);
                }
            } else {
                gateLabels = ['隐藏状态'];
                const row = steps.map(s => {
                    const vals = s.h;
                    return vals.reduce((a, b) => a + b, 0) / vals.length;
                });
                gateData.push(row);
            }

            const rows = gateData.length;
            const cols = T;
            const cellW = Math.max(12, Math.min(28, 500 / cols));
            const cellH = 28;
            const labelW = 80;
            const labelH = 24;
            const width  = labelW + cols * cellW + 10;
            const height = labelH + rows * cellH + 10;

            const svg = d3.select(container).append('svg')
                .attr('width', width).attr('height', height);

            /* Color scale */
            const allVals = gateData.flat();
            const vMin = Math.min(...allVals);
            const vMax = Math.max(...allVals);

            function heatColor(v) {
                const t = vMax !== vMin ? (v - vMin) / (vMax - vMin) : 0.5;
                const r = Math.round(255 * (1 - t) * 0.8);
                const g = Math.round(200 * t);
                const b = Math.round(80 + 80 * (1 - Math.abs(t - 0.5) * 2));
                return `rgb(${r},${g},${b})`;
            }

            /* Column labels */
            for (let c = 0; c < cols; c++) {
                if (cols > 20 && c % 5 !== 0) continue;
                svg.append('text')
                    .attr('x', labelW + c * cellW + cellW / 2)
                    .attr('y', labelH - 4)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#6c6c7c')
                    .attr('font-size', '9')
                    .attr('font-family', 'JetBrains Mono, monospace')
                    .text(`t${c}`);
            }

            /* Rows */
            for (let r = 0; r < rows; r++) {
                /* Row label */
                svg.append('text')
                    .attr('x', labelW - 6)
                    .attr('y', labelH + r * cellH + cellH / 2 + 3)
                    .attr('text-anchor', 'end')
                    .attr('fill', '#a8a8b8')
                    .attr('font-size', '10')
                    .text(gateLabels[r]);

                for (let c = 0; c < cols; c++) {
                    const val = gateData[r][c];
                    svg.append('rect')
                        .attr('x', labelW + c * cellW)
                        .attr('y', labelH + r * cellH)
                        .attr('width', cellW - 1)
                        .attr('height', cellH - 1)
                        .attr('rx', 2)
                        .attr('fill', heatColor(val))
                        .attr('opacity', 0)
                        .transition().duration(300).delay(c * 15 + r * 60)
                        .attr('opacity', 1);

                    /* Tooltip rect */
                    svg.append('title').text(`${gateLabels[r]} t=${c}: ${val.toFixed(4)}`);
                }
            }
        }

        /* ==========================================================
         *  HIDDEN STATE TRAJECTORIES (Chart.js)
         * ========================================================== */
        function drawHiddenTrajectories(allLayerResults) {
            const canvas = $('hidden-chart');
            if (hiddenChart) { hiddenChart.destroy(); hiddenChart = null; }

            const lastLayer = allLayerResults[allLayerResults.length - 1];
            const { steps } = lastLayer;
            const H = state.hiddenSize;
            const T = steps.length;

            const dimColors = [
                '#16c79a', '#4fc3f7', '#b388ff', '#ffab40', '#ff5252',
                '#ff80ab', '#ffd740', '#80cbc4', '#ce93d8', '#a5d6a7',
                '#ef9a9a', '#90caf9', '#fff59d', '#bcaaa4', '#b0bec5',
                '#e6ee9c', '#80deea', '#f48fb1', '#c5e1a5', '#ffe082',
                '#81d4fa', '#a5d6a7', '#ffcc80', '#ef9a9a', '#b39ddb',
                '#80cbc4', '#fff176', '#f48fb1', '#4db6ac', '#7986cb',
                '#aed581', '#e57373'
            ];

            const datasets = [];
            for (let d = 0; d < Math.min(H, 32); d++) {
                datasets.push({
                    label: `h[${d}]`,
                    data: steps.map(s => s.h[d]),
                    borderColor: dimColors[d % dimColors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.3,
                });
            }

            hiddenChart = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: Array.from({ length: T }, (_, i) => i),
                    datasets,
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 800 },
                    plugins: {
                        legend: {
                            display: H <= 8,
                            position: 'bottom',
                            labels: { color: '#a8a8b8', font: { size: 10, family: 'JetBrains Mono' }, boxWidth: 12 }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#e8e8e8',
                            bodyColor: '#a8a8b8',
                            borderColor: '#2a2a4a',
                            borderWidth: 1,
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: '时间步', color: '#6c6c7c', font: { size: 11 } },
                            ticks: { color: '#6c6c7c', font: { size: 9 } },
                            grid: { color: 'rgba(42,42,74,0.3)' },
                        },
                        y: {
                            title: { display: true, text: '隐藏状态值', color: '#6c6c7c', font: { size: 11 } },
                            ticks: { color: '#6c6c7c', font: { size: 9 } },
                            grid: { color: 'rgba(42,42,74,0.3)' },
                        }
                    }
                }
            });
        }

        /* ==========================================================
         *  TASK OUTPUT RENDERING
         * ========================================================== */
        function renderTaskOutput(output, data) {
            const container = $('task-output');
            container.innerHTML = '';

            if (output.type === 'sine') {
                const wrap = document.createElement('div');
                wrap.className = 'output-chart-wrap';
                const cvs = document.createElement('canvas');
                cvs.id = 'output-chart-canvas';
                wrap.appendChild(cvs);
                container.appendChild(wrap);

                if (outputChart) { outputChart.destroy(); outputChart = null; }
                const T = output.predictions.length;
                const labels = Array.from({ length: T }, (_, i) => i);

                outputChart = new Chart(cvs, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: '实际值',
                                data: data.targets.slice(0, T),
                                borderColor: '#4fc3f7',
                                backgroundColor: 'rgba(79,195,247,0.1)',
                                borderWidth: 2,
                                pointRadius: 0,
                                fill: true,
                            },
                            {
                                label: '预测值',
                                data: output.predictions,
                                borderColor: '#16c79a',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                borderDash: [5, 3],
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 800 },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#a8a8b8', font: { size: 10 }, boxWidth: 12 }
                            },
                            tooltip: {
                                backgroundColor: '#16213e',
                                titleColor: '#e8e8e8',
                                bodyColor: '#a8a8b8',
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: '时间步', color: '#6c6c7c', font: { size: 10 } },
                                ticks: { color: '#6c6c7c', font: { size: 9 } },
                                grid: { color: 'rgba(42,42,74,0.3)' },
                            },
                            y: {
                                title: { display: true, text: '值', color: '#6c6c7c', font: { size: 10 } },
                                ticks: { color: '#6c6c7c', font: { size: 9 } },
                                grid: { color: 'rgba(42,42,74,0.3)' },
                            }
                        }
                    }
                });
            }

            else if (output.type === 'classify') {
                const predLabel = output.classLabels[output.pred];
                const trueLabel = output.classLabels[output.trueClass];
                const isCorrect = output.pred === output.trueClass;

                const header = document.createElement('div');
                header.style.cssText = 'margin-bottom:0.6rem;font-size:0.85rem;';
                header.innerHTML = `
                    <span style="color:var(--text-secondary)">预测: </span>
                    <span style="color:${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight:700;">${predLabel}</span>
                    <span style="color:var(--text-muted); margin:0 0.3rem;">|</span>
                    <span style="color:var(--text-secondary)">真实: </span>
                    <span style="color:var(--accent-blue); font-weight:700;">${trueLabel}</span>
                    <span style="color:var(--text-muted); margin-left:0.4rem;">${isCorrect ? '正确' : '错误'}</span>
                `;
                container.appendChild(header);

                const bars = document.createElement('div');
                bars.className = 'confidence-bars';
                output.probs.forEach((p, i) => {
                    const isPred = i === output.pred;
                    const isTrue = i === output.trueClass;
                    const color = isPred ? 'var(--accent-green)' : (isTrue ? 'var(--accent-blue)' : 'var(--border-color)');
                    const row = document.createElement('div');
                    row.className = 'conf-bar-row';
                    row.innerHTML = `
                        <span class="conf-bar-label">${output.classLabels[i]}</span>
                        <div class="conf-bar-track">
                            <div class="conf-bar-fill" style="width:0%;background:${color}"></div>
                        </div>
                        <span class="conf-bar-pct">${(p * 100).toFixed(1)}%</span>
                    `;
                    bars.appendChild(row);
                });
                container.appendChild(bars);

                /* Animate bars */
                requestAnimationFrame(() => {
                    const fills = bars.querySelectorAll('.conf-bar-fill');
                    fills.forEach((f, i) => {
                        f.style.width = (output.probs[i] * 100) + '%';
                    });
                });
            }

            else if (output.type === 'generate') {
                const div = document.createElement('div');
                div.className = 'gen-text-output';
                output.generated.forEach(ch => {
                    const span = document.createElement('span');
                    span.className = 'gen-char';
                    span.textContent = ch;
                    div.appendChild(span);
                });
                container.appendChild(div);

                /* Animate characters appearing */
                const chars = div.querySelectorAll('.gen-char');
                chars.forEach((ch, i) => {
                    gsap.to(ch, {
                        opacity: 1,
                        y: 0,
                        duration: 0.15,
                        delay: i * 0.06,
                        ease: 'power2.out',
                        onStart: () => ch.classList.add('visible'),
                    });
                });
            }
        }

        /* ==========================================================
         *  METRICS & GATE STATS
         * ========================================================== */
        function renderMetrics(output, paramCount) {
            const lossEl = $('metric-loss');
            const paramEl = $('metric-params');

            gsap.fromTo(lossEl, { textContent: '...' }, {
                duration: 0.6,
                onUpdate: function () {
                    lossEl.textContent = output.loss.toFixed(4);
                },
            });
            lossEl.textContent = output.loss.toFixed(4);

            paramEl.textContent = paramCount.toLocaleString();
            gsap.from(paramEl, { opacity: 0, y: 6, duration: 0.4 });
        }

        function renderGateStats(stats) {
            const container = $('gate-stats');
            container.innerHTML = '';

            if (stats.length === 0) {
                container.innerHTML = '<div class="placeholder-msg" style="height:60px">无门控数据</div>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'gate-stats-table';
            table.innerHTML = `
                <thead>
                    <tr><th>门控</th><th>均值</th><th>最小</th><th>最大</th></tr>
                </thead>
                <tbody>
                    ${stats.map(s => `
                        <tr>
                            <td style="color:var(--accent-green)">${s.name}</td>
                            <td>${s.mean.toFixed(4)}</td>
                            <td>${s.min.toFixed(4)}</td>
                            <td>${s.max.toFixed(4)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            container.appendChild(table);

            gsap.from(table, { opacity: 0, y: 10, duration: 0.5 });
        }

        /* ==========================================================
         *  MAIN RUN
         * ========================================================== */
        async function run() {
            readConfig();
            btnRun.disabled = true;
            $('running-indicator').classList.add('active');

            /* Small delay so the UI updates */
            await new Promise(r => setTimeout(r, 50));

            try {
                /* 1. Draw architecture first */
                drawArchitecture();

                /* 2. Generate data */
                const data = generateInputData();

                /* 3. Forward pass */
                const allLayerResults = runForward(data);

                /* 4. Compute output */
                const output = computeOutput(allLayerResults, data);

                /* 5. Count params */
                const paramCount = countParams(allLayerResults);

                /* 6. Gate stats */
                const gateStats = computeGateStats(allLayerResults);

                state.lastResult = { allLayerResults, data, output, paramCount, gateStats };

                /* 7. Render everything with staggered animations */
                await new Promise(r => setTimeout(r, 100));
                drawHeatmap(allLayerResults);

                await new Promise(r => setTimeout(r, 150));
                drawHiddenTrajectories(allLayerResults);

                await new Promise(r => setTimeout(r, 100));
                renderTaskOutput(output, data);
                renderMetrics(output, paramCount);
                renderGateStats(gateStats);

            } catch (err) {
                console.error('运行出错:', err);
                $('task-output').innerHTML = `<div class="placeholder-msg" style="color:var(--accent-red)">运行出错: ${err.message}</div>`;
            }

            btnRun.disabled = false;
            $('running-indicator').classList.remove('active');
        }

        /* ==========================================================
         *  RESET
         * ========================================================== */
        function resetAll() {
            state.lastResult = null;

            $('arch-svg').innerHTML = '<div class="placeholder-msg">选择参数后点击「运行」</div>';
            $('heatmap-container').innerHTML = '<div class="placeholder-msg">等待运行...</div>';
            $('task-output').innerHTML = '<div class="placeholder-msg">等待运行...</div>';
            $('gate-stats').innerHTML = '<div class="placeholder-msg" style="height:60px">等待运行...</div>';
            $('metric-loss').textContent = '—';
            $('metric-params').textContent = '—';

            if (hiddenChart) { hiddenChart.destroy(); hiddenChart = null; }
            if (outputChart) { outputChart.destroy(); outputChart = null; }

            /* Re-create empty hidden chart area */
            const canvas = $('hidden-chart');
            const parent = canvas.parentElement;
            parent.removeChild(canvas);
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'hidden-chart';
            parent.appendChild(newCanvas);
        }

        /* ==========================================================
         *  EVENT BINDINGS
         * ========================================================== */
        btnRun.addEventListener('click', run);
        btnReset.addEventListener('click', resetAll);

        /* Keyboard shortcut: Enter to run */
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
                if (document.activeElement.tagName !== 'INPUT' || document.activeElement.type === 'range') {
                    e.preventDefault();
                    run();
                }
            }
        });

        /* ==========================================================
         *  INIT
         * ========================================================== */

        /* Draw initial architecture on load */
        readConfig();
        drawArchitecture();

    })();
    </script>
</body>
</html>
