<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游乐场 — 因子模型</title>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" defer>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" defer></script>
    <script src="../shared/scripts/nav.js" defer></script>
    <script src="../shared/scripts/factor-utils.js" defer></script>
    <style>
        /* ===== Playground Layout ===== */
        .playground-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 1rem;
            padding-top: 0.5rem;
            min-height: calc(100vh - var(--header-height) - 6rem);
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            overflow-y: auto;
            max-height: calc(100vh - var(--header-height) - 7rem);
        }

        .panel::-webkit-scrollbar { width: 5px; }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ===== Config Panel ===== */
        .config-section {
            margin-bottom: 1.2rem;
        }

        .config-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .model-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .model-btn {
            padding: 0.45rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .model-btn:hover {
            border-color: #2e7d32;
            color: var(--text-primary);
        }

        .model-btn.active {
            background: rgba(46, 125, 50, 0.25);
            border-color: #2e7d32;
            color: #66bb6a;
            font-weight: 600;
        }

        .factor-toggles {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .factor-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.5rem;
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.15);
            font-size: 0.8rem;
        }

        .factor-toggle-row .fname {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .factor-toggle-row .fdot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .mini-toggle {
            position: relative;
            width: 34px;
            height: 18px;
            cursor: pointer;
        }

        .mini-toggle input { display: none; }

        .mini-toggle .mtrack {
            position: absolute;
            inset: 0;
            background: var(--border-color);
            border-radius: 9px;
            transition: background 0.3s;
        }

        .mini-toggle input:checked + .mtrack {
            background: #2e7d32;
        }

        .mini-toggle .mtrack::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: #ccc;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .mini-toggle input:checked + .mtrack::after {
            transform: translateX(16px);
            background: #fff;
        }

        .param-row {
            margin-bottom: 0.8rem;
        }

        .param-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .param-row label span.pval {
            color: #66bb6a;
            font-family: var(--font-mono);
        }

        .param-row input[type="range"] {
            height: 5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .action-buttons .btn {
            width: 100%;
            justify-content: center;
            font-size: 0.82rem;
        }

        .btn-run {
            background: #2e7d32 !important;
            border-color: #2e7d32 !important;
            color: #fff !important;
            font-weight: 700;
        }

        .btn-run:hover {
            background: #388e3c !important;
        }

        .btn-auto {
            background: rgba(46, 125, 50, 0.15);
            border-color: #2e7d32;
            color: #66bb6a;
        }

        .btn-export {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-reset {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* ===== Center Panel ===== */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .viz-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border-color);
        }

        .viz-tab {
            padding: 0.5rem 1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .viz-tab:hover { color: var(--text-secondary); }

        .viz-tab.active {
            color: #66bb6a;
        }

        .viz-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #2e7d32;
        }

        .main-canvas-wrap {
            position: relative;
            flex: 1;
            min-height: 420px;
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .main-canvas-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-tooltip {
            position: absolute;
            display: none;
            background: rgba(15, 52, 96, 0.95);
            border: 1px solid #2e7d32;
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
            font-size: 0.75rem;
            color: var(--text-primary);
            pointer-events: none;
            z-index: 50;
            min-width: 160px;
            line-height: 1.5;
        }

        .canvas-tooltip .tt-title {
            font-weight: 700;
            color: #66bb6a;
            margin-bottom: 0.3rem;
        }

        .compare-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: var(--border-color);
        }

        .compare-overlay.active {
            display: grid;
        }

        .compare-half {
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .compare-half canvas {
            width: 100%;
            height: 100%;
        }

        .compare-label {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            font-size: 0.75rem;
            color: #66bb6a;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .auto-play-bar {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(46, 125, 50, 0.1);
            border: 1px solid rgba(46, 125, 50, 0.3);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .auto-play-bar.active { display: flex; }

        .auto-play-bar .ap-progress {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .auto-play-bar .ap-fill {
            height: 100%;
            background: #2e7d32;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .auto-play-bar .ap-label {
            font-family: var(--font-mono);
            color: #66bb6a;
            min-width: 120px;
            text-align: right;
        }

        /* ===== Right Panel ===== */
        .result-section {
            margin-bottom: 1rem;
        }

        .result-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }

        .summary-item {
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            text-align: center;
        }

        .summary-item .si-label {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .summary-item .si-value {
            font-size: 1.05rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #66bb6a;
        }

        .factor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            font-family: var(--font-mono);
        }

        .factor-table th {
            text-align: left;
            padding: 0.35rem 0.4rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        .factor-table td {
            padding: 0.35rem 0.4rem;
            border-bottom: 1px solid rgba(42,42,74,0.3);
            color: var(--text-secondary);
        }

        .factor-table tr:hover td {
            background: rgba(46, 125, 50, 0.08);
        }

        .sig-star {
            color: #ffd740;
            font-weight: 700;
        }

        .mini-chart {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.15);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(42,42,74,0.3);
            overflow: hidden;
        }

        .mini-chart canvas {
            width: 100%;
            height: 100%;
        }

        /* ===== Header ===== */
        .page-header {
            text-align: center;
            padding-bottom: 1rem;
            margin-bottom: 0.5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 1200px) {
            .playground-layout {
                grid-template-columns: 260px 1fr 280px;
            }
        }

        @media (max-width: 1024px) {
            .playground-layout {
                grid-template-columns: 1fr;
                max-height: none;
            }
            .panel {
                max-height: none;
            }
        }

        /* ===== Misc ===== */
        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.8rem 0;
        }

        select.param-select {
            width: 100%;
            padding: 0.4rem 0.5rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        select.param-select:focus {
            border-color: #2e7d32;
        }

        .color-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.4rem;
            font-size: 0.72rem;
        }

        .color-legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
        }

        .color-legend-item .cl-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>因子模型游乐场</h1>
        <p>自由选择因子、调节参数，观察模型拟合效果的实时变化</p>
    </div>

    <div class="playground-layout">
        <!-- ==================== Left Panel: Configuration ==================== -->
        <div class="panel" id="configPanel">
            <div class="panel-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                模型配置
            </div>

            <!-- Model Selection -->
            <div class="config-section">
                <div class="config-label">选择模型</div>
                <div class="model-select">
                    <button class="model-btn active" data-model="capm">CAPM</button>
                    <button class="model-btn" data-model="ff3">FF 三因子</button>
                    <button class="model-btn" data-model="ff5">FF 五因子</button>
                    <button class="model-btn" data-model="custom">自定义</button>
                </div>
            </div>

            <!-- Factor Toggles (for custom) -->
            <div class="config-section" id="factorToggles" style="display:none;">
                <div class="config-label">选择因子</div>
                <div class="factor-toggles" id="factorToggleList"></div>
            </div>

            <div class="divider"></div>

            <!-- Parameters -->
            <div class="config-section">
                <div class="config-label">市场参数</div>
                <div class="param-row">
                    <label>无风险利率 <span class="pval" id="rfVal">3.0%</span></label>
                    <input type="range" id="rfSlider" min="0" max="8" step="0.5" value="3">
                </div>
                <div class="param-row">
                    <label>市场溢价 <span class="pval" id="mpVal">6.0%</span></label>
                    <input type="range" id="mpSlider" min="2" max="12" step="0.5" value="6">
                </div>
            </div>

            <div class="config-section">
                <div class="config-label">模拟参数</div>
                <div class="param-row">
                    <label>股票数量 <span class="pval" id="nStockVal">50</span></label>
                    <input type="range" id="nStockSlider" min="20" max="100" step="5" value="50">
                </div>
                <div class="param-row">
                    <label>模拟期数 <span class="pval" id="nPeriodVal">120</span></label>
                    <input type="range" id="nPeriodSlider" min="60" max="360" step="20" value="120">
                </div>
                <div class="param-row">
                    <label>噪声水平 <span class="pval" id="noiseVal">中</span></label>
                    <input type="range" id="noiseSlider" min="1" max="3" step="1" value="2">
                </div>
            </div>

            <div class="divider"></div>

            <div class="config-section">
                <div class="config-label">颜色分组</div>
                <select class="param-select" id="colorBy">
                    <option value="beta">按 Beta</option>
                    <option value="size">按市值</option>
                    <option value="industry">按行业</option>
                </select>
            </div>

            <div class="divider"></div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-run" id="btnRun">运行模拟</button>
                <button class="btn btn-auto" id="btnAutoPlay">自动演示：逐步添加因子</button>
                <button class="btn btn-export" id="btnExport">导出结果</button>
                <button class="btn btn-reset" id="btnReset">重置</button>
            </div>
        </div>

        <!-- ==================== Center Panel: Main Visualization ==================== -->
        <div class="panel center-panel" id="centerPanel">
            <div class="viz-tabs">
                <button class="viz-tab active" data-view="scatter">预测 vs 实际</button>
                <button class="viz-tab" data-view="sml">SML 视图</button>
                <button class="viz-tab" data-view="heatmap">因子暴露热力图</button>
                <button class="viz-tab" data-view="cumret">累计收益</button>
                <button class="viz-tab" data-view="compare">模型对比</button>
            </div>

            <div class="main-canvas-wrap" id="mainCanvasWrap">
                <canvas id="mainCanvas"></canvas>
                <div class="canvas-tooltip" id="canvasTooltip"></div>
                <div class="compare-overlay" id="compareOverlay">
                    <div class="compare-half">
                        <canvas id="compareCanvas1"></canvas>
                        <div class="compare-label" id="compareLabel1">模型 A</div>
                    </div>
                    <div class="compare-half">
                        <canvas id="compareCanvas2"></canvas>
                        <div class="compare-label" id="compareLabel2">模型 B</div>
                    </div>
                </div>
            </div>

            <div class="color-legend" id="colorLegend"></div>

            <div class="auto-play-bar" id="autoPlayBar">
                <span>自动演示中...</span>
                <div class="ap-progress"><div class="ap-fill" id="apFill"></div></div>
                <span class="ap-label" id="apLabel">CAPM (1因子)</span>
                <button class="btn btn-sm" id="btnStopAuto" style="color:var(--accent-red);border-color:var(--accent-red);">停止</button>
            </div>
        </div>

        <!-- ==================== Right Panel: Results ==================== -->
        <div class="panel" id="resultPanel">
            <div class="panel-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17H5a2 2 0 00-2 2v2h18v-2a2 2 0 00-2-2h-4"/><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/></svg>
                分析结果
            </div>

            <!-- Summary -->
            <div class="result-section">
                <div class="result-section-title">模型概要</div>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="si-label">模型</div>
                        <div class="si-value" id="sumModel">CAPM</div>
                    </div>
                    <div class="summary-item">
                        <div class="si-label">因子数</div>
                        <div class="si-value" id="sumFactors">1</div>
                    </div>
                    <div class="summary-item">
                        <div class="si-label">R&sup2;</div>
                        <div class="si-value" id="sumR2">--</div>
                    </div>
                    <div class="summary-item">
                        <div class="si-label">调整 R&sup2;</div>
                        <div class="si-value" id="sumAdjR2">--</div>
                    </div>
                </div>
            </div>

            <!-- Factor Stats -->
            <div class="result-section">
                <div class="result-section-title">因子统计</div>
                <div style="overflow-x:auto;">
                    <table class="factor-table" id="factorStatsTable">
                        <thead>
                            <tr><th>因子</th><th>&beta;</th><th>t 值</th><th>p 值</th><th></th></tr>
                        </thead>
                        <tbody id="factorStatsBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Factor Contribution Pie -->
            <div class="result-section">
                <div class="result-section-title">因子贡献</div>
                <div class="mini-chart">
                    <canvas id="pieCanvas"></canvas>
                </div>
            </div>

            <!-- Alpha Distribution -->
            <div class="result-section">
                <div class="result-section-title">Alpha 分布</div>
                <div class="mini-chart">
                    <canvas id="alphaCanvas"></canvas>
                </div>
            </div>

            <!-- Residual Diagnostics -->
            <div class="result-section">
                <div class="result-section-title">残差诊断</div>
                <div class="mini-chart">
                    <canvas id="residCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // =========================================================================
    //  KaTeX auto-render
    // =========================================================================
    if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.body, {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
            ]
        });
    }

    // =========================================================================
    //  Constants & State
    // =========================================================================
    const FU = window.FactorUtils;
    const COLORS = {
        market:        '#6366f1',
        size:          '#f59e0b',
        value:         '#10b981',
        momentum:      '#ef4444',
        profitability: '#8b5cf6',
        investment:    '#06b6d4',
        volatility:    '#ff80ab',
    };

    const FACTOR_DEFS = [
        { key: 'market',        label: '市场',   color: COLORS.market },
        { key: 'size',          label: '规模',   color: COLORS.size },
        { key: 'value',         label: '价值',   color: COLORS.value },
        { key: 'momentum',      label: '动量',   color: COLORS.momentum },
        { key: 'profitability', label: '盈利',   color: COLORS.profitability },
        { key: 'investment',    label: '投资',   color: COLORS.investment },
        { key: 'volatility',    label: '波动率', color: COLORS.volatility },
    ];

    const INDUSTRY_NAMES = ['科技','金融','消费','医疗','能源','工业','材料','公用'];
    const INDUSTRY_COLORS = ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ff80ab','#94a3b8'];

    const MODEL_PRESETS = {
        capm:   ['market'],
        ff3:    ['market', 'size', 'value'],
        ff5:    ['market', 'size', 'value', 'profitability', 'investment'],
        custom: ['market'],
    };

    let state = loadState() || {
        model: 'capm',
        customFactors: { market: true, size: false, value: false, momentum: false, profitability: false, investment: false, volatility: false },
        rf: 3, mp: 6, nStocks: 50, nPeriods: 120, noise: 2,
        colorBy: 'beta',
        currentView: 'scatter',
    };

    let simData = null;       // simulation results
    let autoPlayTimer = null;
    let selectedStockIdx = -1;

    // =========================================================================
    //  DOM References
    // =========================================================================
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    const mainCanvas = $('#mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const tooltip = $('#canvasTooltip');

    // =========================================================================
    //  Initialization
    // =========================================================================
    initUI();
    runSimulation();

    // =========================================================================
    //  UI Setup
    // =========================================================================

        $$('.model-btn').forEach(btn => {
            if (btn.dataset.model === state.model) btn.classList.add('active');

        setupSlider('mpSlider', 'mpVal', v => { state.mp = +v; return v + '%'; });
        setupSlider('nStockSlider', 'nStockVal', v => { state.nStocks = +v; return v; });
        setupSlider('nPeriodSlider', 'nPeriodVal', v => { state.nPeriods = +v; return v; });
        setupSlider('noiseSlider', 'noiseVal', v => { state.noise = +v; return ['低','中','高'][v-1]; });

        $('#mpSlider').value = state.mp;

        $('#nStockSlider').value = state.nStocks;
        $('#nStockVal').textContent = state.nStocks;
        $('#nPeriodSlider').value = state.nPeriods;
        $('#nPeriodVal').textContent = state.nPeriods;
        $('#noiseSlider').value = state.noise;
        $('#noiseVal').textContent = ['低','中','高'][state.noise-1];
        $('#colorBy').value = state.colorBy;

        // Color by
        $('#colorBy').addEventListener('change', e => {

        });

        // Viz tabs
        $$('.viz-tab').forEach(tab => {

    function setupSlider(id, valId, fn) {

    // =========================================================================
    //  State Persistence
    // =========================================================================
    function saveState() {
        try { localStorage.setItem('fm09_state', JSON.stringify(state)); } catch(e) {}
    }

    function loadState() {
        try {
            const s = localStorage.getItem('fm09_state');
            return s ? JSON.parse(s) : null;
        } catch(e) { return null; }
    }

    // =========================================================================
    //  Simulation
    // =========================================================================
    function getActiveFactors() {
        if (state.model === 'custom') {
            const factors = [];
            for (const fd of FACTOR_DEFS) {
                if (state.customFactors[fd.key]) factors.push(fd.key);
            }
            if (!factors.includes('market')) factors.unshift('market');
            return factors;
        }
        return MODEL_PRESETS[state.model] || ['market'];
    }

    function runSimulation() {
        const N = state.nStocks;
        const T = state.nPeriods;
        const seed = Math.floor(Math.random() * 100000);
        const rng = FU.seededRandom(seed);
        const noiseScale = [0.5, 1.0, 2.0][state.noise - 1];
        const rfPeriod = (state.rf / 100) / 12;
        const mpPeriod = (state.mp / 100) / 12;

        // Generate factor return series
        const factorNames = ['market','size','value','momentum','profitability','investment','volatility'];
        const factorAnnualMu = [state.mp/100, 0.02, 0.03, 0.06, 0.03, 0.03, -0.01];
        const factorAnnualSig = [0.16, 0.10, 0.10, 0.14, 0.08, 0.08, 0.12];

        const factorSeries = {};
        factorNames.forEach((name, i) => {
            const mu = factorAnnualMu[i] / 12;
            const sig = factorAnnualSig[i] / Math.sqrt(12);
            const series = [];
            for (let t = 0; t < T; t++) {
                series.push(mu + sig * FU.normalRandom(rng));
            }
            factorSeries[name] = series;
        });

        // Generate stocks
        const stocks = [];
        for (let i = 0; i < N; i++) {
            const name = '股票' + String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
            const beta = 0.4 + rng() * 1.4;
            const marketCap = Math.exp(4 + rng() * 4); // log-normal market cap
            const industry = Math.floor(rng() * INDUSTRY_NAMES.length);

            // True factor exposures
            const trueExposures = {};
            factorNames.forEach(fn => {
                if (fn === 'market') trueExposures[fn] = beta;
                else trueExposures[fn] = (rng() - 0.5) * 1.2;
            });

            // True alpha (small)
            const trueAlpha = ((rng() - 0.5) * 0.04) / 12;

            // Generate returns
            const specificVol = (0.08 + rng() * 0.15) * noiseScale / Math.sqrt(12);
            const returns = [];
            for (let t = 0; t < T; t++) {
                let r = rfPeriod + trueAlpha;
                factorNames.forEach(fn => {
                    r += trueExposures[fn] * factorSeries[fn][t];
                });
                r += specificVol * FU.normalRandom(rng);
                returns.push(r);
            }

            stocks.push({
                name, beta, marketCap, industry, trueExposures, trueAlpha, returns
            });
        }

        // Run regression with active factors
        const activeFactors = getActiveFactors();
        const K = activeFactors.length;

        const regressionResults = stocks.map(stock => {
            const excessReturns = stock.returns.map(r => r - rfPeriod);
            const factorRetArrays = activeFactors.map(fn => factorSeries[fn]);
            const result = FU.factorExposure(excessReturns, factorRetArrays);

            // Compute additional stats
            const T_ = excessReturns.length;
            const predicted = [];
            for (let t = 0; t < T_; t++) {
                let pred = result.alpha;
                for (let k = 0; k < K; k++) {
                    pred += result.betas[k] * factorRetArrays[k][t];
                }
                predicted.push(pred + rfPeriod);
            }

            const residuals = excessReturns.map((r, t) => r - (result.alpha + activeFactors.reduce((s, fn, k) => s + result.betas[k] * factorRetArrays[k][t], 0)));
            const ssRes = residuals.reduce((s, r) => s + r*r, 0);
            const my = FU.mean(excessReturns);
            const ssTot = excessReturns.reduce((s, r) => s + (r - my)*(r - my), 0);
            const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
            const adjR2 = 1 - (1 - r2) * (T_ - 1) / (T_ - K - 1);

            // Standard errors and t-stats
            const mse = ssRes / (T_ - K - 1);
            const se_alpha = Math.sqrt(mse / T_);
            const tStat_alpha = se_alpha === 0 ? 0 : result.alpha / se_alpha;

            const betaStats = result.betas.map((b, k) => {
                const xk = factorRetArrays[k];
                const mx = FU.mean(xk);
                const ssx = xk.reduce((s, v) => s + (v - mx)*(v - mx), 0);
                const se = ssx === 0 ? 0 : Math.sqrt(mse / ssx);
                const t = se === 0 ? 0 : b / se;
                const df = T_ - K - 1;
                const p = tToP(Math.abs(t), df);
                return { beta: b, se, tStat: t, pValue: p };
            });

            // Annualized actual vs predicted
            const annActual = FU.mean(stock.returns) * 12;
            const annPredicted = FU.mean(predicted) * 12;

            return {
                stock,
                alpha: result.alpha,
                betas: result.betas,
                r2, adjR2,
                alphaT: tStat_alpha,
                alphaSE: se_alpha,
                betaStats,
                predicted,
                residuals,
                annActual,
                annPredicted,
            };
        });

        // Aggregate stats
        const avgR2 = FU.mean(regressionResults.map(r => r.r2));
        const avgAdjR2 = FU.mean(regressionResults.map(r => r.adjR2));

        // Cross-sectional regression: predicted vs actual annual returns
        const xs_actual = regressionResults.map(r => r.annActual);
        const xs_predicted = regressionResults.map(r => r.annPredicted);
        const xsReg = FU.linearRegression(xs_predicted, xs_actual);

        // Average factor stats
        const avgBetaStats = activeFactors.map((fn, k) => {
            const betas = regressionResults.map(r => r.betaStats[k].beta);
            const tStats = regressionResults.map(r => r.betaStats[k].tStat);
            const pVals = regressionResults.map(r => r.betaStats[k].pValue);
            return {
                factor: fn,
                avgBeta: FU.mean(betas),
                avgTStat: FU.mean(tStats),
                avgPValue: FU.mean(pVals),
                medianBeta: median(betas),
            };
        });

        // Factor contributions (variance decomposition, approximate)
        const factorContributions = activeFactors.map((fn, k) => {
            const avgBeta = FU.mean(regressionResults.map(r => r.betas[k]));
            const fVar = FU.variance(factorSeries[fn]);
            return { factor: fn, contrib: Math.abs(avgBeta) * Math.sqrt(fVar) };
        });
        const totalContrib = factorContributions.reduce((s, c) => s + c.contrib, 0);
        factorContributions.forEach(c => { c.pct = totalContrib === 0 ? 0 : c.contrib / totalContrib; });

        // All alphas
        const allAlphas = regressionResults.map(r => r.alpha * 12); // annualized

        // All residuals pooled (subsample)
        const pooledResiduals = [];
        regressionResults.forEach(r => {
            const step = Math.max(1, Math.floor(r.residuals.length / 20));
            for (let i = 0; i < r.residuals.length; i += step) {
                pooledResiduals.push(r.residuals[i]);
            }
        });

        simData = {
            stocks, factorSeries, activeFactors, regressionResults,
            avgR2, avgAdjR2, xsReg, avgBetaStats, factorContributions,
            allAlphas, pooledResiduals, rfPeriod, xs_actual, xs_predicted,
        };

        updateResults();
        drawCurrentView();
    }

    // =========================================================================
    //  Approximate t-distribution p-value (two-tailed)
    // =========================================================================
    function tToP(t, df) {
        // Approximation using normal for df > 30
        if (df > 30) {
            const z = t;
            return 2 * (1 - normalCDF(z));
        }
        // Very rough approximation for small df
        const x = df / (df + t * t);
        return betaInc(df / 2, 0.5, x);
    }

    function normalCDF(z) {
        const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741;
        const a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
        const sign = z < 0 ? -1 : 1;
        z = Math.abs(z) / Math.sqrt(2);
        const t = 1 / (1 + p * z);
        const y = 1 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-z*z);
        return 0.5 * (1 + sign * y);
    }

    function betaInc(a, b, x) {
        // Very rough regularized incomplete beta via continued fraction
        if (x < 0 || x > 1) return 0;
        if (x === 0) return 0;
        if (x === 1) return 1;
        // Use simple approximation
        const lnBeta = lgamma(a) + lgamma(b) - lgamma(a + b);
        const prefix = Math.exp(a * Math.log(x) + b * Math.log(1 - x) - lnBeta) / a;
        // Series expansion
        let sum = 1, term = 1;
        for (let n = 1; n < 200; n++) {
            term *= x * (n - b) / (n * (a + n));
            if (n > 0) term = x * (a + n - 1) * (1) / ((a + n)) * (n < b ? (b - n) / n : 1);
            // Simplified: just return rough estimate
            break;
        }
        return Math.min(1, Math.max(0, prefix * 15)); // rough
    }

    function lgamma(x) {
        const c = [76.18009172947146,-86.50532032941677,24.01409824083091,
            -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
        let y = x, tmp = x + 5.5;
        tmp -= (x + 0.5) * Math.log(tmp);
        let ser = 1.000000000190015;
        for (let j = 0; j < 6; j++) ser += c[j] / (++y);
        return -tmp + Math.log(2.5066282746310005 * ser / x);
    }

    function median(arr) {
        const sorted = [...arr].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    // =========================================================================
    //  Update Results Panel
    // =========================================================================
    function updateResults() {
        if (!simData) return;
        const { activeFactors, avgR2, avgAdjR2, avgBetaStats, factorContributions, allAlphas, pooledResiduals } = simData;
        const modelNames = { capm: 'CAPM', ff3: 'FF3', ff5: 'FF5', custom: '自定义' };

        $('#sumModel').textContent = modelNames[state.model] || state.model;
        $('#sumFactors').textContent = activeFactors.length;
        $('#sumR2').textContent = avgR2.toFixed(3);
        $('#sumAdjR2').textContent = avgAdjR2.toFixed(3);

        // Factor stats table
        const tbody = $('#factorStatsBody');
        tbody.innerHTML = '';
        avgBetaStats.forEach(fs => {
            const fd = FACTOR_DEFS.find(f => f.key === fs.factor);
            const label = fd ? fd.label : fs.factor;
            const sig = fs.avgPValue < 0.01 ? '***' : fs.avgPValue < 0.05 ? '**' : fs.avgPValue < 0.1 ? '*' : '';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:${fd ? fd.color : '#ccc'}">${label}</td>
                <td>${fs.avgBeta.toFixed(3)}</td>
                <td>${fs.avgTStat.toFixed(2)}</td>
                <td>${fs.avgPValue < 0.001 ? '<0.001' : fs.avgPValue.toFixed(3)}</td>
                <td class="sig-star">${sig}</td>
            `;
            tbody.appendChild(tr);
        });

        // Draw mini charts
        drawPieChart();
        drawAlphaHistogram();
        drawResidualChart();
    }

    // =========================================================================
    //  Drawing: Current View
    // =========================================================================
    function drawCurrentView() {
        if (!simData) return;
        const { currentView } = state;

        // Hide/show compare overlay
        const overlay = $('#compareOverlay');
        const mainWrap = mainCanvas;
        if (currentView === 'compare') {
            overlay.classList.add('active');
            mainWrap.style.display = 'none';
            drawCompareView();
        } else {
            overlay.classList.remove('active');
            mainWrap.style.display = 'block';
            resizeCanvas(mainCanvas);
            switch (currentView) {
                case 'scatter': drawScatterPlot(); break;
                case 'sml': drawSMLView(); break;
                case 'heatmap': drawHeatmap(); break;
                case 'cumret': drawCumulativeReturns(); break;
            }
        }

        updateColorLegend();
    }

    function resizeCanvas(canvas) {
        const wrap = canvas.parentElement;
        const rect = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { w: rect.width, h: rect.height, ctx };
    }

    // =========================================================================
    //  Scatter Plot: Predicted vs Actual Returns
    // =========================================================================
    function drawScatterPlot() {
        const { w, h, ctx } = resizeCanvas(mainCanvas);
        ctx.clearRect(0, 0, w, h);

        const { regressionResults, xsReg, xs_actual, xs_predicted } = simData;
        const pad = { top: 40, right: 30, bottom: 50, left: 60 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        const allVals = [...xs_actual, ...xs_predicted];
        let minV = Math.min(...allVals);
        let maxV = Math.max(...allVals);
        const range = maxV - minV || 0.1;
        minV -= range * 0.08;
        maxV += range * 0.08;

        const scaleX = v => pad.left + (v - minV) / (maxV - minV) * pw;
        const scaleY = v => pad.top + ph - (v - minV) / (maxV - minV) * ph;

        // Grid
        ctx.strokeStyle = 'rgba(42,42,74,0.4)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 5; i++) {
            const v = minV + (maxV - minV) * i / 5;
            const x = scaleX(v);
            const y = scaleY(v);
            ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + ph); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
        }

        // 45-degree line
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(scaleX(minV), scaleY(minV));
        ctx.lineTo(scaleX(maxV), scaleY(maxV));
        ctx.stroke();
        ctx.setLineDash([]);

        // Regression line
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const rl_y1 = xsReg.alpha + xsReg.beta * minV;
        const rl_y2 = xsReg.alpha + xsReg.beta * maxV;
        ctx.moveTo(scaleX(minV), scaleY(rl_y1));
        ctx.lineTo(scaleX(maxV), scaleY(rl_y2));
        ctx.stroke();

        // Points
        regressionResults.forEach((rr, i) => {
            const x = scaleX(rr.annPredicted);
            const y = scaleY(rr.annActual);
            const color = getStockColor(rr.stock, i);
            ctx.beginPath();
            ctx.arc(x, y, selectedStockIdx === i ? 7 : 4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.globalAlpha = selectedStockIdx === i ? 1 : 0.7;
            ctx.fill();
            if (selectedStockIdx === i) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        });

        // R-squared label
        ctx.fillStyle = '#66bb6a';
        ctx.font = 'bold 13px var(--font-mono)';
        ctx.textAlign = 'right';
        ctx.fillText('R\u00B2 = ' + xsReg.r2.toFixed(4), w - pad.right - 5, pad.top + 20);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '11px var(--font-mono)';
        ctx.fillText('\u03B1=' + (xsReg.alpha*100).toFixed(2) + '%  \u03B2=' + xsReg.beta.toFixed(3), w - pad.right - 5, pad.top + 38);

        // Axes
        drawAxisLabels(ctx, pad, pw, ph, minV, maxV, '模型预测年化收益', '实际年化收益', v => (v*100).toFixed(1)+'%');

        // Title
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('因子模型预测收益 vs 实际收益', w/2, pad.top - 12);
    }

    // =========================================================================
    //  SML View
    // =========================================================================
    function drawSMLView() {
        const { w, h, ctx } = resizeCanvas(mainCanvas);
        ctx.clearRect(0, 0, w, h);

        const { regressionResults } = simData;
        const pad = { top: 40, right: 30, bottom: 50, left: 60 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        const betas = regressionResults.map(r => r.betas[0]); // market beta
        const rets = regressionResults.map(r => r.annActual);

        let minB = Math.min(...betas) - 0.1;
        let maxB = Math.max(...betas) + 0.1;
        let minR = Math.min(...rets);
        let maxR = Math.max(...rets);
        const rangeR = maxR - minR || 0.1;
        minR -= rangeR * 0.1;
        maxR += rangeR * 0.1;

        const scaleX = v => pad.left + (v - minB) / (maxB - minB) * pw;
        const scaleY = v => pad.top + ph - (v - minR) / (maxR - minR) * ph;

        // Grid
        ctx.strokeStyle = 'rgba(42,42,74,0.4)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 5; i++) {
            const bv = minB + (maxB - minB) * i / 5;
            const rv = minR + (maxR - minR) * i / 5;
            ctx.beginPath(); ctx.moveTo(scaleX(bv), pad.top); ctx.lineTo(scaleX(bv), pad.top + ph); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pad.left, scaleY(rv)); ctx.lineTo(pad.left + pw, scaleY(rv)); ctx.stroke();
        }

        // SML line: E(r) = rf + beta * market_premium
        const rf = state.rf / 100;
        const mp = state.mp / 100;
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(scaleX(0), scaleY(rf));
        ctx.lineTo(scaleX(maxB), scaleY(rf + maxB * mp));
        ctx.stroke();

        // Points
        regressionResults.forEach((rr, i) => {
            const x = scaleX(betas[i]);
            const y = scaleY(rets[i]);
            const color = getStockColor(rr.stock, i);
            ctx.beginPath();
            ctx.arc(x, y, selectedStockIdx === i ? 7 : 4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.globalAlpha = selectedStockIdx === i ? 1 : 0.7;
            ctx.fill();
            if (selectedStockIdx === i) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        });

        // Label
        ctx.fillStyle = '#66bb6a';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('SML: E(r) = Rf + \u03B2 \u00D7 MRP', w - pad.right - 5, pad.top + 18);

        drawAxisLabels(ctx, pad, pw, ph, minB, maxB, 'Beta (\u03B2)', '年化收益率', v => v.toFixed(2), v => (v*100).toFixed(1)+'%', minR, maxR);

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('证券市场线 (SML)', w/2, pad.top - 12);
    }

    // =========================================================================
    //  Heatmap
    // =========================================================================
    function drawHeatmap() {
        const { w, h, ctx } = resizeCanvas(mainCanvas);
        ctx.clearRect(0, 0, w, h);

        const { regressionResults, activeFactors } = simData;
        const pad = { top: 50, right: 20, bottom: 30, left: 70 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        const nStocks = regressionResults.length;
        const nFactors = activeFactors.length;
        const cellW = pw / nFactors;
        const cellH = Math.min(ph / nStocks, 12);
        const actualH = cellH * nStocks;

        // Find max absolute beta for color scaling
        let maxAbs = 0;
        regressionResults.forEach(rr => {
            rr.betas.forEach(b => { if (Math.abs(b) > maxAbs) maxAbs = Math.abs(b); });
        });
        if (maxAbs === 0) maxAbs = 1;

        // Sort stocks by first factor beta
        const sorted = regressionResults.map((r, i) => ({ r, i }))
            .sort((a, b) => b.r.betas[0] - a.r.betas[0]);

        // Draw cells
        sorted.forEach((item, row) => {
            const rr = item.r;
            activeFactors.forEach((fn, col) => {
                const val = rr.betas[col];
                const x = pad.left + col * cellW;
                const y = pad.top + row * cellH;
                ctx.fillStyle = FU.valueToColor(val, -maxAbs, maxAbs);
                ctx.fillRect(x, y, cellW - 1, cellH - 1);
            });

            // Stock label (only every few)
            if (row % Math.max(1, Math.floor(nStocks / 15)) === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = '9px var(--font-mono)';
                ctx.textAlign = 'right';
                ctx.fillText(rr.stock.name, pad.left - 4, pad.top + row * cellH + cellH * 0.8);
            }
        });

        // Factor labels on top
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        activeFactors.forEach((fn, col) => {
            const fd = FACTOR_DEFS.find(f => f.key === fn);
            ctx.fillStyle = fd ? fd.color : '#ccc';
            ctx.fillText(fd ? fd.label : fn, pad.left + col * cellW + cellW / 2, pad.top - 8);
        });

        // Color scale bar
        const barW = 120, barH = 10;
        const barX = w - pad.right - barW - 10;
        const barY = pad.top - 15;
        for (let i = 0; i < barW; i++) {
            const v = -maxAbs + (2 * maxAbs) * i / barW;
            ctx.fillStyle = FU.valueToColor(v, -maxAbs, maxAbs);
            ctx.fillRect(barX + i, barY, 1, barH);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '9px var(--font-mono)';
        ctx.textAlign = 'left';
        ctx.fillText((-maxAbs).toFixed(2), barX, barY + barH + 10);
        ctx.textAlign = 'right';
        ctx.fillText(maxAbs.toFixed(2), barX + barW, barY + barH + 10);
        ctx.textAlign = 'center';
        ctx.fillText('0', barX + barW/2, barY + barH + 10);

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('因子暴露热力图 (按市场Beta排序)', w/2, pad.top - 30);
    }

    // =========================================================================
    //  Cumulative Returns
    // =========================================================================
    function drawCumulativeReturns() {
        const { w, h, ctx } = resizeCanvas(mainCanvas);
        ctx.clearRect(0, 0, w, h);

        const { regressionResults, factorSeries } = simData;
        const pad = { top: 40, right: 30, bottom: 50, left: 60 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        // Compute cumulative for market and a few stocks
        const T = regressionResults[0].stock.returns.length;
        const marketCum = FU.cumulativeReturns(factorSeries.market);

        // Select representative stocks
        const indices = [];
        const step = Math.max(1, Math.floor(regressionResults.length / 8));
        for (let i = 0; i < regressionResults.length && indices.length < 8; i += step) {
            indices.push(i);
        }
        if (selectedStockIdx >= 0 && !indices.includes(selectedStockIdx)) {
            indices.push(selectedStockIdx);
        }

        const allCums = indices.map(i => ({
            cum: FU.cumulativeReturns(regressionResults[i].stock.returns),
            stock: regressionResults[i].stock,
            idx: i,
        }));

        // Find min/max
        let minV = Infinity, maxV = -Infinity;
        [marketCum, ...allCums.map(c => c.cum)].forEach(cum => {
            cum.forEach(v => {
                if (v < minV) minV = v;
                if (v > maxV) maxV = v;
            });
        });
        const rangeV = maxV - minV || 0.1;
        minV -= rangeV * 0.05;
        maxV += rangeV * 0.05;

        const scaleX = t => pad.left + (t / T) * pw;
        const scaleY = v => pad.top + ph - (v - minV) / (maxV - minV) * ph;

        // Grid
        ctx.strokeStyle = 'rgba(42,42,74,0.4)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 5; i++) {
            const v = minV + (maxV - minV) * i / 5;
            ctx.beginPath(); ctx.moveTo(pad.left, scaleY(v)); ctx.lineTo(pad.left + pw, scaleY(v)); ctx.stroke();
        }

        // Draw stock lines
        allCums.forEach((c, ci) => {
            const color = getStockColor(c.stock, c.idx);
            ctx.strokeStyle = color;
            ctx.lineWidth = c.idx === selectedStockIdx ? 2.5 : 1;
            ctx.globalAlpha = c.idx === selectedStockIdx ? 1 : 0.4;
            ctx.beginPath();
            c.cum.forEach((v, t) => {
                const x = scaleX(t);
                const y = scaleY(v);
                t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.globalAlpha = 1;
        });

        // Market line
        ctx.strokeStyle = '#66bb6a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        marketCum.forEach((v, t) => {
            const x = scaleX(t);
            const y = scaleY(v);
            t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Legend
        ctx.fillStyle = '#66bb6a';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('\u2014 市场', pad.left + 10, pad.top + 15);

        drawAxisLabels(ctx, pad, pw, ph, 0, T, '月份', '累计净值', v => Math.round(v).toString(), v => v.toFixed(2), minV, maxV);

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('累计收益曲线', w/2, pad.top - 12);
    }

    // =========================================================================
    //  Compare View
    // =========================================================================
    function drawCompareView() {
        // Model A: current selection; Model B: CAPM (or ff3 if current is capm)
        const modelA = state.model;
        const modelB = modelA === 'capm' ? 'ff3' : 'capm';
        const factorsA = simData.activeFactors;
        const factorsB = MODEL_PRESETS[modelB];

        $('#compareLabel1').textContent = (modelA === 'custom' ? '自定义' : modelA.toUpperCase()) + ' (' + factorsA.length + '因子)';
        $('#compareLabel2').textContent = modelB.toUpperCase() + ' (' + factorsB.length + '因子)';

        // Re-run regression for model B
        const regB = simData.stocks.map(stock => {
            const excessReturns = stock.returns.map(r => r - simData.rfPeriod);
            const factorRetArrays = factorsB.map(fn => simData.factorSeries[fn]);
            const result = FU.factorExposure(excessReturns, factorRetArrays);
            const annActual = FU.mean(stock.returns) * 12;
            const T = excessReturns.length;
            let annPredicted = 0;
            const predicted = [];
            for (let t = 0; t < T; t++) {
                let pred = result.alpha;
                for (let k = 0; k < factorsB.length; k++) pred += result.betas[k] * factorRetArrays[k][t];
                predicted.push(pred + simData.rfPeriod);
            }
            annPredicted = FU.mean(predicted) * 12;
            return { annActual, annPredicted, r2: result.r2 };
        });

        const actualA = simData.regressionResults.map(r => r.annActual);
        const predA = simData.regressionResults.map(r => r.annPredicted);
        const regLineA = FU.linearRegression(predA, actualA);

        const actualB = regB.map(r => r.annActual);
        const predB = regB.map(r => r.annPredicted);
        const regLineB = FU.linearRegression(predB, actualB);

        drawCompareScatter($('#compareCanvas1'), predA, actualA, regLineA, simData.regressionResults);
        drawCompareScatter($('#compareCanvas2'), predB, actualB, regLineB, regB.map((r, i) => ({ ...r, stock: simData.stocks[i] })));
    }

    function drawCompareScatter(canvas, xArr, yArr, regLine, results) {
        const wrap = canvas.parentElement;
        const rect = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const w = rect.width, h = rect.height;

        ctx.clearRect(0, 0, w, h);
        const pad = { top: 30, right: 15, bottom: 35, left: 45 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        const allVals = [...xArr, ...yArr];
        let minV = Math.min(...allVals);
        let maxV = Math.max(...allVals);
        const range = maxV - minV || 0.1;
        minV -= range * 0.08;
        maxV += range * 0.08;

        const scaleX = v => pad.left + (v - minV) / (maxV - minV) * pw;
        const scaleY = v => pad.top + ph - (v - minV) / (maxV - minV) * ph;

        // 45-deg line
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.moveTo(scaleX(minV), scaleY(minV));
        ctx.lineTo(scaleX(maxV), scaleY(maxV));
        ctx.stroke();
        ctx.setLineDash([]);

        // Regression line
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(scaleX(minV), scaleY(regLine.alpha + regLine.beta * minV));
        ctx.lineTo(scaleX(maxV), scaleY(regLine.alpha + regLine.beta * maxV));
        ctx.stroke();

        // Points
        xArr.forEach((xv, i) => {
            ctx.beginPath();
            ctx.arc(scaleX(xv), scaleY(yArr[i]), 3, 0, Math.PI * 2);
            ctx.fillStyle = results[i] && results[i].stock ? getStockColor(results[i].stock, i) : '#6366f1';
            ctx.globalAlpha = 0.6;
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // R2
        ctx.fillStyle = '#66bb6a';
        ctx.font = 'bold 12px var(--font-mono)';
        ctx.textAlign = 'right';
        ctx.fillText('R\u00B2=' + regLine.r2.toFixed(4), w - pad.right - 5, pad.top + 15);
    }

    // =========================================================================
    //  Mini Charts: Pie, Alpha Histogram, Residuals
    // =========================================================================
    function drawPieChart() {
        const canvas = $('#pieCanvas');
        const { w, h, ctx } = resizeCanvas(canvas);
        ctx.clearRect(0, 0, w, h);

        if (!simData) return;
        const { factorContributions, activeFactors } = simData;
        const cx = w * 0.38, cy = h / 2, radius = Math.min(w * 0.3, h * 0.4);

        let startAngle = -Math.PI / 2;
        factorContributions.forEach((fc, i) => {
            const angle = fc.pct * Math.PI * 2;
            const fd = FACTOR_DEFS.find(f => f.key === fc.factor);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, startAngle + angle);
            ctx.closePath();

            // Label
            if (fc.pct > 0.05) {

                ctx.fillStyle = 'rgba(255,255,255,0.7)';

                ctx.textAlign = midAngle > Math.PI / 2 && midAngle < Math.PI * 1.5 ? 'right' : 'left';
                ctx.fillText((fd ? fd.label : fc.factor) + ' ' + (fc.pct * 100).toFixed(0) + '%', lx, ly);

    function drawAlphaHistogram() {
        const canvas = $('#alphaCanvas');
        const { w, h, ctx } = resizeCanvas(canvas);
        ctx.clearRect(0, 0, w, h);

        if (!simData) return;
        const { allAlphas } = simData;
        const pad = { top: 15, right: 10, bottom: 25, left: 35 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        // Histogram bins
        const nBins = 20;
        let minA = Math.min(...allAlphas);
        let maxA = Math.max(...allAlphas);
        if (minA === maxA) { minA -= 0.01; maxA += 0.01; }
        const binWidth = (maxA - minA) / nBins;
        const bins = new Array(nBins).fill(0);
        allAlphas.forEach(a => {
            const idx = Math.min(nBins - 1, Math.floor((a - minA) / binWidth));
            bins[idx]++;
        });
        const maxBin = Math.max(...bins);

        const barW = pw / nBins;
        bins.forEach((count, i) => {
            const barH = maxBin === 0 ? 0 : (count / maxBin) * ph;
            const x = pad.left + i * barW;
            const y = pad.top + ph - barH;
            ctx.fillStyle = minA + (i + 0.5) * binWidth > 0 ? 'rgba(46,125,50,0.6)' : 'rgba(239,68,68,0.5)';
            ctx.fillRect(x, y, barW - 1, barH);
        });

        // Zero line
        const zeroX = pad.left + (0 - minA) / (maxA - minA) * pw;
        if (zeroX > pad.left && zeroX < pad.left + pw) {
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3,3]);
            ctx.beginPath();
            ctx.moveTo(zeroX, pad.top);
            ctx.lineTo(zeroX, pad.top + ph);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Labels
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '9px var(--font-mono)';
        ctx.textAlign = 'left';
        ctx.fillText((minA*100).toFixed(1) + '%', pad.left, pad.top + ph + 14);
        ctx.textAlign = 'right';
        ctx.fillText((maxA*100).toFixed(1) + '%', pad.left + pw, pad.top + ph + 14);
        ctx.textAlign = 'center';
        ctx.fillText('Alpha (年化)', w / 2, pad.top + ph + 14);
    }

    function drawResidualChart() {
        const canvas = $('#residCanvas');
        const { w, h, ctx } = resizeCanvas(canvas);
        ctx.clearRect(0, 0, w, h);

        if (!simData) return;
        const { pooledResiduals } = simData;
        const pad = { top: 15, right: 10, bottom: 25, left: 35 };
        const pw = w - pad.left - pad.right;
        const ph = h - pad.top - pad.bottom;

        // Histogram of residuals
        const nBins = 25;
        const sorted = [...pooledResiduals].sort((a, b) => a - b);
        let minR = sorted[Math.floor(sorted.length * 0.02)];
        let maxR = sorted[Math.floor(sorted.length * 0.98)];
        if (minR === maxR) { minR -= 0.01; maxR += 0.01; }
        const binWidth = (maxR - minR) / nBins;
        const bins = new Array(nBins).fill(0);
        pooledResiduals.forEach(r => {
            if (r < minR || r > maxR) return;
            const idx = Math.min(nBins - 1, Math.floor((r - minR) / binWidth));
            bins[idx]++;
        });
        const maxBin = Math.max(...bins);

        const barW = pw / nBins;
        bins.forEach((count, i) => {
            const barH = maxBin === 0 ? 0 : (count / maxBin) * ph;
            const x = pad.left + i * barW;
            const y = pad.top + ph - barH;
            ctx.fillStyle = 'rgba(99,102,241,0.5)';
            ctx.fillRect(x, y, barW - 1, barH);
        });

        // Normal curve overlay
        const mu = FU.mean(pooledResiduals);
        const sigma = FU.std(pooledResiduals);
        if (sigma > 0) {
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i <= pw; i++) {
                const v = minR + (maxR - minR) * i / pw;
                const density = Math.exp(-0.5 * ((v - mu) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI));
                const maxDensity = 1 / (sigma * Math.sqrt(2 * Math.PI));
                const y = pad.top + ph - (density / maxDensity) * ph * 0.95;
                i === 0 ? ctx.moveTo(pad.left + i, y) : ctx.lineTo(pad.left + i, y);
            }
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('残差分布 (橙线=正态)', w / 2, pad.top + ph + 14);
    }

    // =========================================================================
    //  Helper: Draw axis labels
    // =========================================================================
    function drawAxisLabels(ctx, pad, pw, ph, xMin, xMax, xLabel, yLabel, xFmt, yFmt, yMin, yMax) {
        if (!yFmt) yFmt = xFmt;
        if (yMin === undefined) { yMin = xMin; yMax = xMax; }

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        // X axis
        ctx.beginPath();
        ctx.moveTo(pad.left, pad.top + ph);
        ctx.lineTo(pad.left + pw, pad.top + ph);
        ctx.stroke();
        // Y axis
        ctx.beginPath();
        ctx.moveTo(pad.left, pad.top);
        ctx.lineTo(pad.left, pad.top + ph);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '10px var(--font-mono)';

        // X ticks
        ctx.textAlign = 'center';
        for (let i = 0; i <= 5; i++) {
            const v = xMin + (xMax - xMin) * i / 5;
            const x = pad.left + (i / 5) * pw;
            ctx.fillText(xFmt(v), x, pad.top + ph + 16);
        }

        // Y ticks
        ctx.textAlign = 'right';
        for (let i = 0; i <= 5; i++) {
            const v = yMin + (yMax - yMin) * i / 5;
            const y = pad.top + ph - (i / 5) * ph;
            ctx.fillText(yFmt(v), pad.left - 6, y + 3);
        }

        ctx.fillText(xLabel, pad.left + pw / 2, pad.top + ph + 38);

        ctx.save();
        ctx.translate(14, pad.top + ph / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(yLabel, 0, 0);
        ctx.restore();
    }

    // =========================================================================
    //  Color Logic
    // =========================================================================
    function getStockColor(stock, idx) {
        const mode = state.colorBy;
        if (mode === 'industry') {
            return INDUSTRY_COLORS[stock.industry % INDUSTRY_COLORS.length];
        }
        if (mode === 'size') {
            const logCap = Math.log(stock.marketCap);
            const t = Math.min(1, Math.max(0, (logCap - 4) / 4));
            // Small=amber, Large=blue
            const r = Math.round(245 * (1 - t) + 99 * t);
            const g = Math.round(158 * (1 - t) + 102 * t);
            const b = Math.round(11 * (1 - t) + 241 * t);
            return `rgb(${r},${g},${b})`;
        }
        // Default: by beta
        const t = Math.min(1, Math.max(0, (stock.beta - 0.3) / 1.5));
        const r = Math.round(79 * (1 - t) + 239 * t);
        const g = Math.round(195 * (1 - t) + 68 * t);
        const b = Math.round(247 * (1 - t) + 68 * t);
        return `rgb(${r},${g},${b})`;
    }

                <span class="color-legend-item"><span class="cl-dot" style="background:#8b7acc"></span>中市值</span>
                <span class="color-legend-item"><span class="cl-dot" style="background:#6366f1"></span>大市值</span>
            `;

                <span class="color-legend-item"><span class="cl-dot" style="background:#4fc3f7"></span>低Beta</span>
                <span class="color-legend-item"><span class="cl-dot" style="background:#c87044"></span>中Beta</span>
                <span class="color-legend-item"><span class="cl-dot" style="background:#ef4444"></span>高Beta</span>
