<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVM 游乐场 — SVM Playground</title>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
    <style>
        /* ========== Playground Layout ========== */
        .playground-container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 1rem;
            padding-top: 1rem;
            min-height: calc(100vh - var(--header-height) - 3rem);
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            overflow-y: auto;
            max-height: calc(100vh - var(--header-height) - 4rem);
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ========== Left Panel Controls ========== */
        .control-section {
            margin-bottom: 1.2rem;
        }

        .control-section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }

        .control-row label {
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-row label .val {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-green);
            min-width: 3rem;
            text-align: right;
        }

        .control-row select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .control-row select:focus {
            border-color: var(--accent-green);
        }

        .control-row select option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .control-row input[type="range"] {
            width: 100%;
        }

        /* ========== Center Panel ========== */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: transparent;
            border: none;
            padding: 0;
            overflow: visible;
            max-height: none;
        }

        .canvas-wrapper {
            position: relative;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            max-height: calc(100vh - var(--header-height) - 12rem);
            cursor: crosshair;
        }

        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .canvas-legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.5rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .canvas-legend .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.3rem;
            vertical-align: middle;
        }

        .canvas-legend .legend-ring {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.3rem;
            vertical-align: middle;
            border: 2px solid #fff;
            background: transparent;
        }

        .canvas-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .center-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ========== Right Panel Stats ========== */
        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .stat-card .stat-value {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .stat-value.good {
            color: var(--accent-green);
        }

        .stat-card .stat-value.warn {
            color: var(--accent-orange);
        }

        .stat-card .stat-value.bad {
            color: var(--accent-red);
        }

        .sv-ratio-bar {
            width: 100%;
            height: 24px;
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 0.5rem;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .sv-ratio-bar .sv-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
            min-width: fit-content;
            padding: 0 0.5rem;
        }

        .formula-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            overflow-x: auto;
        }

        .formula-box .formula-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .formula-box .katex {
            font-size: 0.95em;
        }

        /* ========== Preset Buttons ========== */
        .preset-btn {
            padding: 0.35rem 0.7rem;
            font-size: 0.78rem;
        }

        .preset-btn.active {
            background: rgba(22, 199, 154, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* ========== Status Banner ========== */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .status-bar.idle {
            background: rgba(108, 108, 124, 0.15);
            color: var(--text-muted);
        }

        .status-bar.training {
            background: rgba(79, 195, 247, 0.15);
            color: var(--accent-blue);
        }

        .status-bar.done {
            background: rgba(22, 199, 154, 0.15);
            color: var(--accent-green);
        }

        .status-bar.error {
            background: rgba(255, 82, 82, 0.15);
            color: var(--accent-red);
        }

        /* ========== Canvas Tooltip ========== */
        .canvas-tooltip {
            position: absolute;
            pointer-events: none;
            padding: 0.35rem 0.6rem;
            background: rgba(15, 52, 96, 0.92);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-primary);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 20;
        }

        .canvas-tooltip.visible {
            opacity: 1;
        }

        .canvas-tooltip .tt-coord {
            color: var(--text-secondary);
        }

        .canvas-tooltip .tt-val {
            color: var(--accent-yellow);
        }

        .canvas-tooltip .tt-class {
            font-weight: 700;
        }

        .canvas-tooltip .tt-class.pos { color: #22c55e; }
        .canvas-tooltip .tt-class.neg { color: #ef4444; }

        .spinner-inline {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        /* ========== Kernel params visibility ========== */
        .kernel-param {
            display: none;
        }

        .kernel-param.visible {
            display: flex;
        }

        /* ========== Responsive ========== */
        @media (max-width: 1200px) {
            .playground-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .panel {
                max-height: none;
            }
            .canvas-wrapper {
                max-height: 500px;
                aspect-ratio: auto;
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container" style="max-width:1600px;">
        <h1 style="text-align:center; margin-bottom:0.25rem;">SVM 游乐场</h1>
        <p style="text-align:center; margin-bottom:1rem; font-size:0.9rem;">
            调整参数，选择数据集与核函数，直观感受 SVM 的决策边界
        </p>

        <div class="playground-container">
            <!-- ========== LEFT PANEL ========== -->
            <div class="panel" id="leftPanel">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                    数据与参数
                </div>

                <!-- Dataset -->
                <div class="control-section">
                    <div class="control-section-title">数据集</div>
                    <div class="control-row">
                        <select id="datasetSelect">
                            <option value="linear">Linear (线性可分)</option>
                            <option value="circle">Circle (环形)</option>
                            <option value="xor">XOR (异或)</option>
                            <option value="moons" selected>Moons (双月)</option>
                            <option value="spiral">Spiral (螺旋)</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label>噪声 <span class="val" id="noiseVal">0.15</span></label>
                        <input type="range" id="noiseSlider" min="0" max="0.5" step="0.01" value="0.15">
                    </div>
                    <div class="control-row">
                        <label>样本数量 <span class="val" id="sampleVal">100</span></label>
                        <input type="range" id="sampleSlider" min="50" max="200" step="10" value="100">
                    </div>
                    <button class="btn btn-sm" id="regenerateBtn" style="width:100%;">重新生成数据</button>
                </div>

                <!-- Kernel -->
                <div class="control-section">
                    <div class="control-section-title">核函数</div>
                    <div class="control-row">
                        <select id="kernelSelect">
                            <option value="linear">Linear (线性)</option>
                            <option value="poly">Polynomial (多项式)</option>
                            <option value="rbf" selected>RBF (高斯)</option>
                            <option value="sigmoid">Sigmoid</option>
                        </select>
                    </div>
                </div>

                <!-- Hyperparams -->
                <div class="control-section">
                    <div class="control-section-title">超参数</div>
                    <div class="control-row">
                        <label>C (正则化) <span class="val" id="cVal">1.00</span></label>
                        <input type="range" id="cSlider" min="-2" max="2" step="0.01" value="0">
                    </div>
                    <div class="control-row kernel-param" id="gammaRow">
                        <label>Gamma (RBF/Sigmoid) <span class="val" id="gammaVal">1.00</span></label>
                        <input type="range" id="gammaSlider" min="-2" max="1" step="0.01" value="0">
                    </div>
                    <div class="control-row kernel-param" id="degreeRow">
                        <label>Degree (多项式) <span class="val" id="degreeVal">3</span></label>
                        <input type="range" id="degreeSlider" min="2" max="5" step="1" value="3">
                    </div>
                </div>

                <!-- Presets -->
                <div class="control-section">
                    <div class="control-section-title">预设配置</div>
                    <div style="display:flex; flex-direction:column; gap:0.4rem;">
                        <button class="btn btn-sm preset-btn" data-preset="linearly-separable">线性可分</button>
                        <button class="btn btn-sm preset-btn" data-preset="need-kernel">需要核技巧</button>
                        <button class="btn btn-sm preset-btn" data-preset="noisy">噪声数据</button>
                    </div>
                </div>
            </div>

            <!-- ========== CENTER PANEL ========== -->
            <div class="center-panel" id="centerPanel">
                <div class="center-controls">
                    <button class="btn btn-primary" id="trainBtn">训练</button>
                    <button class="btn" id="clearCustomBtn">清除自定义点</button>
                </div>

                <div id="statusBar" class="status-bar idle">等待训练...</div>

                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="mainCanvas"></canvas>
                    <div class="canvas-tooltip" id="canvasTooltip"></div>
                </div>

                <div class="canvas-legend">
                    <span><span class="legend-dot" style="background:#22c55e;"></span> +1 类</span>
                    <span><span class="legend-dot" style="background:#ef4444;"></span> -1 类</span>
                    <span><span class="legend-ring" style="border-color:#fff;"></span> 支持向量</span>
                    <span style="color:var(--accent-yellow);">--- 决策边界</span>
                    <span style="color:var(--text-muted);">- - 间隔边界</span>
                </div>

                <div class="canvas-hint">左键点击画布添加 +1 类点，右键(或 Ctrl+左键)添加 -1 类点 | 快捷键: T=训练 R=重新生成 C=清除 1/2/3=预设</div>
            </div>

            <!-- ========== RIGHT PANEL ========== -->
            <div class="panel" id="rightPanel">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    结果与统计
                </div>

                <div class="stat-card">
                    <div class="stat-label">训练准确率</div>
                    <div class="stat-value" id="statAccuracy">--</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">支持向量 / 总样本</div>
                    <div class="stat-value" id="statSV">-- / --</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">间隔宽度 (仅线性核)</div>
                    <div class="stat-value" id="statMargin">--</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">支持向量比例</div>
                    <div class="sv-ratio-bar">
                        <div class="sv-fill" id="svRatioFill" style="width:0%;">0%</div>
                    </div>
                </div>

                <div class="formula-box">
                    <div class="formula-title">决策函数</div>
                    <div id="formulaDisplay" style="text-align:center; min-height:2rem;">
                        <span class="text-muted" style="font-size:0.85rem;">训练后显示</span>
                    </div>
                </div>

                <div class="formula-box">
                    <div class="formula-title">当前核函数</div>
                    <div id="kernelFormula" style="text-align:center; min-height:2rem;"></div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">训练耗时</div>
                    <div class="stat-value" id="statTime">--</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/scripts/nav.js"></script>
    <script src="../shared/scripts/svm-utils.js"></script>
    <script>
    /* ================================================================
       SVM Playground — Main Application
       ================================================================ */
    (() => {
        'use strict';

        /* ---------- DOM refs ---------- */
        const $ = id => document.getElementById(id);
        const canvas = $('mainCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = $('canvasWrapper');

        const datasetSel  = $('datasetSelect');
        const kernelSel   = $('kernelSelect');
        const noiseSl     = $('noiseSlider');
        const sampleSl    = $('sampleSlider');
        const cSl         = $('cSlider');
        const gammaSl     = $('gammaSlider');
        const degreeSl    = $('degreeSlider');

        const noiseValEl  = $('noiseVal');
        const sampleValEl = $('sampleVal');
        const cValEl      = $('cVal');
        const gammaValEl  = $('gammaVal');
        const degreeValEl = $('degreeVal');

        const gammaRow    = $('gammaRow');
        const degreeRow   = $('degreeRow');

        const trainBtn      = $('trainBtn');
        const regenerateBtn = $('regenerateBtn');
        const clearCustomBtn = $('clearCustomBtn');
        const statusBar     = $('statusBar');

        /* ---------- State ---------- */
        let data = [];
        let labels = [];
        let customData = [];
        let customLabels = [];
        let model = null;          // trained model result
        let modelType = null;      // 'linear' | 'kernel'
        let kernelFn = null;       // current kernel function
        let heatmapImageData = null;
        let seed = Date.now();

        /* ---------- Coordinate mapping ---------- */
        const VIEW = { xMin: -3, xMax: 3, yMin: -3, yMax: 3 };

        function dataToCanvas(px, py) {
            const cw = canvas.width, ch = canvas.height;
            const x = (px - VIEW.xMin) / (VIEW.xMax - VIEW.xMin) * cw;
            const y = (1 - (py - VIEW.yMin) / (VIEW.yMax - VIEW.yMin)) * ch;
            return [x, y];
        }

        function canvasToData(cx, cy) {
            const cw = canvas.width, ch = canvas.height;
            const px = cx / cw * (VIEW.xMax - VIEW.xMin) + VIEW.xMin;
            const py = (1 - cy / ch) * (VIEW.yMax - VIEW.yMin) + VIEW.yMin;
            return [px, py];
        }

        /* ---------- Resize canvas ---------- */
        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvas.width = size * window.devicePixelRatio;
            canvas.height = size * window.devicePixelRatio;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }

        /* ---------- Data generation ---------- */
        function generateData() {
            const dataset = datasetSel.value;
            const noise = parseFloat(noiseSl.value);
            const n = parseInt(sampleSl.value);
            seed = Date.now();

            let result;
            switch (dataset) {
                case 'linear':  result = SVMUtils.generateLinearData(n, noise, seed); break;
                case 'circle':  result = SVMUtils.generateCircleData(n, noise, seed); break;
                case 'xor':     result = SVMUtils.generateXORData(n, noise, seed); break;
                case 'moons':   result = SVMUtils.generateMoonsData(n, noise, seed); break;
                case 'spiral':  result = SVMUtils.generateSpiralData(n, seed); break;
                default:        result = SVMUtils.generateMoonsData(n, noise, seed);
            }

            data = result.data;
            labels = result.labels;
            model = null;
            heatmapImageData = null;
        }

        function getAllData() {
            return {
                data: data.concat(customData),
                labels: labels.concat(customLabels)
            };
        }

        /* ---------- Kernel builder ---------- */
        function buildKernelFn() {
            const type = kernelSel.value;
            const gamma = parseFloat(Math.pow(10, parseFloat(gammaSl.value)).toFixed(4));
            const degree = parseInt(degreeSl.value);

            switch (type) {
                case 'linear':
                    return SVMUtils.linearKernel;
                case 'poly':
                    return (x, y) => SVMUtils.polynomialKernel(x, y, degree, 1);
                case 'rbf':
                    return (x, y) => SVMUtils.rbfKernel(x, y, gamma);
                case 'sigmoid':
                    return (x, y) => SVMUtils.sigmoidKernel(x, y, gamma * 0.1, 0);
                default:
                    return SVMUtils.linearKernel;
            }
        }

        /* ---------- Training ---------- */
        function train() {
            const all = getAllData();
            if (all.data.length < 4) {
                setStatus('error', '至少需要 4 个数据点');
                return;
            }

            setStatus('training', '训练中...');
            const C = parseFloat(Math.pow(10, parseFloat(cSl.value)).toFixed(4));
            const ktype = kernelSel.value;

            const t0 = performance.now();

            if (ktype === 'linear') {
                modelType = 'linear';
                model = SVMUtils.trainLinearSVM(all.data, all.labels, C, 0.005, 2000);
                model._data = all.data;
                model._labels = all.labels;
            } else {
                modelType = 'kernel';
                kernelFn = buildKernelFn();
                model = SVMUtils.trainKernelSVM(all.data, all.labels, kernelFn, C, 0.001, 20);
                model._data = all.data;
                model._labels = all.labels;
                model._kernelFn = kernelFn;
            }

            const elapsed = performance.now() - t0;

            computeHeatmap();
            updateStats(all, elapsed);
            renderAll();
            setStatus('done', `训练完成 (${elapsed.toFixed(0)}ms)`);
        }

        /* ---------- Decision function value at point ---------- */
        function decisionValue(px, py) {
            const pt = [px, py];
            if (!model) return 0;
            if (modelType === 'linear') {
                return SVMUtils.decisionFunction(pt, model.w, model.b);
            } else {
                let s = 0;
                const d = model._data;
                const l = model._labels;
                const a = model.alphas;
                const kf = model._kernelFn;
                for (let i = 0; i < d.length; i++) {
                    if (a[i] > 1e-6) {
                        s += a[i] * l[i] * kf(d[i], pt);
                    }
                }
                return s + model.b;
            }
        }

        /* ---------- Heatmap computation ---------- */
        function computeHeatmap() {
            if (!model) return;
            const cw = canvas.width / window.devicePixelRatio;
            const ch = canvas.height / window.devicePixelRatio;
            const resolution = 3; // pixel step
            const cols = Math.ceil(cw / resolution);
            const rows = Math.ceil(ch / resolution);
            const values = new Float32Array(cols * rows);
            let vmin = Infinity, vmax = -Infinity;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const [px, py] = canvasToData(c * resolution + resolution / 2, r * resolution + resolution / 2);
                    const v = decisionValue(px, py);
                    values[r * cols + c] = v;
                    if (v < vmin) vmin = v;
                    if (v > vmax) vmax = v;
                }
            }

            // Store for rendering
            heatmapImageData = { values, cols, rows, resolution, vmin, vmax };
        }

        /* ---------- Rendering ---------- */
        function renderAll() {
            const cw = canvas.width / window.devicePixelRatio;
            const ch = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, cw, ch);

            // Background
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, cw, ch);

            // Grid
            drawGrid(cw, ch);

            // Heatmap
            if (heatmapImageData) {
                drawHeatmap(cw, ch);
            }

            // Decision boundary contours
            if (model) {
                drawContours(cw, ch);
            }

            // Data points
            drawDataPoints(cw, ch);
        }

        function drawGrid(cw, ch) {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 0.5;

            for (let x = Math.ceil(VIEW.xMin); x <= VIEW.xMax; x++) {
                const [cx] = dataToCanvas(x, 0);
                ctx.beginPath();
                ctx.moveTo(cx, 0);
                ctx.lineTo(cx, ch);
                ctx.stroke();
            }
            for (let y = Math.ceil(VIEW.yMin); y <= VIEW.yMax; y++) {
                const [, cy] = dataToCanvas(0, y);
                ctx.beginPath();
                ctx.moveTo(0, cy);
                ctx.lineTo(cw, cy);
                ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            const [ox, oy] = dataToCanvas(0, 0);
            ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, ch); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(cw, oy); ctx.stroke();

            // Axis tick labels
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let x = Math.ceil(VIEW.xMin); x <= VIEW.xMax; x++) {
                if (x === 0) continue;
                const [cx] = dataToCanvas(x, 0);
                ctx.fillText(x.toString(), cx, oy + 4);
            }
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let y = Math.ceil(VIEW.yMin); y <= VIEW.yMax; y++) {
                if (y === 0) continue;
                const [, cy] = dataToCanvas(0, y);
                ctx.fillText(y.toString(), ox - 5, cy);
            }

            // Axis name labels
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('x\u2081', cw - 14, oy + 4);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText('x\u2082', ox - 5, 12);
        }

        function drawHeatmap(cw, ch) {
            const { values, cols, rows, resolution, vmin, vmax } = heatmapImageData;
            // Symmetric range for color mapping
            const absMax = Math.max(Math.abs(vmin), Math.abs(vmax), 0.001);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const v = values[r * cols + c];
                    const t = (v + absMax) / (2 * absMax); // 0=neg, 0.5=boundary, 1=pos

                    let red, green, blue, alpha;
                    if (t < 0.5) {
                        // Blue to dark (negative class)
                        const s = t * 2; // 0..1
                        red = Math.round(239 * (1 - s) * 0.6);
                        green = Math.round(68 * (1 - s) * 0.6);
                        blue = Math.round(68 + (200 - 68) * (1 - s));
                        alpha = 0.25 + 0.35 * (1 - s);
                    } else {
                        // Dark to green (positive class)
                        const s = (t - 0.5) * 2; // 0..1
                        red = Math.round(34 * s * 0.6);
                        green = Math.round(80 + 117 * s * 0.6);
                        blue = Math.round(68 * (1 - s));
                        alpha = 0.25 + 0.35 * s;
                    }

                    ctx.fillStyle = `rgba(${red},${green},${blue},${alpha})`;
                    ctx.fillRect(c * resolution, r * resolution, resolution, resolution);
                }
            }
        }

        function drawContours(cw, ch) {
            if (!heatmapImageData) return;
            const { values, cols, rows, resolution } = heatmapImageData;

            // Draw contour at value = 0 (decision boundary), +1 and -1 (margins)
            const contourLevels = [
                { val: 0, color: '#facc15', lineWidth: 2.5, dash: [] },
                { val: 1, color: '#94a3b8', lineWidth: 1.5, dash: [6, 4] },
                { val: -1, color: '#94a3b8', lineWidth: 1.5, dash: [6, 4] }
            ];

            for (const contour of contourLevels) {
                ctx.strokeStyle = contour.color;
                ctx.lineWidth = contour.lineWidth;
                ctx.setLineDash(contour.dash);
                ctx.beginPath();

                let segmentStarted = false;

                // March horizontally through grid finding zero-crossings
                for (let r = 0; r < rows - 1; r++) {
                    for (let c = 0; c < cols - 1; c++) {
                        const idx = r * cols + c;
                        const v00 = values[idx] - contour.val;
                        const v10 = values[idx + 1] - contour.val;
                        const v01 = values[(r + 1) * cols + c] - contour.val;
                        const v11 = values[(r + 1) * cols + c + 1] - contour.val;

                        const points = [];

                        // Top edge
                        if (v00 * v10 < 0) {
                            const t = v00 / (v00 - v10);
                            points.push([(c + t) * resolution, r * resolution]);
                        }
                        // Bottom edge
                        if (v01 * v11 < 0) {
                            const t = v01 / (v01 - v11);
                            points.push([(c + t) * resolution, (r + 1) * resolution]);
                        }
                        // Left edge
                        if (v00 * v01 < 0) {
                            const t = v00 / (v00 - v01);
                            points.push([c * resolution, (r + t) * resolution]);
                        }
                        // Right edge
                        if (v10 * v11 < 0) {
                            const t = v10 / (v10 - v11);
                            points.push([(c + 1) * resolution, (r + t) * resolution]);
                        }

                        if (points.length >= 2) {
                            ctx.moveTo(points[0][0], points[0][1]);
                            ctx.lineTo(points[1][0], points[1][1]);
                        }
                    }
                }

                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawDataPoints(cw, ch) {
            const all = getAllData();
            const d = all.data;
            const l = all.labels;

            // Determine which are support vectors
            const svSet = new Set();
            if (model) {
                if (modelType === 'linear') {
                    for (const idx of model.supportVectors) svSet.add(idx);
                } else {
                    for (const idx of model.supportIndices) svSet.add(idx);
                }
            }

            for (let i = 0; i < d.length; i++) {
                const [cx, cy] = dataToCanvas(d[i][0], d[i][1]);
                const isSV = svSet.has(i);
                const radius = isSV ? 7 : 4.5;

                // Support vector ring
                if (isSV) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Point fill
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fillStyle = l[i] === 1 ? '#22c55e' : '#ef4444';
                ctx.fill();

                // Point border
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        /* ---------- Stats update ---------- */
        function updateStats(all, elapsed) {
            if (!model) return;

            // Accuracy
            let correct = 0;
            for (let i = 0; i < all.data.length; i++) {
                let pred;
                if (modelType === 'linear') {
                    pred = SVMUtils.predictSVM(all.data[i], model.w, model.b);
                } else {
                    pred = SVMUtils.predictKernelSVM(
                        all.data[i], model._data, model._labels,
                        model.alphas, model.b, model._kernelFn
                    );
                }
                if (pred === all.labels[i]) correct++;
            }
            const acc = (correct / all.data.length * 100);
            const accEl = $('statAccuracy');
            accEl.textContent = acc.toFixed(1) + '%';
            accEl.className = 'stat-value ' + (acc >= 90 ? 'good' : acc >= 70 ? 'warn' : 'bad');

            // Support vectors
            const svCount = modelType === 'linear'
                ? model.supportVectors.length
                : model.supportIndices.length;
            $('statSV').textContent = `${svCount} / ${all.data.length}`;

            // Margin
            if (modelType === 'linear') {
                const margin = SVMUtils.computeMargin(model.w);
                $('statMargin').textContent = isFinite(margin) ? margin.toFixed(4) : '--';
            } else {
                $('statMargin').textContent = 'N/A (非线性核)';
            }

            // SV ratio bar
            const ratio = all.data.length > 0 ? svCount / all.data.length * 100 : 0;
            const fill = $('svRatioFill');
            fill.style.width = ratio.toFixed(1) + '%';
            fill.textContent = ratio.toFixed(1) + '%';

            // Time
            $('statTime').textContent = elapsed.toFixed(0) + ' ms';

            // Formula
            updateFormula();
        }

        function updateFormula() {
            const el = $('formulaDisplay');
            if (!model) {
                el.innerHTML = '<span class="text-muted" style="font-size:0.85rem;">训练后显示</span>';
                return;
            }

            let latex = '';
            if (modelType === 'linear') {
                const w = model.w;
                const b = model.b;
                latex = `f(\\mathbf{x}) = ${w[0].toFixed(3)}x_1 `;
                latex += w[1] >= 0 ? `+ ${w[1].toFixed(3)}x_2 ` : `- ${Math.abs(w[1]).toFixed(3)}x_2 `;
                latex += b >= 0 ? `+ ${b.toFixed(3)}` : `- ${Math.abs(b).toFixed(3)}`;
            } else {
                const svCount = model.supportIndices.length;
                latex = `f(\\mathbf{x}) = \\sum_{i=1}^{${svCount}} \\alpha_i y_i K(\\mathbf{x}_i, \\mathbf{x}) + b`;
                latex += `\\\\b = ${model.b.toFixed(4)}`;
            }

            try {
                katex.render(latex, el, { displayMode: true, throwOnError: false });
            } catch (e) {
                el.textContent = latex;
            }
        }

        function updateKernelFormula() {
            const el = $('kernelFormula');
            const type = kernelSel.value;
            const gamma = Math.pow(10, parseFloat(gammaSl.value)).toFixed(3);
            const degree = degreeSl.value;

            let latex = '';
            switch (type) {
                case 'linear':
                    latex = 'K(\\mathbf{x}, \\mathbf{y}) = \\mathbf{x} \\cdot \\mathbf{y}';
                    break;
                case 'poly':
                    latex = `K(\\mathbf{x}, \\mathbf{y}) = (\\mathbf{x} \\cdot \\mathbf{y} + 1)^{${degree}}`;
                    break;
                case 'rbf':
                    latex = `K(\\mathbf{x}, \\mathbf{y}) = \\exp(-${gamma} \\|\\mathbf{x} - \\mathbf{y}\\|^2)`;
                    break;
                case 'sigmoid':
                    latex = `K(\\mathbf{x}, \\mathbf{y}) = \\tanh(${(gamma * 0.1).toFixed(4)} \\, \\mathbf{x} \\cdot \\mathbf{y})`;
                    break;
            }

            try {
                katex.render(latex, el, { displayMode: true, throwOnError: false });
            } catch (e) {
                el.textContent = latex;
            }
        }

        /* ---------- Status bar ---------- */
        function setStatus(type, msg) {
            statusBar.className = 'status-bar ' + type;
            if (type === 'training') {
                statusBar.innerHTML = `<span class="spinner-inline"></span> ${msg}`;
            } else {
                statusBar.textContent = msg;
            }
        }

        /* ---------- Kernel param visibility ---------- */
        function updateKernelParamVisibility() {
            const k = kernelSel.value;
            gammaRow.classList.toggle('visible', k === 'rbf' || k === 'sigmoid');
            degreeRow.classList.toggle('visible', k === 'poly');
        }

        /* ---------- Slider display ---------- */
        function updateSliderDisplays() {
            noiseValEl.textContent = parseFloat(noiseSl.value).toFixed(2);
            sampleValEl.textContent = sampleSl.value;
            cValEl.textContent = Math.pow(10, parseFloat(cSl.value)).toFixed(2);
            gammaValEl.textContent = Math.pow(10, parseFloat(gammaSl.value)).toFixed(2);
            degreeValEl.textContent = degreeSl.value;
        }

        /* ---------- Presets ---------- */
        function applyPreset(name) {
            // Remove active from all preset buttons
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`[data-preset="${name}"]`);
            if (btn) btn.classList.add('active');

            switch (name) {
                case 'linearly-separable':
                    datasetSel.value = 'linear';
                    noiseSl.value = '0.05';
                    sampleSl.value = '100';
                    kernelSel.value = 'linear';
                    cSl.value = '0'; // C=1
                    break;
                case 'need-kernel':
                    datasetSel.value = 'circle';
                    noiseSl.value = '0.10';
                    sampleSl.value = '120';
                    kernelSel.value = 'rbf';
                    cSl.value = '1'; // C=10
                    gammaSl.value = '0'; // gamma=1
                    break;
                case 'noisy':
                    datasetSel.value = 'moons';
                    noiseSl.value = '0.40';
                    sampleSl.value = '150';
                    kernelSel.value = 'rbf';
                    cSl.value = '-0.5'; // C~0.32
                    gammaSl.value = '0.3'; // gamma~2
                    break;
            }

            updateSliderDisplays();
            updateKernelParamVisibility();
            updateKernelFormula();
            generateData();
            renderAll();
        }

        /* ---------- Canvas tooltip on hover ---------- */
        const tooltip = $('canvasTooltip');
        let tooltipRafId = null;

        function onCanvasMouseMove(e) {
            if (tooltipRafId) cancelAnimationFrame(tooltipRafId);
            tooltipRafId = requestAnimationFrame(() => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = (canvas.width / window.devicePixelRatio) / rect.width;
                const scaleY = (canvas.height / window.devicePixelRatio) / rect.height;
                const cx = (e.clientX - rect.left) * scaleX;
                const cy = (e.clientY - rect.top) * scaleY;
                const [px, py] = canvasToData(cx, cy);

                let html = `<span class="tt-coord">x=(${px.toFixed(2)}, ${py.toFixed(2)})</span>`;

                if (model) {
                    const fval = decisionValue(px, py);
                    const cls = fval >= 0 ? '+1' : '-1';
                    const clsClass = fval >= 0 ? 'pos' : 'neg';
                    html += `<br><span class="tt-val">f(x)=${fval.toFixed(3)}</span>`;
                    html += ` <span class="tt-class ${clsClass}">[${cls}]</span>`;
                }

                tooltip.innerHTML = html;
                tooltip.classList.add('visible');

                // Position tooltip relative to wrapper
                const wrapRect = wrapper.getBoundingClientRect();
                let tx = e.clientX - wrapRect.left + 12;
                let ty = e.clientY - wrapRect.top - 10;

                // Keep within bounds
                const tw = tooltip.offsetWidth;
                const th = tooltip.offsetHeight;
                if (tx + tw > wrapRect.width - 4) tx = tx - tw - 24;
                if (ty + th > wrapRect.height - 4) ty = ty - th - 4;
                if (ty < 4) ty = 4;

                tooltip.style.left = tx + 'px';
                tooltip.style.top = ty + 'px';
            });
        }

        function onCanvasMouseLeave() {
            tooltip.classList.remove('visible');
        }

        /* ---------- Nearest point highlight ---------- */
        function findNearestPoint(px, py) {
            const all = getAllData();
            let minDist = Infinity;
            let minIdx = -1;
            for (let i = 0; i < all.data.length; i++) {
                const dx = all.data[i][0] - px;
                const dy = all.data[i][1] - py;
                const d = dx * dx + dy * dy;
                if (d < minDist) {
                    minDist = d;
                    minIdx = i;
                }
            }
            return { idx: minIdx, dist: Math.sqrt(minDist) };
        }

        /* ---------- Canvas click: add custom points ---------- */
        function onCanvasClick(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = (canvas.width / window.devicePixelRatio) / rect.width;
            const scaleY = (canvas.height / window.devicePixelRatio) / rect.height;
            const cx = (e.clientX - rect.left) * scaleX;
            const cy = (e.clientY - rect.top) * scaleY;
            const [px, py] = canvasToData(cx, cy);

            // Left click = +1, right click = -1
            const label = (e.button === 2 || e.ctrlKey) ? -1 : 1;

            customData.push([px, py]);
            customLabels.push(label);

            // If model exists, retrain silently? No, just redraw
            renderAll();
        }

        /* ---------- Event wiring ---------- */
        function init() {
            // Resize
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                if (model) computeHeatmap();
                renderAll();
            });

            // Generate initial data
            generateData();
            renderAll();
            updateKernelParamVisibility();
            updateSliderDisplays();

            // Render kernel formula once KaTeX is loaded
            if (typeof katex !== 'undefined') {
                updateKernelFormula();
            } else {
                window.addEventListener('load', updateKernelFormula);
            }

            // Train button
            trainBtn.addEventListener('click', () => {
                // Use requestAnimationFrame to let status update render
                setStatus('training', '训练中...');
                requestAnimationFrame(() => {
                    setTimeout(train, 30);
                });
            });

            // Regenerate
            regenerateBtn.addEventListener('click', () => {
                generateData();
                model = null;
                heatmapImageData = null;
                setStatus('idle', '数据已重新生成');
                resetStats();
                renderAll();
            });

            // Clear custom
            clearCustomBtn.addEventListener('click', () => {
                customData = [];
                customLabels = [];
                renderAll();
            });

            // Dataset change
            datasetSel.addEventListener('change', () => {
                generateData();
                model = null;
                heatmapImageData = null;
                resetStats();
                renderAll();
                setStatus('idle', '等待训练...');
            });

            // Kernel change
            kernelSel.addEventListener('change', () => {
                updateKernelParamVisibility();
                updateKernelFormula();
            });

            // Sliders
            const sliders = [noiseSl, sampleSl, cSl, gammaSl, degreeSl];
            sliders.forEach(sl => {
                sl.addEventListener('input', () => {
                    updateSliderDisplays();
                    updateKernelFormula();
                });
            });

            // Presets
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
            });

            // Canvas clicks
            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                onCanvasClick(e);
            });

            // Canvas tooltip
            canvas.addEventListener('mousemove', onCanvasMouseMove);
            canvas.addEventListener('mouseleave', onCanvasMouseLeave);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Ignore when typing in inputs
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

                switch (e.key.toLowerCase()) {
                    case 't':
                    case 'enter':
                        e.preventDefault();
                        trainBtn.click();
                        break;
                    case 'r':
                        e.preventDefault();
                        regenerateBtn.click();
                        break;
                    case 'c':
                        e.preventDefault();
                        clearCustomBtn.click();
                        break;
                    case '1':
                        e.preventDefault();
                        applyPreset('linearly-separable');
                        break;
                    case '2':
                        e.preventDefault();
                        applyPreset('need-kernel');
                        break;
                    case '3':
                        e.preventDefault();
                        applyPreset('noisy');
                        break;
                }
            });
        }

        function resetStats() {
            $('statAccuracy').textContent = '--';
            $('statAccuracy').className = 'stat-value';
            $('statSV').textContent = '-- / --';
            $('statMargin').textContent = '--';
            $('svRatioFill').style.width = '0%';
            $('svRatioFill').textContent = '0%';
            $('statTime').textContent = '--';
            $('formulaDisplay').innerHTML = '<span class="text-muted" style="font-size:0.85rem;">训练后显示</span>';
        }

        /* ---------- Bootstrap ---------- */
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>
</body>
</html>
