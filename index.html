<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式可视化学习平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
         *  全局配置 — 添加新专题只需修改 JS 中的 CATEGORIES 数组
         * ========================================================================== */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --text-muted: #6c6c7c;
            --accent-green: #16c79a;
            --accent-blue: #4fc3f7;
            --accent-purple: #b388ff;
            --accent-orange: #ffab40;
            --accent-red: #ff5252;
            --accent-pink: #ff80ab;
            --border-color: #2a2a4a;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius-md: 12px;
            --radius-lg: 18px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-cn: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: var(--font-cn), var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }

        /* ========== 背景动画 ========== */
        .bg-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.12;
        }

        /* ========== 页面容器 ========== */
        .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 4rem; }

        /* ========== Hero ========== */
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero-icon {
            width: 72px; height: 72px; margin: 0 auto 1.2rem;
            background: rgba(22,199,154,0.12); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        .hero h1 {
            font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 0.5rem;
        }
        .hero p { color: var(--text-secondary); font-size: 1.05rem; max-width: 600px; margin: 0 auto; }

        /* ========== 统计条 ========== */
        .stats-bar {
            display: flex; justify-content: center; gap: 2.5rem;
            margin: 1.5rem 0 2.5rem; flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-value { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; color: var(--accent-green); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }

        /* ========== 分类区块 ========== */
        .category {
            margin-bottom: 3rem;
        }
        .category-header {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1.2rem; padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer; user-select: none;
        }
        .category-header:hover { opacity: 0.85; }
        .collapse-chevron {
            margin-left: auto; flex-shrink: 0;
            width: 20px; height: 20px; color: var(--text-muted);
            transition: transform 0.3s ease;
        }
        .category.collapsed .collapse-chevron {
            transform: rotate(-90deg);
        }
        .category .card-grid {
            transition: max-height 0.35s ease, opacity 0.25s ease;
            overflow: hidden;
        }
        .category.collapsed {
            margin-bottom: 1rem;
        }
        .category.collapsed .card-grid {
            max-height: 0 !important; opacity: 0;
            margin-top: 0; margin-bottom: 0;
        }
        .category.collapsed .category-header {
            margin-bottom: 0; padding-bottom: 0.5rem;
        }
        .collapse-all-bar {
            display: flex; justify-content: flex-end; gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .collapse-all-bar button {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 0.35rem 0.9rem;
            border-radius: 6px; font-size: 0.78rem; cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .collapse-all-bar button:hover {
            border-color: var(--text-muted); color: var(--text-primary);
        }
        .category-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .category-icon svg { width: 22px; height: 22px; }
        .category-title {
            font-size: 1.3rem; font-weight: 700;
        }
        .category-subtitle {
            font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono);
        }
        .category-desc {
            color: var(--text-muted); font-size: 0.85rem; margin-left: auto; margin-right: 0.5rem;
        }

        /* ========== 卡片网格 ========== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .topic-card {
            position: relative; overflow: hidden;
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 1.6rem;
            transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
            cursor: pointer; display: block;
        }
        .topic-card:hover {
            border-color: var(--card-accent, var(--accent-green));
            box-shadow: 0 0 30px color-mix(in srgb, var(--card-accent, var(--accent-green)) 15%, transparent), var(--shadow);
            transform: translateY(-3px);
        }
        .topic-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--card-accent, var(--accent-green));
            opacity: 0; transition: opacity 0.3s;
        }
        .topic-card:hover::before { opacity: 1; }

        .card-header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.8rem; }
        .card-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .card-icon svg { width: 26px; height: 26px; }
        .card-title { font-size: 1.15rem; font-weight: 700; }
        .card-subtitle { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }

        .card-desc { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 1rem; line-height: 1.6; }

        .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
        .tag {
            padding: 0.12rem 0.5rem; border-radius: 999px;
            font-size: 0.7rem; font-weight: 600;
        }

        .card-meta {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 0.8rem; border-top: 1px solid var(--border-color);
        }
        .meta-left { display: flex; gap: 1rem; }
        .meta-item { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.25rem; }
        .meta-item .num { color: var(--text-primary); font-family: var(--font-mono); font-weight: 600; }


        /* ========== 即将到来卡片 ========== */
        .topic-card.coming-soon {
            opacity: 0.5; cursor: default; pointer-events: none; position: relative;
        }
        .topic-card.coming-soon::after {
            content: '即将到来';
            position: absolute; top: 12px; right: 12px;
            background: var(--border-color); color: var(--text-muted);
            font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.5rem;
            border-radius: 999px; letter-spacing: 0.05em;
        }

        /* ========== 占位卡片 ========== */
        .placeholder-card {
            background: transparent; border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg); padding: 1.6rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 160px; cursor: default; transition: border-color 0.3s;
        }
        .placeholder-card:hover { border-color: var(--text-muted); }
        .placeholder-icon { font-size: 2rem; color: var(--text-muted); margin-bottom: 0.4rem; opacity: 0.4; }
        .placeholder-text { color: var(--text-muted); font-size: 0.82rem; text-align: center; line-height: 1.5; }

        /* ========== 页脚 ========== */
        .footer {
            text-align: center; padding-top: 2rem; border-top: 1px solid var(--border-color);
            color: var(--text-muted); font-size: 0.8rem;
        }
        .footer a { color: var(--accent-blue); }
        .footer a:hover { color: var(--accent-green); }

        /* ========== file:// 警告 ========== */
        .file-warning {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
        }
        .file-warning.hidden { display: none; }
        .warning-box {
            background: var(--bg-secondary); border: 1px solid var(--accent-orange);
            border-radius: var(--radius-md); padding: 2rem; max-width: 500px; text-align: center;
        }
        .warning-box h3 { color: var(--accent-orange); margin-bottom: 1rem; }
        .warning-box code {
            display: block; background: var(--bg-primary); padding: 0.6rem 1rem;
            border-radius: 6px; margin: 0.8rem 0; font-family: var(--font-mono); font-size: 0.85rem;
            color: var(--accent-green);
        }
        .warning-box button {
            margin-top: 1rem; padding: 0.5rem 1.5rem; border: 1px solid var(--border-color);
            background: var(--bg-primary); color: var(--text-primary); border-radius: 6px;
            cursor: pointer; font-family: inherit;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            html { font-size: 14px; }
            .page { padding: 2rem 1rem; }
            .hero h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: 1fr; }
            .stats-bar { gap: 1.5rem; }
            .category-desc { display: none; }
        }
    </style>
</head>
<body>

<!-- 背景粒子 -->
<canvas class="bg-canvas" id="bgCanvas"></canvas>

<!-- file:// 检测 -->
<div class="file-warning hidden" id="fileWarning">
    <div class="warning-box">
        <h3>&#9888; 需要 HTTP 服务器</h3>
        <p style="color:var(--text-secondary); font-size:0.9rem;">
            本项目需要通过 HTTP 服务器访问，不能直接用 file:// 协议打开。
        </p>
        <code>cd 算法学习 &amp;&amp; python -m http.server 8080</code>
        <p style="color:var(--text-muted); font-size:0.8rem;">然后浏览器打开 http://localhost:8080</p>
        <button onclick="document.getElementById('fileWarning').classList.add('hidden')">我知道了</button>
    </div>
</div>

<div class="page">
    <!-- Hero -->
    <header class="hero">
        <div class="hero-icon">&#x1F9E0;</div>
        <h1>交互式可视化学习平台</h1>
        <p>通过交互动画理解技术原理 — 不只是看公式和文档，而是亲手操作每一步</p>
    </header>

    <!-- 统计 -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- 分类内容 -->
    <div id="content"></div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>交互式可视化学习平台 &mdash; 暗色主题 &bull; 全中文 &bull; 纯前端</p>
        <p style="margin-top:0.5rem;">by 陈阳宾 &bull; 微信: abc1513422946</p>
    </footer>
</div>

/* =============================================================================
 *  渲染逻辑
 * ============================================================================= */

function getAllTopics() {
    return CATEGORIES.flatMap(c => c.topics);
}

function renderStats() {
    const bar = document.getElementById('statsBar');
    const topics = getAllTopics();
    const ready = topics.filter(t => !t.comingSoon);
    const totalCategories = CATEGORIES.length;
    const totalTopics = topics.length;
    const readyModules = ready.reduce((s, t) => s + t.modules, 0);
    bar.innerHTML = `
        <div class="stat"><div class="stat-value">${totalCategories}</div><div class="stat-label">技术领域</div></div>
        <div class="stat"><div class="stat-value">${totalTopics}</div><div class="stat-label">学习专题</div></div>
        <div class="stat"><div class="stat-value">${readyModules}</div><div class="stat-label">交互模块</div></div>
    `;
}

function renderTopicCard(topic) {
    const card = document.createElement(topic.comingSoon ? 'div' : 'a');
    if (!topic.comingSoon) card.href = topic.path + 'index.html';
    card.className = 'topic-card' + (topic.comingSoon ? ' coming-soon' : '');
    card.style.setProperty('--card-accent', topic.accentColor);
    card.innerHTML = `
        <div class="card-header">
            <div class="card-icon" style="color:${topic.accentColor};background:${topic.accentColor}1a">${topic.icon}</div>
            <div>
                <div class="card-title">${topic.name}</div>
                <div class="card-subtitle">${topic.subtitle}</div>
            </div>
        </div>
        <div class="card-desc">${topic.description}</div>
        <div class="card-tags">
            ${topic.tags.map(t => `<span class="tag" style="background:${topic.accentColor}1a;color:${topic.accentColor}">${t}</span>`).join('')}
        </div>
        <div class="card-meta">
            <div class="meta-left">
                <div class="meta-item">&#x1F4D6; <span class="num">${topic.modules}</span> 模块</div>
            </div>
        </div>
    `;
    return card;
}

function renderContent() {
    const container = document.getElementById('content');
    container.innerHTML = '';

    // Collapse/Expand all bar
    const bar = document.createElement('div');
    bar.className = 'collapse-all-bar';
    bar.innerHTML = `
        <button onclick="toggleAllCategories(false)">全部展开</button>
        <button onclick="toggleAllCategories(true)">全部折叠</button>
    `;
    container.appendChild(bar);

    CATEGORIES.forEach(cat => {
        const section = document.createElement('section');
        section.className = 'category collapsed';

        // Header (clickable to toggle)
        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
            <div class="category-icon" style="color:${cat.accentColor};background:${cat.accentColor}1a">${cat.icon}</div>
            <div>
                <div class="category-title">${cat.name}</div>
                <div class="category-subtitle">${cat.subtitle}</div>
            </div>
            <div class="category-desc">${cat.description}</div>
            <svg class="collapse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        `;
        header.addEventListener('click', () => {
            section.classList.toggle('collapsed');
        });
        section.appendChild(header);

        // Card grid
        const grid = document.createElement('div');
        grid.className = 'card-grid';

        cat.topics.forEach(topic => {
            grid.appendChild(renderTopicCard(topic));
        });

        // Placeholder
        if (cat.placeholder) {
            const ph = document.createElement('div');
            ph.className = 'placeholder-card';
            ph.innerHTML = `
                <div class="placeholder-icon">+</div>
                <div class="placeholder-text">更多即将到来…<br><span style="font-size:0.72rem;opacity:0.7">${cat.placeholder}</span></div>
            `;
            grid.appendChild(ph);
        }

        section.appendChild(grid);
        container.appendChild(section);
    });
}

function toggleAllCategories(collapse) {
    document.querySelectorAll('.category').forEach(cat => {
        cat.classList.toggle('collapsed', collapse);
    });
}

/* =============================================================================
 *  背景粒子动画
 * ============================================================================= */
function initBackground() {
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }

    function createParticles() {
        particles = [];
        const count = Math.min(50, Math.floor(w * h / 20000));
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: Math.random() * 2 + 1,
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(22,199,154,${0.3 * (1 - dist / 150)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(22,199,154,0.5)';
            ctx.fill();
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
        });
        requestAnimationFrame(draw);
    }

    resize();
    createParticles();
    draw();
    window.addEventListener('resize', () => { resize(); createParticles(); });
}

/* =============================================================================
 *  初始化
 * ============================================================================= */
document.addEventListener('DOMContentLoaded', () => {
    if (window.location.protocol === 'file:') {
        document.getElementById('fileWarning').classList.remove('hidden');
    }
    renderStats();
    renderContent();
    initBackground();
});
</script>
</body>
