    // =========================================================================
    //  Canvas Interaction
    // =========================================================================
    function getCanvasPoint(e) {
        const rect = mainCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function onCanvasMouseMove(e) {
        if (!simData || state.currentView === 'compare' || state.currentView === 'heatmap') {
            tooltip.style.display = 'none';
            return;
        }

        const { x, y } = getCanvasPoint(e);
        const { regressionResults, xsReg, activeFactors } = simData;

        const wrap = mainCanvas.parentElement.getBoundingClientRect();
        const cw = wrap.width, ch = wrap.height;
        const pad = { top: 40, right: 30, bottom: 50, left: 60 };
        const pw = cw - pad.left - pad.right;
        const ph = ch - pad.top - pad.bottom;

        let closest = -1;
        let closestDist = 20;

        if (state.currentView === 'scatter') {
            const allVals = [...simData.xs_actual, ...simData.xs_predicted];
            let minV = Math.min(...allVals);
            let maxV = Math.max(...allVals);
            const range = maxV - minV || 0.1;
            minV -= range * 0.08;
            maxV += range * 0.08;

            regressionResults.forEach((rr, i) => {
                const sx = pad.left + (rr.annPredicted - minV) / (maxV - minV) * pw;
                const sy = pad.top + ph - (rr.annActual - minV) / (maxV - minV) * ph;
                const d = Math.hypot(x - sx, y - sy);
                if (d < closestDist) { closestDist = d; closest = i; }
            });
        } else if (state.currentView === 'sml') {
            const betas = regressionResults.map(r => r.betas[0]);
            const rets = regressionResults.map(r => r.annActual);
            let minB = Math.min(...betas) - 0.1;
            let maxB = Math.max(...betas) + 0.1;
            let minR = Math.min(...rets);
            let maxR = Math.max(...rets);
            const rangeR = maxR - minR || 0.1;
            minR -= rangeR * 0.1;
            maxR += rangeR * 0.1;

            regressionResults.forEach((rr, i) => {
                const sx = pad.left + (betas[i] - minB) / (maxB - minB) * pw;
                const sy = pad.top + ph - (rets[i] - minR) / (maxR - minR) * ph;
                const d = Math.hypot(x - sx, y - sy);
                if (d < closestDist) { closestDist = d; closest = i; }
            });
        }

        if (closest >= 0) {
            const rr = regressionResults[closest];
            const stock = rr.stock;
            let html = `<div class="tt-title">${stock.name}</div>`;
            html += `Beta: ${stock.beta.toFixed(3)}<br>`;
            html += `行业: ${INDUSTRY_NAMES[stock.industry]}<br>`;
            html += `年化收益: ${(rr.annActual * 100).toFixed(2)}%<br>`;
            html += `预测收益: ${(rr.annPredicted * 100).toFixed(2)}%<br>`;
            html += `Alpha: ${(rr.alpha * 1200).toFixed(2)}%/年<br>`;
            html += `R\u00B2: ${rr.r2.toFixed(4)}<br>`;
            html += `<div style="margin-top:4px;font-size:0.68rem;color:var(--text-muted)">因子暴露:</div>`;
            activeFactors.forEach((fn, k) => {
                const fd = FACTOR_DEFS.find(f => f.key === fn);
                html += `<span style="color:${fd ? fd.color : '#ccc'}">${fd ? fd.label : fn}</span>: ${rr.betas[k].toFixed(3)}<br>`;
            });

            tooltip.innerHTML = html;
            tooltip.style.display = 'block';
            const tx = Math.min(e.clientX - mainCanvas.parentElement.getBoundingClientRect().left + 15, cw - 180);
            const ty = Math.min(e.clientY - mainCanvas.parentElement.getBoundingClientRect().top + 15, ch - 200);
            tooltip.style.left = tx + 'px';
            tooltip.style.top = ty + 'px';
        } else {
            tooltip.style.display = 'none';
        }
    }

    function onCanvasClick(e) {
        if (!simData || state.currentView === 'compare' || state.currentView === 'heatmap') return;

        const { x, y } = getCanvasPoint(e);
        const { regressionResults } = simData;
        const wrap = mainCanvas.parentElement.getBoundingClientRect();
        const cw = wrap.width, ch = wrap.height;
        const pad = { top: 40, right: 30, bottom: 50, left: 60 };
        const pw = cw - pad.left - pad.right;
        const ph = ch - pad.top - pad.bottom;

        let closest = -1;
        let closestDist = 20;

        if (state.currentView === 'scatter') {
            const allVals = [...simData.xs_actual, ...simData.xs_predicted];
            let minV = Math.min(...allVals);
            let maxV = Math.max(...allVals);
            const range = maxV - minV || 0.1;
            minV -= range * 0.08;
            maxV += range * 0.08;

            regressionResults.forEach((rr, i) => {
                const sx = pad.left + (rr.annPredicted - minV) / (maxV - minV) * pw;
                const sy = pad.top + ph - (rr.annActual - minV) / (maxV - minV) * ph;
                const d = Math.hypot(x - sx, y - sy);
                if (d < closestDist) { closestDist = d; closest = i; }
            });
        } else if (state.currentView === 'sml') {
            const betas = regressionResults.map(r => r.betas[0]);
            const rets = regressionResults.map(r => r.annActual);
            let minB = Math.min(...betas) - 0.1;
            let maxB = Math.max(...betas) + 0.1;
            let minR = Math.min(...rets);
            let maxR = Math.max(...rets);
            const rangeR = maxR - minR || 0.1;
            minR -= rangeR * 0.1;
            maxR += rangeR * 0.1;

            regressionResults.forEach((rr, i) => {
                const sx = pad.left + (betas[i] - minB) / (maxB - minB) * pw;
                const sy = pad.top + ph - (rets[i] - minR) / (maxR - minR) * ph;
                const d = Math.hypot(x - sx, y - sy);
                if (d < closestDist) { closestDist = d; closest = i; }
            });
        }

        selectedStockIdx = closest;
        drawCurrentView();
    }

    // =========================================================================
    //  Auto-Play: Animate Adding Factors
    // =========================================================================
    function startAutoPlay() {
        stopAutoPlay();
        const steps = [
            { model: 'capm', label: 'CAPM (1因子)', factors: ['market'] },
            { model: 'ff3', label: 'FF3 (3因子)', factors: ['market', 'size', 'value'] },
            { model: 'ff5', label: 'FF5 (5因子)', factors: ['market', 'size', 'value', 'profitability', 'investment'] },
            { model: 'custom', label: '全因子 (7因子)', factors: ['market', 'size', 'value', 'momentum', 'profitability', 'investment', 'volatility'] },
        ];

        let stepIdx = 0;
        const bar = $('#autoPlayBar');
        bar.classList.add('active');
        state.currentView = 'scatter';
        $$('.viz-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.view === 'scatter');
        });

        function doStep() {
            if (stepIdx >= steps.length) {
                stopAutoPlay();
                return;
            }
            const step = steps[stepIdx];
            // Set model
            state.model = step.model;
            $$('.model-btn').forEach(b => b.classList.toggle('active', b.dataset.model === step.model));

            if (step.model === 'custom') {
                FACTOR_DEFS.forEach(fd => {
                    state.customFactors[fd.key] = step.factors.includes(fd.key);
                });
                $('#factorToggles').style.display = '';
                $('#factorToggleList').querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    if (!cb.disabled) cb.checked = state.customFactors[cb.dataset.factor];
                });
            } else {
                $('#factorToggles').style.display = 'none';
            }

            runSimulation();

            // Update progress
            const pct = ((stepIdx + 1) / steps.length * 100);
            $('#apFill').style.width = pct + '%';
            $('#apLabel').textContent = step.label + ' R\u00B2=' + simData.avgR2.toFixed(4);

            stepIdx++;
            if (stepIdx < steps.length) {
                autoPlayTimer = setTimeout(doStep, 2500);
            } else {
                autoPlayTimer = setTimeout(stopAutoPlay, 2000);
            }
        }

        doStep();
    }

    function stopAutoPlay() {
        if (autoPlayTimer) {
            clearTimeout(autoPlayTimer);
            autoPlayTimer = null;
        }
        $('#autoPlayBar').classList.remove('active');
    }

    // =========================================================================
    //  Export
    // =========================================================================
    function exportResults() {
        if (!simData) return;
        const { activeFactors, regressionResults, avgR2, avgAdjR2, avgBetaStats } = simData;
        const modelNames = { capm: 'CAPM', ff3: 'FF3', ff5: 'FF5', custom: '自定义' };

        let text = '=== 因子模型分析结果 ===\n\n';
        text += '模型: ' + (modelNames[state.model] || state.model) + '\n';
        text += '因子: ' + activeFactors.join(', ') + '\n';
        text += '股票数: ' + state.nStocks + '\n';
        text += '模拟期数: ' + state.nPeriods + '\n';
        text += '平均 R\u00B2: ' + avgR2.toFixed(6) + '\n';
        text += '平均调整 R\u00B2: ' + avgAdjR2.toFixed(6) + '\n\n';

        text += '--- 平均因子统计 ---\n';
        text += '因子\t\tBeta\t\tt值\t\tp值\n';
        avgBetaStats.forEach(fs => {
            const fd = FACTOR_DEFS.find(f => f.key === fs.factor);
            text += (fd ? fd.label : fs.factor) + '\t\t' + fs.avgBeta.toFixed(4) + '\t\t' + fs.avgTStat.toFixed(3) + '\t\t' + fs.avgPValue.toFixed(4) + '\n';
        });

        text += '\n--- 个股结果 ---\n';
        text += '股票\tBeta\t年化收益\t预测收益\tAlpha\tR\u00B2\n';
        regressionResults.forEach(rr => {
            text += rr.stock.name + '\t' + rr.stock.beta.toFixed(3) + '\t' + (rr.annActual * 100).toFixed(2) + '%\t' + (rr.annPredicted * 100).toFixed(2) + '%\t' + (rr.alpha * 1200).toFixed(2) + '%\t' + rr.r2.toFixed(4) + '\n';
        });

        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'factor_model_results.txt';
        a.click();
        URL.revokeObjectURL(url);
    }

    // =========================================================================
    //  Reset
    // =========================================================================
    function resetAll() {
        state = {
            model: 'capm',
            customFactors: { market: true, size: false, value: false, momentum: false, profitability: false, investment: false, volatility: false },
            rf: 3, mp: 6, nStocks: 50, nPeriods: 120, noise: 2,
            colorBy: 'beta',
            currentView: 'scatter',
        };
        selectedStockIdx = -1;
        saveState();

        // Reset UI
        $$('.model-btn').forEach(b => b.classList.toggle('active', b.dataset.model === 'capm'));
        $('#factorToggles').style.display = 'none';
        $('#rfSlider').value = 3; $('#rfVal').textContent = '3%';
        $('#mpSlider').value = 6; $('#mpVal').textContent = '6%';
        $('#nStockSlider').value = 50; $('#nStockVal').textContent = '50';
        $('#nPeriodSlider').value = 120; $('#nPeriodVal').textContent = '120';
        $('#noiseSlider').value = 2; $('#noiseVal').textContent = '中';
        $('#colorBy').value = 'beta';
        $$('.viz-tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'scatter'));

        $('#factorToggleList').querySelectorAll('input[type="checkbox"]').forEach(cb => {
            if (!cb.disabled) cb.checked = cb.dataset.factor === 'market';
        });

        stopAutoPlay();
        runSimulation();
    }
});
</script>
