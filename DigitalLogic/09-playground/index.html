<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字逻辑游乐场 — 数字逻辑基础</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="../shared/styles/common.css">
    <link rel="stylesheet" href="../shared/styles/components.css">
    <style>
/* ========== Playground Layout ========== */
.playground-wrap {
    display: flex;
    height: calc(100vh - var(--header-height));
    margin-top: var(--header-height);
    overflow: hidden;
}

/* ========== Left Panel: Component Palette ========== */
.palette-panel {
    width: 240px;
    min-width: 240px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    user-select: none;
}

.palette-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent-green);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.palette-group {
    border-bottom: 1px solid var(--border-color);
}

.palette-group-title {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: color 0.2s;
}

.palette-group-title:hover {
    color: var(--text-secondary);
}

.palette-group-title .arrow {
    font-size: 0.65rem;
    transition: transform 0.2s;
}

.palette-group.collapsed .arrow {
    transform: rotate(-90deg);
}

.palette-group.collapsed .palette-items {
    display: none;
}

.palette-items {
    padding: 0.25rem 0.5rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.palette-item {
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.15s;
}

.palette-item:hover {
    background: rgba(79, 195, 247, 0.1);
    color: var(--text-primary);
}

.palette-item.selected {
    background: rgba(22, 199, 154, 0.2);
    color: var(--accent-green);
    border: 1px solid rgba(22, 199, 154, 0.3);
}

.palette-item .pi-icon {
    width: 28px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 3px;
    flex-shrink: 0;
}

.pi-input .pi-icon { background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); }
.pi-gate .pi-icon { background: rgba(179, 136, 255, 0.15); color: var(--accent-purple); }
.pi-comb .pi-icon { background: rgba(255, 171, 64, 0.15); color: var(--accent-orange); }
.pi-seq .pi-icon { background: rgba(206, 147, 216, 0.15); color: #ce93d8; }
.pi-output .pi-icon { background: rgba(22, 199, 154, 0.15); color: var(--accent-green); }

/* ========== Center: Canvas Area ========== */
.canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg-primary);
}

.canvas-area canvas {
    display: block;
    cursor: crosshair;
}

.canvas-toolbar {
    position: absolute;
    top: 0.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.3rem;
    padding: 0.3rem;
    background: rgba(22, 33, 62, 0.9);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    backdrop-filter: blur(8px);
    z-index: 10;
}

.canvas-toolbar .btn {
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
}

.canvas-toolbar select {
    padding: 0.3rem 0.5rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    outline: none;
}

.canvas-toolbar select:hover {
    border-color: var(--accent-green);
}

.zoom-info {
    position: absolute;
    bottom: 0.5rem;
    left: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    z-index: 10;
    pointer-events: none;
}

.canvas-hint {
    position: absolute;
    bottom: 0.5rem;
    right: 290px;
    font-size: 0.7rem;
    color: var(--text-muted);
    z-index: 10;
    pointer-events: none;
    opacity: 0.6;
}

/* ========== Right Panel: Controls & Info ========== */
.control-panel {
    width: 280px;
    min-width: 280px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}

.ctrl-section {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border-color);
}

.ctrl-section-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
}

.ctrl-buttons {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
}

.ctrl-buttons .btn {
    flex: 1;
    min-width: 60px;
}

.btn-run { color: var(--accent-green); border-color: rgba(22, 199, 154, 0.3); }
.btn-run.running { background: rgba(22, 199, 154, 0.2); }
.btn-step { color: var(--accent-blue); border-color: rgba(79, 195, 247, 0.3); }
.btn-reset { color: var(--accent-red); border-color: rgba(255, 82, 82, 0.3); }

.speed-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
}

.speed-control label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    white-space: nowrap;
}

.speed-control input[type="range"] {
    flex: 1;
}

.speed-control .speed-val {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-green);
    min-width: 2.5rem;
    text-align: right;
}

/* ========== Info Panel ========== */
.info-panel {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem 1rem;
}

.info-panel h4 {
    font-size: 0.85rem;
    margin-bottom: 0.4rem;
    color: var(--accent-blue);
}

.info-empty {
    color: var(--text-muted);
    font-size: 0.8rem;
    font-style: italic;
    padding: 1rem 0;
    text-align: center;
}

.info-props {
    font-size: 0.8rem;
}

.info-props .prop-row {
    display: flex;
    justify-content: space-between;
    padding: 0.2rem 0;
    border-bottom: 1px solid rgba(42, 42, 74, 0.3);
}

.info-props .prop-key {
    color: var(--text-secondary);
}

.info-props .prop-val {
    font-family: var(--font-mono);
    color: var(--accent-green);
}

.info-truth-table {
    margin-top: 0.5rem;
    max-height: 180px;
    overflow-y: auto;
}

.info-truth-table table {
    border-collapse: collapse;
    width: 100%;
    font-family: var(--font-mono);
    font-size: 0.75rem;
}

.info-truth-table th,
.info-truth-table td {
    padding: 0.2rem 0.4rem;
    text-align: center;
    border: 1px solid rgba(42, 42, 74, 0.4);
}

.info-truth-table th {
    background: var(--bg-card);
    color: var(--accent-green);
    font-weight: 600;
    position: sticky;
    top: 0;
}

.info-truth-table td.v1 { color: var(--accent-green); font-weight: 600; }
.info-truth-table td.v0 { color: var(--text-muted); }

/* ========== Waveform Viewer ========== */
.waveform-section {
    border-top: 1px solid var(--border-color);
    padding: 0.75rem 1rem;
    min-height: 120px;
}

.waveform-section .ctrl-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.waveform-canvas-wrap {
    position: relative;
    width: 100%;
    height: 100px;
    margin-top: 0.3rem;
    background: rgba(15, 52, 96, 0.3);
    border-radius: var(--radius-sm);
    overflow: hidden;
}

.waveform-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.waveform-empty {
    color: var(--text-muted);
    font-size: 0.75rem;
    text-align: center;
    padding-top: 2rem;
    font-style: italic;
}

/* ========== Oscillation Warning ========== */
.osc-warning {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 82, 82, 0.15);
    border: 1px solid var(--accent-red);
    border-radius: var(--radius-md);
    padding: 1rem 1.5rem;
    color: var(--accent-red);
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 20;
    pointer-events: none;
    display: none;
}

.osc-warning.show {
    display: block;
}

/* ========== Context Menu ========== */
.ctx-menu {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0.3rem 0;
    z-index: 1000;
    display: none;
    min-width: 140px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.ctx-menu.show {
    display: block;
}

.ctx-menu-item {
    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.1s;
}

.ctx-menu-item:hover {
    background: rgba(22, 199, 154, 0.1);
    color: var(--text-primary);
}

.ctx-menu-item.danger { color: var(--accent-red); }
.ctx-menu-item.danger:hover { background: rgba(255, 82, 82, 0.1); }

/* ========== Responsive ========== */
@media (max-width: 1024px) {
    .palette-panel { width: 180px; min-width: 180px; }
    .control-panel { width: 220px; min-width: 220px; }
}

@media (max-width: 768px) {
    .playground-wrap { flex-direction: column; height: auto; }
    .palette-panel { width: 100%; min-width: auto; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border-color); }
    .palette-items { flex-direction: row; flex-wrap: wrap; }
    .canvas-area { height: 60vh; }
    .control-panel { width: 100%; min-width: auto; border-left: none; border-top: 1px solid var(--border-color); }
    .canvas-hint { display: none; }
}
    </style>

<!-- Context Menu -->
<div id="ctxMenu" class="ctx-menu">

<div class="playground-wrap">

                <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>

                <button class="btn btn-run" id="btnRun">运行</button>
                <button class="btn btn-step" id="btnStep">单步</button>

            </div>

</div>

<script src="../shared/scripts/digital-logic-utils.js"></script>
<script src="../shared/scripts/nav.js"></script>
<script>
/* ================================================================
   数字逻辑游乐场 — Digital Logic Playground
   Event-driven circuit simulator with drag-and-drop UI
   ================================================================ */
let _inited = false;
function safeInit() { if (!_inited) { _inited = true; init(); } }
document.addEventListener('DOMContentLoaded', safeInit);

function init() {
'use strict';

const C = DLUtils.COLORS;

/* ========== Component Type Definitions ========== */
const COMP_CATEGORIES = [
    { name: '输入', cssClass: 'pi-input', items: [
        { type: 'CONST0', label: '常量 0', shortLabel: '0', inputs: 0, outputs: 1 },
        { type: 'CONST1', label: '常量 1', shortLabel: '1', inputs: 0, outputs: 1 },
        { type: 'SWITCH', label: '开关', shortLabel: 'SW', inputs: 0, outputs: 1 },
        { type: 'CLOCK',  label: '时钟源', shortLabel: 'CLK', inputs: 0, outputs: 1 },
    ]},
    { name: '基本门', cssClass: 'pi-gate', items: [
        { type: 'AND',  label: 'AND 门',  shortLabel: 'AND',  inputs: 2, outputs: 1 },
        { type: 'OR',   label: 'OR 门',   shortLabel: 'OR',   inputs: 2, outputs: 1 },
        { type: 'NOT',  label: 'NOT 门',  shortLabel: 'NOT',  inputs: 1, outputs: 1 },
        { type: 'NAND', label: 'NAND 门', shortLabel: 'NAND', inputs: 2, outputs: 1 },
        { type: 'NOR',  label: 'NOR 门',  shortLabel: 'NOR',  inputs: 2, outputs: 1 },
        { type: 'XOR',  label: 'XOR 门',  shortLabel: 'XOR',  inputs: 2, outputs: 1 },
        { type: 'XNOR', label: 'XNOR 门', shortLabel: 'XNOR', inputs: 2, outputs: 1 },
    ]},
    { name: '组合', cssClass: 'pi-comb', items: [
        { type: 'MUX21',  label: '2:1 MUX',    shortLabel: 'MUX', inputs: 3, outputs: 1 },
        { type: 'DEC24',  label: '2-to-4 解码器', shortLabel: 'DEC', inputs: 2, outputs: 4 },
    ]},
    { name: '时序', cssClass: 'pi-seq', items: [
        { type: 'DFF',    label: 'D 触发器', shortLabel: 'D-FF', inputs: 2, outputs: 2 },
        { type: 'SRLATCH', label: 'SR 锁存器', shortLabel: 'SR', inputs: 2, outputs: 2 },
    ]},
    { name: '输出', cssClass: 'pi-output', items: [
        { type: 'LED',   label: 'LED',  shortLabel: 'LED', inputs: 1, outputs: 0 },
        { type: 'PROBE', label: '探针', shortLabel: 'PRB', inputs: 1, outputs: 0 },
    ]},
];

/* Component dimensions */
const COMP_W = 80, COMP_H_BASE = 50;
const PORT_R = 6;
const GRID_SIZE = 20;

/* ========== State ========== */
const state = {
    components: [],
    wires: [],
    nextId: 1,
    selectedCompId: null,
    selectedPaletteType: null,
    // Canvas transforms
    zoom: 1,
    panX: 0, panY: 0,
    // Interaction
    dragging: null,       // { compId, offX, offY }
    wiring: null,         // { fromCompId, fromPortIdx, fromIsOutput }
    isPanning: false,
    panStart: null,
    // Simulation
    running: false,
    simTimer: null,
    simSpeed: 5,          // Hz
    clockTick: 0,
    oscillationDetected: false,
    // Waveform
    waveHistory: [],      // [ { name, values:[] }, ... ]
    waveMaxSamples: 80,
    // Probed component ids
    probedIds: new Set(),
};

/* ========== DOM refs ========== */
const canvasArea = document.getElementById('canvasArea');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const waveCanvas = document.getElementById('waveCanvas');
const waveCtx = waveCanvas.getContext('2d');
const waveWrap = document.getElementById('waveWrap');
const waveEmpty = document.getElementById('waveEmpty');
const infoPanel = document.getElementById('infoPanel');
const zoomInfo = document.getElementById('zoomInfo');
const oscWarning = document.getElementById('oscWarning');
const ctxMenu = document.getElementById('ctxMenu');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const exampleSelect = document.getElementById('exampleSelect');

/* ========== Palette Setup ========== */
function buildPalette() {
    const container = document.getElementById('paletteContainer');
    container.innerHTML = '';
    COMP_CATEGORIES.forEach(cat => {
        const group = document.createElement('div');
        group.className = 'palette-group';
        const title = document.createElement('div');
        title.className = 'palette-group-title';
        title.innerHTML = `<span>${cat.name}</span><span class="arrow">&#9660;</span>`;
        title.addEventListener('click', () => group.classList.toggle('collapsed'));
        group.appendChild(title);

        const items = document.createElement('div');
        items.className = 'palette-items';
        cat.items.forEach(item => {
            const el = document.createElement('div');
            el.className = `palette-item ${cat.cssClass}`;
            el.dataset.type = item.type;
            el.innerHTML = `<span class="pi-icon">${item.shortLabel}</span><span>${item.label}</span>`;
            el.addEventListener('click', () => selectPaletteItem(item.type, el));
            items.appendChild(el);
        });
        group.appendChild(items);
        container.appendChild(group);
    });
}

function selectPaletteItem(type, el) {
    document.querySelectorAll('.palette-item.selected').forEach(e => e.classList.remove('selected'));
    if (state.selectedPaletteType === type) {
        state.selectedPaletteType = null;
        canvas.style.cursor = 'default';
    } else {
        state.selectedPaletteType = type;
        el.classList.add('selected');
        canvas.style.cursor = 'crosshair';
    }
}

/* ========== Component Creation ========== */
function getCompDef(type) {
    for (const cat of COMP_CATEGORIES) {
        for (const item of cat.items) {
            if (item.type === type) return item;
        }
    }
    return null;
}

function createComponent(type, x, y) {
    const def = getCompDef(type);
    if (!def) return null;
    const h = Math.max(COMP_H_BASE, Math.max(def.inputs, def.outputs) * 22 + 16);
    const comp = {
        id: state.nextId++,
        type: type,
        x: snapToGrid(x),
        y: snapToGrid(y),
        w: COMP_W,
        h: h,
        inputCount: def.inputs,
        outputCount: def.outputs,
        // Port values
        inputVals: new Array(def.inputs).fill(0),
        outputVals: new Array(def.outputs).fill(0),
        // State for stateful components
        internalState: {},
        label: def.shortLabel,
    };

    // Init internal state
    if (type === 'SWITCH') comp.internalState.on = false;
    if (type === 'CONST1') comp.outputVals[0] = 1;
    if (type === 'CLOCK') { comp.internalState.period = 2; comp.internalState.phase = 0; }
    if (type === 'DFF') { comp.internalState.Q = 0; comp.internalState.prevClk = 0; }
    if (type === 'SRLATCH') { comp.internalState.Q = 0; }
    if (type === 'LED') { comp.w = 50; comp.h = 50; }
    if (type === 'PROBE') { comp.w = 50; comp.h = 40; }

    return comp;
}

function snapToGrid(v) {
    return Math.round(v / GRID_SIZE) * GRID_SIZE;
}

/* ========== Port Positions ========== */
function getInputPorts(comp) {
    const ports = [];
    for (let i = 0; i < comp.inputCount; i++) {
        const spacing = comp.h / (comp.inputCount + 1);
        ports.push({ x: comp.x, y: comp.y + spacing * (i + 1), idx: i, isOutput: false, compId: comp.id });
    }
    return ports;
}

function getOutputPorts(comp) {
    const ports = [];
    for (let i = 0; i < comp.outputCount; i++) {
        const spacing = comp.h / (comp.outputCount + 1);
        ports.push({ x: comp.x + comp.w, y: comp.y + spacing * (i + 1), idx: i, isOutput: true, compId: comp.id });
    }
    return ports;
}

function getAllPorts(comp) {
    return [...getInputPorts(comp), ...getOutputPorts(comp)];
}

function findPortAt(wx, wy) {
    const threshold = PORT_R * 2.5;
    for (const comp of state.components) {
        for (const p of getAllPorts(comp)) {
            const dx = wx - p.x, dy = wy - p.y;
            if (Math.sqrt(dx * dx + dy * dy) < threshold) return p;
        }
    }
    return null;
}

/* ========== Component Finding ========== */
function findCompAt(wx, wy) {
    for (let i = state.components.length - 1; i >= 0; i--) {
        const c = state.components[i];
        if (wx >= c.x && wx <= c.x + c.w && wy >= c.y && wy <= c.y + c.h) return c;
    }
    return null;
}

function getCompById(id) {
    return state.components.find(c => c.id === id) || null;
}

/* ========== Wire Management ========== */
function addWire(fromCompId, fromPortIdx, toCompId, toPortIdx) {
    // Check no duplicate
    const exists = state.wires.some(w =>
        w.toCompId === toCompId && w.toPortIdx === toPortIdx
    );
    if (exists) return false;
    // No self-connection
    if (fromCompId === toCompId) return false;

    state.wires.push({ fromCompId, fromPortIdx, toCompId, toPortIdx });
    return true;
}

function removeWiresForComp(compId) {
    state.wires = state.wires.filter(w => w.fromCompId !== compId && w.toCompId !== compId);
}

/* ========== Coordinate Transforms ========== */
function screenToWorld(sx, sy) {
    const rect = canvas.getBoundingClientRect();
    const cx = sx - rect.left;
    const cy = sy - rect.top;
    return {
        x: (cx - state.panX) / state.zoom,
        y: (cy - state.panY) / state.zoom
    };
}

function worldToScreen(wx, wy) {
    return {
        x: wx * state.zoom + state.panX,
        y: wy * state.zoom + state.panY
    };
}

/* ========== Canvas Sizing ========== */
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvasArea.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
}

function resizeWaveCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = waveWrap.getBoundingClientRect();
    waveCanvas.width = rect.width * dpr;
    waveCanvas.height = rect.height * dpr;
    waveCanvas.style.width = rect.width + 'px';
    waveCanvas.style.height = rect.height + 'px';
    waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawWaveform();
}

/* ========== Drawing ========== */
function draw() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);

    // Grid dots
    drawGrid(w, h);

    ctx.save();
    ctx.translate(state.panX, state.panY);
    ctx.scale(state.zoom, state.zoom);

    // Draw wires
    state.wires.forEach(wire => drawWireOnCanvas(wire));

    // Draw wire being drawn
    if (state.wiring) {
        drawWiringPreview();
    }

    // Draw components
    state.components.forEach(comp => drawComponent(comp));

    ctx.restore();
}

function drawGrid(w, h) {
    const gridWorld = GRID_SIZE;
    const gridScreen = gridWorld * state.zoom;
    if (gridScreen < 5) return; // too small

    ctx.fillStyle = '#2a2a4a';
    const startX = state.panX % gridScreen;
    const startY = state.panY % gridScreen;

    for (let x = startX; x < w; x += gridScreen) {
        for (let y = startY; y < h; y += gridScreen) {
            ctx.beginPath();
            ctx.arc(x, y, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawComponent(comp) {
    const isSelected = comp.id === state.selectedCompId;
    const isProbed = state.probedIds.has(comp.id);

    // Glow for selected
    if (isSelected) {
        ctx.save();
        ctx.shadowColor = '#ffd740';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#ffd740';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(comp.x - 2, comp.y - 2, comp.w + 4, comp.h + 4, 8);
        ctx.stroke();
        ctx.restore();
    }

    // Probe indicator
    if (isProbed) {
        ctx.save();
        ctx.strokeStyle = '#ff80ab';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.roundRect(comp.x - 4, comp.y - 4, comp.w + 8, comp.h + 8, 10);
        ctx.stroke();
        ctx.restore();
    }

    // Component body
    const strokeColor = getCompStroke(comp.type);
    ctx.fillStyle = '#16213e';
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(comp.x, comp.y, comp.w, comp.h, 6);
    ctx.fill();
    ctx.stroke();

    // Draw type-specific content
    drawCompContent(comp);

    // Draw ports
    drawPorts(comp);
}

function getCompStroke(type) {
    if (['CONST0', 'CONST1', 'SWITCH', 'CLOCK'].includes(type)) return '#4fc3f7';
    if (['AND', 'OR', 'NOT', 'NAND', 'NOR', 'XOR', 'XNOR'].includes(type)) return '#b388ff';
    if (['MUX21', 'DEC24'].includes(type)) return '#ffab40';
    if (['DFF', 'SRLATCH'].includes(type)) return '#ce93d8';
    if (['LED', 'PROBE'].includes(type)) return '#16c79a';
    return '#4fc3f7';
}

function drawCompContent(comp) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = comp.x + comp.w / 2;
    const cy = comp.y + comp.h / 2;

    switch (comp.type) {
        case 'CONST0':
            ctx.font = 'bold 18px "JetBrains Mono", monospace';
            ctx.fillStyle = C.low;
            ctx.fillText('0', cx, cy);
            break;
        case 'CONST1':
            ctx.font = 'bold 18px "JetBrains Mono", monospace';
            ctx.fillStyle = C.high;
            ctx.fillText('1', cx, cy);
            break;
        case 'SWITCH':
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = C.textSec;
            ctx.fillText('SW', cx, cy - 8);
            // Draw toggle indicator
            const on = comp.internalState.on;
            ctx.fillStyle = on ? C.high : C.low;
            ctx.beginPath();
            ctx.roundRect(cx - 14, cy + 2, 28, 14, 7);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(on ? cx + 8 : cx - 8, cy + 9, 5, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'CLOCK':
            ctx.font = 'bold 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#4fc3f7';
            ctx.fillText('CLK', cx, cy - 6);
            // Mini waveform
            ctx.strokeStyle = '#4fc3f7';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const ww = 30, wh = 8;
            ctx.moveTo(cx - ww/2, cy + 10);
            for (let i = 0; i < 3; i++) {
                const bx = cx - ww/2 + i * (ww/3);
                ctx.lineTo(bx, cy + 10 - wh);
                ctx.lineTo(bx + ww/6, cy + 10 - wh);
                ctx.lineTo(bx + ww/6, cy + 10);
                ctx.lineTo(bx + ww/3, cy + 10);
            }
            ctx.stroke();
            break;
        case 'AND':
            drawGateSymbol(ctx, comp, 'AND');
            break;
        case 'OR':
            drawGateSymbol(ctx, comp, 'OR');
            break;
        case 'NOT':
            drawGateSymbol(ctx, comp, 'NOT');
            break;
        case 'NAND':
            drawGateSymbol(ctx, comp, 'NAND');
            break;
        case 'NOR':
            drawGateSymbol(ctx, comp, 'NOR');
            break;
        case 'XOR':
            drawGateSymbol(ctx, comp, 'XOR');
            break;
        case 'XNOR':
            drawGateSymbol(ctx, comp, 'XNOR');
            break;
        case 'MUX21':
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffab40';
            ctx.fillText('MUX', cx, cy - 4);
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = C.textMut;
            ctx.fillText('2:1', cx, cy + 10);
            // Port labels
            ctx.textAlign = 'left';
            ctx.font = '8px "JetBrains Mono", monospace';
            const mPorts = getInputPorts(comp);
            if (mPorts[0]) ctx.fillText('D0', comp.x + 3, mPorts[0].y);
            if (mPorts[1]) ctx.fillText('D1', comp.x + 3, mPorts[1].y);
            if (mPorts[2]) ctx.fillText('S', comp.x + 3, mPorts[2].y);
            break;
        case 'DEC24':
            ctx.font = 'bold 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffab40';
            ctx.fillText('DEC', cx, cy - 4);
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = C.textMut;
            ctx.fillText('2→4', cx, cy + 10);
            break;
        case 'DFF':
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ce93d8';
            ctx.fillText('D-FF', cx, cy - 6);
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = C.textMut;
            ctx.fillText('Q=' + comp.internalState.Q, cx, cy + 10);
            // Port labels
            ctx.textAlign = 'left';
            ctx.font = '8px "JetBrains Mono", monospace';
            const dPorts = getInputPorts(comp);
            if (dPorts[0]) ctx.fillText('D', comp.x + 3, dPorts[0].y);
            if (dPorts[1]) ctx.fillText('CLK', comp.x + 3, dPorts[1].y);
            ctx.textAlign = 'right';
            const doPorts = getOutputPorts(comp);
            if (doPorts[0]) ctx.fillText('Q', comp.x + comp.w - 3, doPorts[0].y);
            if (doPorts[1]) ctx.fillText("Q'", comp.x + comp.w - 3, doPorts[1].y);
            // Clock triangle
            if (dPorts[1]) {
                ctx.strokeStyle = '#ce93d8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(comp.x, dPorts[1].y - 4);
                ctx.lineTo(comp.x + 6, dPorts[1].y);
                ctx.lineTo(comp.x, dPorts[1].y + 4);
                ctx.stroke();
            }
            break;
        case 'SRLATCH':
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ce93d8';
            ctx.fillText('SR', cx, cy - 6);
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = C.textMut;
            ctx.fillText('Q=' + comp.internalState.Q, cx, cy + 10);
            // Port labels
            ctx.textAlign = 'left';
            ctx.font = '8px "JetBrains Mono", monospace';
            const sPorts = getInputPorts(comp);
            if (sPorts[0]) ctx.fillText('S', comp.x + 3, sPorts[0].y);
            if (sPorts[1]) ctx.fillText('R', comp.x + 3, sPorts[1].y);
            ctx.textAlign = 'right';
            const soPorts = getOutputPorts(comp);
            if (soPorts[0]) ctx.fillText('Q', comp.x + comp.w - 3, soPorts[0].y);
            if (soPorts[1]) ctx.fillText("Q'", comp.x + comp.w - 3, soPorts[1].y);
            break;
        case 'LED':
            const ledOn = comp.inputVals[0] === 1;
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fillStyle = ledOn ? '#16c79a' : '#333';
            ctx.fill();
            if (ledOn) {
                ctx.save();
                ctx.shadowColor = '#16c79a';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.strokeStyle = ledOn ? '#16c79a' : '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.stroke();
            break;
        case 'PROBE':
            ctx.font = 'bold 14px "JetBrains Mono", monospace';
            ctx.fillStyle = comp.inputVals[0] ? C.high : C.low;
            ctx.fillText(comp.inputVals[0] ? '1' : '0', cx, cy);
            break;
    }
    ctx.restore();
}

function drawGateSymbol(ctx, comp, type) {
    const cx = comp.x + comp.w / 2;
    const cy = comp.y + comp.h / 2;
    const sw = 26, sh = 18;
    const isNot = type === 'NOT' || type === 'NAND' || type === 'NOR' || type === 'XNOR';

    ctx.save();
    ctx.strokeStyle = getCompStroke(comp.type);
    ctx.lineWidth = 1.5;
    ctx.fillStyle = 'transparent';

    if (type === 'AND' || type === 'NAND') {
        ctx.beginPath();
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.lineTo(cx, cy - sh/2);
        ctx.arc(cx, cy, sh/2, -Math.PI/2, Math.PI/2);
        ctx.lineTo(cx - sw/2, cy + sh/2);
        ctx.closePath();
        ctx.stroke();
    } else if (type === 'OR' || type === 'NOR') {
        ctx.beginPath();
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.quadraticCurveTo(cx - sw/4, cy, cx - sw/2, cy + sh/2);
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.quadraticCurveTo(cx + sw/3, cy - sh/2, cx + sw/2, cy);
        ctx.quadraticCurveTo(cx + sw/3, cy + sh/2, cx - sw/2, cy + sh/2);
        ctx.stroke();
    } else if (type === 'XOR' || type === 'XNOR') {
        ctx.beginPath();
        ctx.moveTo(cx - sw/2 - 4, cy - sh/2);
        ctx.quadraticCurveTo(cx - sw/4 - 4, cy, cx - sw/2 - 4, cy + sh/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.quadraticCurveTo(cx - sw/4, cy, cx - sw/2, cy + sh/2);
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.quadraticCurveTo(cx + sw/3, cy - sh/2, cx + sw/2, cy);
        ctx.quadraticCurveTo(cx + sw/3, cy + sh/2, cx - sw/2, cy + sh/2);
        ctx.stroke();
    } else if (type === 'NOT') {
        ctx.beginPath();
        ctx.moveTo(cx - sw/2, cy - sh/2);
        ctx.lineTo(cx + sw/3, cy);
        ctx.lineTo(cx - sw/2, cy + sh/2);
        ctx.closePath();
        ctx.stroke();
    }

    // Bubble for NOT variants
    if (isNot) {
        ctx.beginPath();
        const bx = type === 'NOT' ? cx + sw/3 + 4 : cx + sw/2 + 4;
        ctx.arc(bx, cy, 3, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Label below symbol
    ctx.font = 'bold 8px "JetBrains Mono", monospace';
    ctx.fillStyle = C.textMut;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(type, cx, comp.y + comp.h - 12);
    ctx.restore();
}

function drawPorts(comp) {
    const inputs = getInputPorts(comp);
    const outputs = getOutputPorts(comp);

    inputs.forEach((p, i) => {
        const val = comp.inputVals[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, PORT_R, 0, Math.PI * 2);
        ctx.fillStyle = val ? '#16c79a' : '#2a2a4a';
        ctx.fill();
        ctx.strokeStyle = val ? '#16c79a' : '#4fc3f7';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });

    outputs.forEach((p, i) => {
        const val = comp.outputVals[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, PORT_R, 0, Math.PI * 2);
        ctx.fillStyle = val ? '#16c79a' : '#2a2a4a';
        ctx.fill();
        ctx.strokeStyle = val ? '#16c79a' : '#b388ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });
}

function drawWireOnCanvas(wire) {
    const fromComp = getCompById(wire.fromCompId);
    const toComp = getCompById(wire.toCompId);
    if (!fromComp || !toComp) return;

    const fromPorts = getOutputPorts(fromComp);
    const toPorts = getInputPorts(toComp);
    const fp = fromPorts[wire.fromPortIdx];
    const tp = toPorts[wire.toPortIdx];
    if (!fp || !tp) return;

    const val = fromComp.outputVals[wire.fromPortIdx];
    ctx.strokeStyle = val ? '#16c79a' : '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Manhattan routing
    ctx.beginPath();
    ctx.moveTo(fp.x, fp.y);
    const midX = (fp.x + tp.x) / 2;
    ctx.lineTo(midX, fp.y);
    ctx.lineTo(midX, tp.y);
    ctx.lineTo(tp.x, tp.y);
    ctx.stroke();
}

function drawWiringPreview() {
    const w = state.wiring;
    const comp = getCompById(w.fromCompId);
    if (!comp) return;

    let port;
    if (w.fromIsOutput) {
        port = getOutputPorts(comp)[w.fromPortIdx];
    } else {
        port = getInputPorts(comp)[w.fromPortIdx];
    }
    if (!port) return;

    ctx.save();
    ctx.strokeStyle = '#ffd740';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);

    // Convert mouse to world coords (already in world if stored)
    const mx = state.wiringMouseX || port.x;
    const my = state.wiringMouseY || port.y;

    ctx.beginPath();
    ctx.moveTo(port.x, port.y);
    const midX = (port.x + mx) / 2;
    ctx.lineTo(midX, port.y);
    ctx.lineTo(midX, my);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.restore();
}

/* ========== Simulation Engine ========== */
function evaluateComponent(comp) {
    switch (comp.type) {
        case 'CONST0':
            comp.outputVals[0] = 0;
            break;
        case 'CONST1':
            comp.outputVals[0] = 1;
            break;
        case 'SWITCH':
            comp.outputVals[0] = comp.internalState.on ? 1 : 0;
            break;
        case 'CLOCK':
            // Clock toggles each tick based on period
            comp.outputVals[0] = comp.internalState.phase % comp.internalState.period < (comp.internalState.period / 2) ? 1 : 0;
            break;
        case 'AND':
            comp.outputVals[0] = (comp.inputVals[0] & comp.inputVals[1]) ? 1 : 0;
            break;
        case 'OR':
            comp.outputVals[0] = (comp.inputVals[0] | comp.inputVals[1]) ? 1 : 0;
            break;
        case 'NOT':
            comp.outputVals[0] = comp.inputVals[0] ? 0 : 1;
            break;
        case 'NAND':
            comp.outputVals[0] = (comp.inputVals[0] & comp.inputVals[1]) ? 0 : 1;
            break;
        case 'NOR':
            comp.outputVals[0] = (comp.inputVals[0] | comp.inputVals[1]) ? 0 : 1;
            break;
        case 'XOR':
            comp.outputVals[0] = comp.inputVals[0] !== comp.inputVals[1] ? 1 : 0;
            break;
        case 'XNOR':
            comp.outputVals[0] = comp.inputVals[0] === comp.inputVals[1] ? 1 : 0;
            break;
        case 'MUX21':
            // inputs: D0, D1, S
            comp.outputVals[0] = comp.inputVals[2] ? comp.inputVals[1] : comp.inputVals[0];
            break;
        case 'DEC24':
            // inputs: A1, A0 → outputs: Y0, Y1, Y2, Y3
            {
                const addr = (comp.inputVals[0] << 1) | comp.inputVals[1];
                for (let i = 0; i < 4; i++) {
                    comp.outputVals[i] = (addr === i) ? 1 : 0;
                }
            }
            break;
        case 'DFF':
            // inputs: D, CLK
            {
                const clk = comp.inputVals[1];
                const prevClk = comp.internalState.prevClk || 0;
                // Rising edge detect
                if (clk === 1 && prevClk === 0) {
                    comp.internalState.Q = comp.inputVals[0];
                }
                comp.internalState.prevClk = clk;
                comp.outputVals[0] = comp.internalState.Q;
                comp.outputVals[1] = comp.internalState.Q ? 0 : 1;
            }
            break;
        case 'SRLATCH':
            // inputs: S, R
            {
                const S = comp.inputVals[0];
                const R = comp.inputVals[1];
                if (S === 1 && R === 0) comp.internalState.Q = 1;
                else if (S === 0 && R === 1) comp.internalState.Q = 0;
                // S=1,R=1 is invalid, keep previous
                // S=0,R=0 holds state
                comp.outputVals[0] = comp.internalState.Q;
                comp.outputVals[1] = comp.internalState.Q ? 0 : 1;
            }
            break;
        case 'LED':
            // LED just reflects input
            break;
        case 'PROBE':
            // Probe just reflects input
            break;
    }
}

function propagate() {
    // Reset all input values first (driven by wires)
    state.components.forEach(comp => {
        for (let i = 0; i < comp.inputCount; i++) {
            comp.inputVals[i] = 0;
        }
    });

    // Drive inputs from wires
    state.wires.forEach(wire => {
        const from = getCompById(wire.fromCompId);
        const to = getCompById(wire.toCompId);
        if (from && to) {
            to.inputVals[wire.toPortIdx] = from.outputVals[wire.fromPortIdx];
        }
    });

    // Evaluate all components (iterate for convergence)
    const MAX_ITER = 20;
    let changed = true;
    let iter = 0;

    while (changed && iter < MAX_ITER) {
        changed = false;
        iter++;

        state.components.forEach(comp => {
            const prevOutputs = [...comp.outputVals];
            evaluateComponent(comp);

            // Check if any output changed
            for (let i = 0; i < comp.outputVals.length; i++) {
                if (comp.outputVals[i] !== prevOutputs[i]) {
                    changed = true;
                }
            }

            // Re-drive inputs from wires after each eval
            state.wires.forEach(wire => {
                const from = getCompById(wire.fromCompId);
                const to = getCompById(wire.toCompId);
                if (from && to) {
                    to.inputVals[wire.toPortIdx] = from.outputVals[wire.fromPortIdx];
                }
            });
        });
    }

    state.oscillationDetected = (iter >= MAX_ITER && changed);
    oscWarning.classList.toggle('show', state.oscillationDetected);
}

function simStep() {
    // Advance clocks
    state.components.forEach(comp => {
        if (comp.type === 'CLOCK') {
            comp.internalState.phase++;
        }
    });
    state.clockTick++;

    propagate();
    recordWaveform();
    draw();
    drawWaveform();
}

function startSim() {
    if (state.running) return;
    state.running = true;
    document.getElementById('btnRun').textContent = '暂停';
    document.getElementById('btnRun').classList.add('running');
    scheduleSimTick();
}

function stopSim() {
    state.running = false;
    document.getElementById('btnRun').textContent = '运行';
    document.getElementById('btnRun').classList.remove('running');
    if (state.simTimer) { clearTimeout(state.simTimer); state.simTimer = null; }
}

function scheduleSimTick() {
    if (!state.running) return;
    const interval = 1000 / state.simSpeed;
    state.simTimer = setTimeout(() => {
        simStep();
        scheduleSimTick();
    }, interval);
}

function resetSim() {
    stopSim();
    state.clockTick = 0;
    state.oscillationDetected = false;
    oscWarning.classList.remove('show');
    state.components.forEach(comp => {
        comp.inputVals.fill(0);
        comp.outputVals.fill(0);
        if (comp.type === 'CONST1') comp.outputVals[0] = 1;
        if (comp.type === 'SWITCH') {
            comp.internalState.on = false;
            comp.outputVals[0] = 0;
        }
        if (comp.type === 'CLOCK') {
            comp.internalState.phase = 0;
        }
        if (comp.type === 'DFF') {
            comp.internalState.Q = 0;
            comp.internalState.prevClk = 0;
        }
        if (comp.type === 'SRLATCH') {
            comp.internalState.Q = 0;
        }
    });
    state.waveHistory = [];
    state.probedIds.forEach(id => {
        const comp = getCompById(id);
        if (comp) {
            state.waveHistory.push({ name: comp.label + '#' + comp.id, compId: id, values: [] });
        }
    });
    propagate();
    draw();
    drawWaveform();
    updateInfoPanel();
}

/* ========== Waveform ========== */
function recordWaveform() {
    state.waveHistory.forEach(entry => {
        const comp = getCompById(entry.compId);
        if (!comp) return;
        // Record first output value or first input for output-type components
        let val;
        if (comp.outputCount > 0) {
            val = comp.outputVals[0];
        } else {
            val = comp.inputVals[0];
        }
        entry.values.push(val);
        if (entry.values.length > state.waveMaxSamples) {
            entry.values.shift();
        }
    });
}

function drawWaveform() {
    const dpr = window.devicePixelRatio || 1;
    const rect = waveWrap.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;

    waveCtx.clearRect(0, 0, w, h);

    const visibleEntries = state.waveHistory.filter(e => e.values.length > 0);
    waveEmpty.style.display = visibleEntries.length === 0 ? 'block' : 'none';

    if (visibleEntries.length === 0) return;

    const colors = ['#4fc3f7', '#16c79a', '#b388ff', '#ffab40'];
    const rowH = Math.min(22, (h - 4) / visibleEntries.length);
    const labelW = 40;
    const waveW = w - labelW - 8;

    visibleEntries.forEach((entry, idx) => {
        const y = 2 + idx * rowH;
        const color = colors[idx % colors.length];
        const waveH = rowH - 4;

        // Label
        waveCtx.font = '9px "JetBrains Mono", monospace';
        waveCtx.fillStyle = color;
        waveCtx.textAlign = 'right';
        waveCtx.textBaseline = 'middle';
        waveCtx.fillText(entry.name.substring(0, 6), labelW - 2, y + rowH / 2);

        // Waveform
        const stepW = waveW / state.waveMaxSamples;
        waveCtx.strokeStyle = color;
        waveCtx.lineWidth = 1.5;
        waveCtx.beginPath();

        entry.values.forEach((val, i) => {
            const sx = labelW + i * stepW;
            const sy = val ? y + 2 : y + waveH;
            if (i === 0) {
                waveCtx.moveTo(sx, sy);
            } else {
                const prevVal = entry.values[i - 1];
                const prevY = prevVal ? y + 2 : y + waveH;
                if (prevY !== sy) {
                    waveCtx.lineTo(sx, prevY);
                }
                waveCtx.lineTo(sx, sy);
            }
        });
        waveCtx.stroke();
    });
}

function toggleProbe(compId) {
    if (state.probedIds.has(compId)) {
        state.probedIds.delete(compId);
        state.waveHistory = state.waveHistory.filter(e => e.compId !== compId);
    } else {
        if (state.probedIds.size >= 4) return; // Max 4 probes
        state.probedIds.add(compId);
        const comp = getCompById(compId);
        if (comp) {
            state.waveHistory.push({ name: comp.label + '#' + comp.id, compId: compId, values: [] });
        }
    }
    draw();
    drawWaveform();
}

/* ========== Info Panel ========== */
function updateInfoPanel() {
    const comp = state.selectedCompId ? getCompById(state.selectedCompId) : null;
    if (!comp) {
        infoPanel.innerHTML = '<div class="info-empty">点击组件查看属性</div>';
        return;
    }

    let html = `<h4>${getCompDef(comp.type)?.label || comp.type}</h4>`;
    html += '<div class="info-props">';
    html += `<div class="prop-row"><span class="prop-key">ID</span><span class="prop-val">#${comp.id}</span></div>`;
    html += `<div class="prop-row"><span class="prop-key">类型</span><span class="prop-val">${comp.type}</span></div>`;
    html += `<div class="prop-row"><span class="prop-key">位置</span><span class="prop-val">(${comp.x}, ${comp.y})</span></div>`;

    // Output values
    comp.outputVals.forEach((v, i) => {
        html += `<div class="prop-row"><span class="prop-key">输出 ${i}</span><span class="prop-val">${v}</span></div>`;
    });

    // Component-specific info
    if (comp.type === 'DFF') {
        html += `<div class="prop-row"><span class="prop-key">Q</span><span class="prop-val">${comp.internalState.Q}</span></div>`;
        html += `<div class="prop-row"><span class="prop-key">上一CLK</span><span class="prop-val">${comp.internalState.prevClk}</span></div>`;
    }
    if (comp.type === 'SRLATCH') {
        html += `<div class="prop-row"><span class="prop-key">Q</span><span class="prop-val">${comp.internalState.Q}</span></div>`;
    }
    if (comp.type === 'CLOCK') {
        html += `<div class="prop-row"><span class="prop-key">周期</span><span class="prop-val">${comp.internalState.period}</span></div>`;
        html += `<div class="prop-row"><span class="prop-key">相位</span><span class="prop-val">${comp.internalState.phase}</span></div>`;
    }
    html += '</div>';

    // Truth table for gates
    const gateTruthTables = {
        'AND':  { inputs: ['A','B'], fn: (a,b) => a & b },
        'OR':   { inputs: ['A','B'], fn: (a,b) => a | b },
        'NOT':  { inputs: ['A'], fn: (a) => a ? 0 : 1 },
        'NAND': { inputs: ['A','B'], fn: (a,b) => (a & b) ? 0 : 1 },
        'NOR':  { inputs: ['A','B'], fn: (a,b) => (a | b) ? 0 : 1 },
        'XOR':  { inputs: ['A','B'], fn: (a,b) => a !== b ? 1 : 0 },
        'XNOR': { inputs: ['A','B'], fn: (a,b) => a === b ? 1 : 0 },
    };

    if (gateTruthTables[comp.type]) {
        const tt = gateTruthTables[comp.type];
        html += '<div class="info-truth-table"><table>';
        html += '<tr>' + tt.inputs.map(n => `<th>${n}</th>`).join('') + '<th>Y</th></tr>';

        const numInputs = tt.inputs.length;
        const rows = 1 << numInputs;
        for (let r = 0; r < rows; r++) {
            html += '<tr>';
            const vals = [];
            for (let b = numInputs - 1; b >= 0; b--) {
                const v = (r >> b) & 1;
                vals.push(v);
                html += `<td class="${v ? 'v1' : 'v0'}">${v}</td>`;
            }
            const out = tt.fn(...vals);
            html += `<td class="${out ? 'v1' : 'v0'}">${out}</td>`;
            html += '</tr>';
        }
        html += '</table></div>';
    }

    infoPanel.innerHTML = html;
}

/* ========== Mouse Events ========== */
let mouseWorldX = 0, mouseWorldY = 0;

canvas.addEventListener('mousedown', (e) => {
    hideCtxMenu();
    const w = screenToWorld(e.clientX, e.clientY);
    mouseWorldX = w.x;
    mouseWorldY = w.y;

    // Middle button: pan
    if (e.button === 1) {
        e.preventDefault();
        state.isPanning = true;
        state.panStart = { x: e.clientX, y: e.clientY, px: state.panX, py: state.panY };
        canvas.style.cursor = 'grabbing';
        return;
    }

    // Right button: context menu (handled in contextmenu event)
    if (e.button === 2) return;

    // Left button
    if (e.button === 0) {
        // Check if clicking a port
        const port = findPortAt(w.x, w.y);
        if (port) {
            if (state.wiring) {
                // Complete wiring
                completeWiring(port);
            } else {
                // Start wiring
                state.wiring = {
                    fromCompId: port.compId,
                    fromPortIdx: port.idx,
                    fromIsOutput: port.isOutput,
                };
                state.wiringMouseX = w.x;
                state.wiringMouseY = w.y;
            }
            draw();
            return;
        }

        // Cancel wiring if clicking elsewhere
        if (state.wiring) {
            state.wiring = null;
            draw();
            return;
        }

        // Check if clicking a component
        const comp = findCompAt(w.x, w.y);
        if (comp) {
            // Toggle switch on click
            if (comp.type === 'SWITCH') {
                comp.internalState.on = !comp.internalState.on;
                comp.outputVals[0] = comp.internalState.on ? 1 : 0;
                propagate();
            }
            state.selectedCompId = comp.id;
            state.dragging = {
                compId: comp.id,
                offX: w.x - comp.x,
                offY: w.y - comp.y,
                startX: comp.x,
                startY: comp.y,
                moved: false,
            };
            updateInfoPanel();
            draw();
            return;
        }

        // Clicking empty space: place component or deselect
        if (state.selectedPaletteType) {
            const newComp = createComponent(state.selectedPaletteType, w.x - COMP_W/2, w.y - COMP_H_BASE/2);
            if (newComp) {
                state.components.push(newComp);
                state.selectedCompId = newComp.id;
                propagate();
                updateInfoPanel();
                saveToLocalStorage();
                draw();
            }
            return;
        }

        // Deselect
        state.selectedCompId = null;
        updateInfoPanel();
        draw();
    }
});

canvas.addEventListener('mousemove', (e) => {
    const w = screenToWorld(e.clientX, e.clientY);
    mouseWorldX = w.x;
    mouseWorldY = w.y;

    if (state.isPanning && state.panStart) {
        state.panX = state.panStart.px + (e.clientX - state.panStart.x);
        state.panY = state.panStart.py + (e.clientY - state.panStart.y);
        draw();
        return;
    }

    if (state.wiring) {
        state.wiringMouseX = w.x;
        state.wiringMouseY = w.y;
        draw();
        return;
    }

    if (state.dragging) {
        const comp = getCompById(state.dragging.compId);
        if (comp) {
            const newX = snapToGrid(w.x - state.dragging.offX);
            const newY = snapToGrid(w.y - state.dragging.offY);
            if (newX !== comp.x || newY !== comp.y) {
                state.dragging.moved = true;
                comp.x = newX;
                comp.y = newY;
                draw();
            }
        }
        return;
    }

    // Hover cursor feedback
    const port = findPortAt(w.x, w.y);
    if (port) {
        canvas.style.cursor = 'pointer';
        return;
    }
    const comp = findCompAt(w.x, w.y);
    if (comp) {
        canvas.style.cursor = state.selectedPaletteType ? 'crosshair' : 'move';
        return;
    }
    canvas.style.cursor = state.selectedPaletteType ? 'crosshair' : 'default';
});

canvas.addEventListener('mouseup', (e) => {
    if (state.isPanning) {
        state.isPanning = false;
        state.panStart = null;
        canvas.style.cursor = state.selectedPaletteType ? 'crosshair' : 'default';
        return;
    }
    if (state.dragging) {
        if (state.dragging.moved) {
            saveToLocalStorage();
        }
        state.dragging = null;
    }
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const newZoom = Math.max(0.2, Math.min(5, state.zoom * factor));

    // Zoom toward mouse
    state.panX = mx - (mx - state.panX) * (newZoom / state.zoom);
    state.panY = my - (my - state.panY) * (newZoom / state.zoom);
    state.zoom = newZoom;

    zoomInfo.textContent = Math.round(state.zoom * 100) + '%';
    draw();
}, { passive: false });

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const w = screenToWorld(e.clientX, e.clientY);
    const comp = findCompAt(w.x, w.y);
    if (comp) {
        state.selectedCompId = comp.id;
        updateInfoPanel();
        draw();
        showCtxMenu(e.clientX, e.clientY, comp);
    }
});

function completeWiring(targetPort) {
    const w = state.wiring;
    if (!w) return;

    // Determine from (output) and to (input)
    let fromCompId, fromPortIdx, toCompId, toPortIdx;

    if (w.fromIsOutput && !targetPort.isOutput) {
        fromCompId = w.fromCompId;
        fromPortIdx = w.fromPortIdx;
        toCompId = targetPort.compId;
        toPortIdx = targetPort.idx;
    } else if (!w.fromIsOutput && targetPort.isOutput) {
        fromCompId = targetPort.compId;
        fromPortIdx = targetPort.idx;
        toCompId = w.fromCompId;
        toPortIdx = w.fromPortIdx;
    } else {
        // Invalid: both same direction
        state.wiring = null;
        return;
    }

    if (addWire(fromCompId, fromPortIdx, toCompId, toPortIdx)) {
        propagate();
        saveToLocalStorage();
    }
    state.wiring = null;
}

/* ========== Context Menu ========== */
function showCtxMenu(x, y, comp) {
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top = y + 'px';
    ctxMenu.classList.add('show');
    ctxMenu._compId = comp.id;
}

function hideCtxMenu() {
    ctxMenu.classList.remove('show');
}

ctxMenu.addEventListener('click', (e) => {
    const action = e.target.dataset.action;
    const compId = ctxMenu._compId;
    if (!action || !compId) return;

    if (action === 'delete') {
        deleteComponent(compId);
    } else if (action === 'duplicate') {
        duplicateComponent(compId);
    } else if (action === 'probe') {
        toggleProbe(compId);
    }
    hideCtxMenu();
});

document.addEventListener('click', (e) => {
    if (!ctxMenu.contains(e.target)) hideCtxMenu();
});

function deleteComponent(compId) {
    state.components = state.components.filter(c => c.id !== compId);
    removeWiresForComp(compId);
    state.probedIds.delete(compId);
    state.waveHistory = state.waveHistory.filter(e => e.compId !== compId);
    if (state.selectedCompId === compId) {
        state.selectedCompId = null;
        updateInfoPanel();
    }
    propagate();
    saveToLocalStorage();
    draw();
    drawWaveform();
}

function duplicateComponent(compId) {
    const orig = getCompById(compId);
    if (!orig) return;
    const newComp = createComponent(orig.type, orig.x + 40, orig.y + 40);
    if (newComp) {
        state.components.push(newComp);
        propagate();
        saveToLocalStorage();
        draw();
    }
}

/* ========== Keyboard ========== */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' || e.key === 'Backspace') {
        if (state.selectedCompId && document.activeElement === document.body) {
            e.preventDefault();
            deleteComponent(state.selectedCompId);
        }
    }
    if (e.key === 'Escape') {
        state.selectedPaletteType = null;
        state.wiring = null;
        document.querySelectorAll('.palette-item.selected').forEach(el => el.classList.remove('selected'));
        canvas.style.cursor = 'default';
        draw();
    }
});

function setZoom(z) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const newZoom = Math.max(0.2, Math.min(5, z));
    state.panX = cx - (cx - state.panX) * (newZoom / state.zoom);
    state.panY = cy - (cy - state.panY) * (newZoom / state.zoom);
    state.zoom = newZoom;
    zoomInfo.textContent = Math.round(state.zoom * 100) + '%';
    draw();
}

function fitToView() {
    if (state.components.length === 0) {
        state.zoom = 1;
        state.panX = 0;
        state.panY = 0;
        zoomInfo.textContent = '100%';
        draw();
        return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.components.forEach(c => {
        minX = Math.min(minX, c.x);
        minY = Math.min(minY, c.y);
        maxX = Math.max(maxX, c.x + c.w);
        maxY = Math.max(maxY, c.y + c.h);
    });
    const rect = canvas.getBoundingClientRect();
    const padding = 60;
    const cw = maxX - minX + padding * 2;
    const ch = maxY - minY + padding * 2;
    const zoom = Math.min(rect.width / cw, rect.height / ch, 2);
    state.zoom = zoom;
    state.panX = (rect.width - cw * zoom) / 2 - (minX - padding) * zoom;
    state.panY = (rect.height - ch * zoom) / 2 - (minY - padding) * zoom;
    zoomInfo.textContent = Math.round(state.zoom * 100) + '%';
    draw();
}

/* ========== Example Circuits ========== */
exampleSelect.addEventListener('change', () => {
    const val = exampleSelect.value;
    if (!val) return;
    loadExample(val);
    exampleSelect.value = '';
});

function loadExample(name) {
    // Clear
    state.components = [];
    state.wires = [];
    state.selectedCompId = null;
    state.probedIds.clear();
    state.waveHistory = [];
    state.oscillationDetected = false;
    oscWarning.classList.remove('show');

    switch (name) {
        case 'sr-latch':
            buildSRLatch();
            break;
        case 'half-adder':
            buildHalfAdder();
            break;
        case 'counter-2bit':
            build2BitCounter();
            break;
        case 'majority':
            buildMajorityVoter();
            break;
    }

    propagate();
    saveToLocalStorage();
    updateInfoPanel();
    fitToView();
    drawWaveform();
}

function buildSRLatch() {
    const sw1 = createComponent('SWITCH', 100, 100);
    sw1.label = 'S'; state.components.push(sw1);
    const sw2 = createComponent('SWITCH', 100, 220);
    sw2.label = 'R'; state.components.push(sw2);

    const sr = createComponent('SRLATCH', 280, 140);
    state.components.push(sr);

    const led1 = createComponent('LED', 440, 130);
    state.components.push(led1);
    const led2 = createComponent('LED', 440, 210);
    state.components.push(led2);

    addWire(sw1.id, 0, sr.id, 0); // S
    addWire(sw2.id, 0, sr.id, 1); // R
    addWire(sr.id, 0, led1.id, 0); // Q
    addWire(sr.id, 1, led2.id, 0); // Q'
}

function buildHalfAdder() {
    const sw1 = createComponent('SWITCH', 100, 100);
    sw1.label = 'A'; state.components.push(sw1);
    const sw2 = createComponent('SWITCH', 100, 220);
    sw2.label = 'B'; state.components.push(sw2);

    const xorG = createComponent('XOR', 280, 80);
    state.components.push(xorG);
    const andG = createComponent('AND', 280, 220);
    state.components.push(andG);

    const ledSum = createComponent('LED', 440, 80);
    state.components.push(ledSum);
    const ledCarry = createComponent('LED', 440, 220);
    state.components.push(ledCarry);

    const probe1 = createComponent('PROBE', 440, 140);
    probe1.label = 'Sum'; state.components.push(probe1);
    const probe2 = createComponent('PROBE', 440, 280);
    probe2.label = 'Carry'; state.components.push(probe2);

    addWire(sw1.id, 0, xorG.id, 0);
    addWire(sw2.id, 0, xorG.id, 1);
    addWire(sw1.id, 0, andG.id, 0);
    addWire(sw2.id, 0, andG.id, 1);
    addWire(xorG.id, 0, ledSum.id, 0);
    addWire(andG.id, 0, ledCarry.id, 0);
    addWire(xorG.id, 0, probe1.id, 0);
    addWire(andG.id, 0, probe2.id, 0);

    // Auto-probe the probes
    toggleProbe(probe1.id);
    toggleProbe(probe2.id);
}

function build2BitCounter() {
    const clk = createComponent('CLOCK', 60, 160);
    state.components.push(clk);

    // First DFF (bit 0) - T flip-flop by wiring Q' back to D
    const dff0 = createComponent('DFF', 220, 100);
    state.components.push(dff0);

    // Second DFF (bit 1)
    const dff1 = createComponent('DFF', 220, 240);
    state.components.push(dff1);

    // NOT gate to get inverted output for T-FF behavior
    const not0 = createComponent('NOT', 380, 100);
    state.components.push(not0);
    const not1 = createComponent('NOT', 380, 240);
    state.components.push(not1);

    const led0 = createComponent('LED', 500, 100);
    state.components.push(led0);
    const led1 = createComponent('LED', 500, 240);
    state.components.push(led1);

    const probe0 = createComponent('PROBE', 500, 160);
    probe0.label = 'Q0'; state.components.push(probe0);
    const probe1 = createComponent('PROBE', 500, 300);
    probe1.label = 'Q1'; state.components.push(probe1);

    // Clock to both DFFs
    addWire(clk.id, 0, dff0.id, 1);

    // DFF0 Q -> NOT0 -> DFF0 D (T-FF behavior)
    addWire(dff0.id, 0, not0.id, 0);
    addWire(not0.id, 0, dff0.id, 0);

    // DFF0 Q' (output 1) -> DFF1 CLK
    addWire(dff0.id, 1, dff1.id, 1);

    // DFF1 Q -> NOT1 -> DFF1 D (T-FF behavior)
    addWire(dff1.id, 0, not1.id, 0);
    addWire(not1.id, 0, dff1.id, 0);

    // Outputs
    addWire(dff0.id, 0, led0.id, 0);
    addWire(dff1.id, 0, led1.id, 0);
    addWire(dff0.id, 0, probe0.id, 0);
    addWire(dff1.id, 0, probe1.id, 0);

    toggleProbe(probe0.id);
    toggleProbe(probe1.id);
}

function buildMajorityVoter() {
    const sw1 = createComponent('SWITCH', 60, 60);
    sw1.label = 'A'; state.components.push(sw1);
    const sw2 = createComponent('SWITCH', 60, 180);
    sw2.label = 'B'; state.components.push(sw2);
    const sw3 = createComponent('SWITCH', 60, 300);
    sw3.label = 'C'; state.components.push(sw3);

    // Majority = AB + BC + AC
    const and1 = createComponent('AND', 220, 60);
    state.components.push(and1);
    const and2 = createComponent('AND', 220, 180);
    state.components.push(and2);
    const and3 = createComponent('AND', 220, 300);
    state.components.push(and3);

    const or1 = createComponent('OR', 380, 120);
    state.components.push(or1);
    const or2 = createComponent('OR', 380, 260);
    state.components.push(or2);

    // Final OR (or1 output | or2 output doesn't work with 2-input OR chain)
    // Actually: AB + BC + AC = OR(OR(AB, BC), AC)
    // Let's use: or1 = OR(AB, BC), or2 = OR(or1, AC)
    const led = createComponent('LED', 520, 180);
    state.components.push(led);
    const probe = createComponent('PROBE', 520, 240);
    probe.label = 'MAJ'; state.components.push(probe);

    // A & B
    addWire(sw1.id, 0, and1.id, 0);
    addWire(sw2.id, 0, and1.id, 1);
    // B & C
    addWire(sw2.id, 0, and2.id, 0);
    addWire(sw3.id, 0, and2.id, 1);
    // A & C
    addWire(sw1.id, 0, and3.id, 0);
    addWire(sw3.id, 0, and3.id, 1);

    // OR(AB, BC)
    addWire(and1.id, 0, or1.id, 0);
    addWire(and2.id, 0, or1.id, 1);

    // OR(or1, AC)
    addWire(or1.id, 0, or2.id, 0);
    addWire(and3.id, 0, or2.id, 1);

    // Output
    addWire(or2.id, 0, led.id, 0);
    addWire(or2.id, 0, probe.id, 0);

    toggleProbe(probe.id);
}

/* ========== Local Storage Persistence ========== */
const STORAGE_KEY = 'digital-logic-playground-v1';

function saveToLocalStorage() {
    try {
        const data = {
            components: state.components.map(c => ({
                id: c.id, type: c.type, x: c.x, y: c.y, w: c.w, h: c.h,
                inputCount: c.inputCount, outputCount: c.outputCount,
                inputVals: c.inputVals, outputVals: c.outputVals,
                internalState: c.internalState, label: c.label,
            })),
            wires: state.wires,
            nextId: state.nextId,
            probedIds: [...state.probedIds],
            zoom: state.zoom,
            panX: state.panX,
            panY: state.panY,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
        // localStorage might be full or unavailable
    }
}

function loadFromLocalStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);

        state.components = data.components || [];
        state.wires = data.wires || [];
        state.nextId = data.nextId || 1;
        state.probedIds = new Set(data.probedIds || []);
        state.zoom = data.zoom || 1;
        state.panX = data.panX || 0;
        state.panY = data.panY || 0;

        // Rebuild waveHistory for probed components
        state.waveHistory = [];
        state.probedIds.forEach(id => {
            const comp = getCompById(id);
            if (comp) {
                state.waveHistory.push({ name: comp.label + '#' + comp.id, compId: id, values: [] });
            }
        });

        return true;
    } catch (e) {
        return false;
    }
}

/* ========== Prevent Middle-Click Scroll ========== */
canvas.addEventListener('mousedown', (e) => {
    if (e.button === 1) e.preventDefault();
});

/* ========== Window Resize ========== */
window.addEventListener('resize', () => {
    resizeCanvas();
    resizeWaveCanvas();
});

/* ========== Initialize ========== */
buildPalette();
resizeCanvas();
resizeWaveCanvas();

const loaded = loadFromLocalStorage();
if (loaded) {
    propagate();
    zoomInfo.textContent = Math.round(state.zoom * 100) + '%';
}

draw();
drawWaveform();
updateInfoPanel();

// GSAP entrance animation
gsap.from('.palette-panel', { x: -240, opacity: 0, duration: 0.5, ease: 'power2.out' });
gsap.from('.control-panel', { x: 280, opacity: 0, duration: 0.5, ease: 'power2.out', delay: 0.1 });
gsap.from('.canvas-toolbar', { y: -40, opacity: 0, duration: 0.4, ease: 'back.out(1.7)', delay: 0.3 });

} // end init
